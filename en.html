<style>
/* v2: same index rail + one reading column, but rebuilt for comfortable reading:
   larger type, whitespace instead of boxes, fixed-ratio photo frames, diagrams in the flywheel language. */
:root{
  --bg:#F2F2EE; --surface:#FFFFFF; --ink:#141619; --text:#24272C; --muted:#5C626A; --faint:#80868E;
  --line:#D8DAD3; --hair:#E4E5DF; --soft:#F7F7F4; --th:#ECEFF6;
  --accent:#2340C4; --accent-ink:#FFFFFF; --accent-soft:#E3E8FA; --accent-line:#B4C1F0;
  --good:#1C7549; --good-soft:#E2F1E7; --warn:#8F5600; --warn-soft:#F9EFD9; --risk:#AE2A20; --risk-soft:#F9E4E0; --info-soft:#E8ECF6;
  --z-art:#DCE3FB; --z-sale:#F4F4F0; --z-service:#DBEFE1; --z-back:#E2E3DF;
  --display:"Newsreader","Iowan Old Style","Times New Roman",serif;
  --body:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
  --rhythm:68px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1012; --surface:#17191C; --ink:#EEEFF1; --text:#D8DBE0; --muted:#9CA3AD; --faint:#7C838D;
  --line:#2D3137; --hair:#25282D; --soft:#1C1F23; --th:#1D2230;
  --accent:#8FA3FF; --accent-ink:#0F1012; --accent-soft:#1E2649; --accent-line:#3B4885;
  --good:#5CC38C; --good-soft:#13261A; --warn:#E2A64C; --warn-soft:#2A2111; --risk:#F08B80; --risk-soft:#2D1614; --info-soft:#1A1F2B;
  --z-art:#202A55; --z-sale:#1E2125; --z-service:#15291C; --z-back:#282B30; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1012; --surface:#17191C; --ink:#EEEFF1; --text:#D8DBE0; --muted:#9CA3AD; --faint:#7C838D;
  --line:#2D3137; --hair:#25282D; --soft:#1C1F23; --th:#1D2230;
  --accent:#8FA3FF; --accent-ink:#0F1012; --accent-soft:#1E2649; --accent-line:#3B4885;
  --good:#5CC38C; --good-soft:#13261A; --warn:#E2A64C; --warn-soft:#2A2111; --risk:#F08B80; --risk-soft:#2D1614; --info-soft:#1A1F2B;
  --z-art:#202A55; --z-sale:#1E2125; --z-service:#15291C; --z-back:#282B30; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
p{margin:0}
h1,h2,h3{color:var(--ink)}
.muted{color:var(--muted)}

/* ---------- app frame */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:26px 22px 40px}
.brand{display:grid;gap:4px;margin-bottom:20px}
.brand .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand .name{font-family:var(--display);font-size:26px;line-height:1.12;font-weight:500;color:var(--ink)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink);font:inherit;font-size:14.5px}
.navg{margin-top:22px}
.navg h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.navg a{display:block;padding:6px 10px;margin-inline:-10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.45}
.navg a:hover{background:var(--soft)}
.navg a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sidefoot{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.55}
.topbar{display:none;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:12px}
.topbar .t{font-family:var(--display);font-size:19px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:9px}
.burger{width:14px;height:10px;border-top:2px solid currentColor;border-bottom:2px solid currentColor;position:relative}
.burger::after{content:"";position:absolute;left:0;right:0;top:2px;border-top:2px solid currentColor}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(10,11,13,.4)}
main{min-width:0;padding:52px clamp(20px,4.2vw,64px) 120px}
.wrap{max-width:1060px;margin-inline:auto;container-type:inline-size;container-name:wrap;min-width:0}

/* ---------- page head */
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-weight:500;font-size:clamp(34px,3.7vw,50px);line-height:1.06;letter-spacing:-.012em;margin:10px 0 16px;text-wrap:balance;max-width:20em}
.lead{font-size:19px;line-height:1.62;color:var(--ink);max-width:62ch}
.toc{margin-top:30px;display:grid;gap:10px}
.toc-h{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.toc-c{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.tchip{flex:none;display:inline-block;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.tchip:hover{border-color:var(--accent);color:var(--accent)}
@container wrap (min-width:600px){ .toc-c{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none} }

/* ---------- section rhythm */
.block{margin-top:var(--rhythm);scroll-margin-top:28px;min-width:0}
.block.hd{border-top:1px solid var(--line);padding-top:28px}
.kick{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 10px}
h2{font-family:var(--display);font-weight:500;font-size:27px;line-height:1.16;letter-spacing:-.006em;margin:0 0 22px;text-wrap:balance;max-width:30em}
@container wrap (min-width:600px){ h2{font-size:32px;margin-bottom:26px} }
h3{font-size:17px;line-height:1.4;margin:0;font-weight:600}
.lab{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px;line-height:1.5}
.note{font-size:14px;color:var(--muted);margin-top:16px;max-width:80ch;line-height:1.6}
.nd{font-weight:600;color:var(--accent)}
.src1{font-size:.86em;color:var(--warn);white-space:nowrap}
.prose{display:grid;gap:16px;max-width:68ch}
ul.bl{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.bl li{position:relative;padding-left:20px}
ul.bl li::before{content:"";position:absolute;left:3px;top:calc(.85em - 3px);width:6px;height:6px;border-radius:50%;background:var(--accent)}
ul.bl.sm li{font-size:14.5px;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;line-height:1.6;border-radius:99px;padding:1px 9px;color:var(--muted);background:var(--soft);border:1px solid var(--hair)}

/* ---------- source references: at most 3 shown, rest behind +N */
sup.s{font-size:.62em;line-height:0;vertical-align:super;margin-left:.3em;font-weight:600;letter-spacing:0;font-style:normal;white-space:nowrap}
sup.s .rest{white-space:normal}
sup.s a,sup.s .n,sup.s .more{color:var(--muted);text-decoration:none;background:var(--soft);border:1px solid var(--hair);border-radius:4px;padding:.05em .38em;font-variant-numeric:tabular-nums}
sup.s a:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
sup.s .more{font:inherit;line-height:1.25;cursor:pointer;margin:0;vertical-align:baseline}
sup.s .more:hover{color:var(--accent);border-color:var(--accent-line)}

/* ---------- photos: fixed-ratio frames, cover crop, lightbox on click */
.fig{margin:0;min-width:0}
.frame{display:block;position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:10px;background:var(--soft);padding:0;border:0;cursor:zoom-in;appearance:none}
.frame.r32{aspect-ratio:3/2} .frame.r169{aspect-ratio:16/9} .frame.r21{aspect-ratio:21/9}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.frame:hover img{transform:scale(1.025)}
.fig figcaption{font-size:13px;line-height:1.5;color:var(--muted);margin-top:9px}
.fig .cr{color:var(--faint)}
.fig .cr a{color:inherit}

/* gallery: uniform 12-col grid, rows balanced so there are no holes */
.gal{display:grid;grid-template-columns:minmax(0,1fr);gap:24px 18px}
.gal.one{max-width:760px}
@container wrap (min-width:600px){
  .gal{grid-template-columns:repeat(12,minmax(0,1fr))}
  .gal>.fig{grid-column:span var(--st,6)}
  .gal.one{grid-template-columns:minmax(0,1fr)}
  .gal.one>.fig{grid-column:auto}
}
@container wrap (min-width:900px){
  .gal>.fig{grid-column:span var(--sd,4)}
  .gal>.fig.gbig{grid-row:span 2;display:flex;flex-direction:column}
  .gal>.fig.gbig .frame{flex:1 1 auto;aspect-ratio:auto;min-height:280px}
}

/* ---------- summary rows */
.sum{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);column-gap:52px}
.sum li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:18px 0 20px;border-top:1px solid var(--hair)}
.sum li:first-child{border-top:0;padding-top:2px}
.sn{font-family:var(--display);font-size:25px;line-height:1.05;color:var(--accent);font-variant-numeric:lining-nums tabular-nums}
.st{font-size:17.5px;line-height:1.42;margin-bottom:5px}
@container wrap (min-width:880px){
  .sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sum li{grid-template-columns:46px minmax(0,1fr)}
  .sum li:nth-child(2){border-top:0;padding-top:2px}
  .sn{font-size:27px}
}

/* ---------- media and story: image beside its claim */
.media{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.mtx{display:grid;gap:14px;align-content:start;max-width:68ch;min-width:0}
.mtx h3{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.22}
.story{display:grid;gap:52px}
@container wrap (min-width:640px){
  .media{grid-template-columns:minmax(0,45fr) minmax(0,55fr);gap:36px}
  .media.imgr{grid-template-columns:minmax(0,55fr) minmax(0,45fr)}
  .media.imgr>.fig{order:2}
  .story{gap:60px}
}
dl.facts{margin:4px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:10px;overflow:hidden}
dl.facts>div{background:var(--surface);padding:10px 14px;min-width:0}
dl.facts>div:last-child:nth-child(odd){grid-column:1/-1}
dl.facts dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
dl.facts dd{margin:2px 0 0;font-weight:600;color:var(--ink);font-size:15.5px;line-height:1.45}

/* ---------- timeline and years: vertical rail */
.tl,.yrs{list-style:none;margin:0;padding:0}
.tl>li,.yr{display:grid;grid-template-columns:minmax(0,1fr);row-gap:6px;position:relative;padding:0 0 32px 30px}
.tl>li::before,.yr::before{content:"";position:absolute;left:5px;top:14px;bottom:-14px;width:2px;background:var(--line)}
.tl>li:last-child::before,.yr:last-child::before{display:none}
.tl>li::after,.yr::after{content:"";position:absolute;left:0;top:8px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent)}
.tw,.yw{font-family:var(--display);font-size:20px;line-height:1.25;color:var(--accent);font-variant-numeric:lining-nums}
.tc{display:grid;gap:6px;max-width:66ch;min-width:0}
.tc h3{font-size:17.5px}
.tc p{font-size:16px}
.tlth{width:160px;height:120px;aspect-ratio:auto;border-radius:8px}
@container wrap (min-width:600px){
  .tl>li,.yr{grid-template-columns:96px minmax(0,1fr);column-gap:34px;padding-left:0}
  .tl>li.has-th{grid-template-columns:96px minmax(0,1fr) 160px}
  .tl>li::before,.yr::before{left:112px}
  .tl>li::after,.yr::after{left:107px}
  .tw,.yw{text-align:right;font-size:22px}
}
.yb{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.yg,.yx{border-radius:12px;padding:13px 17px 15px}
.yg{background:var(--good-soft)} .yx{background:var(--risk-soft)}
.yg .lab{color:var(--good)} .yx .lab{color:var(--risk)}
.yg p,.yx p,.yg li,.yx li{font-size:15.5px;line-height:1.62;color:var(--ink)}
.yev{grid-column:1/-1;font-size:13.5px;color:var(--muted);line-height:1.6}
details.yev summary{cursor:pointer;font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:8px}
details.yev summary::-webkit-details-marker{display:none}
details.yev summary::before{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 1.8px 1.8px 0;transform:rotate(-45deg);transition:transform .15s}
details.yev[open] summary::before{transform:rotate(45deg)}
details.yev p{margin-top:6px}
@container wrap (min-width:600px){ .yb{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} }

/* ---------- phases: numbered stages on a cobalt rail */
.ph{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:14px;position:relative;padding-bottom:46px}
.ph::before{content:"";position:absolute;left:16px;top:40px;bottom:6px;width:2px;background:var(--accent-line)}
.ph:last-child::before{display:none}
.ph-n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:500 18px/1 var(--display)}
.ph-c{display:grid;gap:18px;min-width:0}
.ph-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;padding-top:2px}
.ph-h h3{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.2}
.chip{display:inline-block;font-size:12px;letter-spacing:.05em;font-weight:700;border-radius:6px;padding:3px 9px;background:var(--accent-soft);color:var(--accent);line-height:1.5}
.ph-sum{max-width:70ch}
.ph-did ul.bl{display:block}
.ph-did ul.bl li{margin-bottom:8px;break-inside:avoid;font-size:15.5px;line-height:1.62}
.gb{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.gb ul.bl li::before{background:currentColor;opacity:.5}
.ph-num{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:13px 17px;font-size:15.5px;line-height:1.62}
.ph-next{background:var(--accent-soft);border-radius:12px;padding:13px 17px;font-size:15.5px;line-height:1.62;color:var(--ink)}
.ph-next .lab{color:var(--accent)}
@container wrap (min-width:640px){
  .ph{grid-template-columns:44px minmax(0,1fr);column-gap:22px}
  .ph::before{left:21px;top:52px}
  .ph-n{width:44px;height:44px;font-size:21px}
  .ph-h{padding-top:6px}
  .ph-h h3{font-size:26px}
  .gb{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@container wrap (min-width:900px){ .ph-did ul.bl{columns:2;column-gap:40px} }

/* ---------- flow: numbered white boxes joined by cobalt arrows */
.flow{display:grid}
.frow{display:grid;grid-template-columns:minmax(0,1fr);align-items:stretch}
.fstep{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.fstep .frame{border-radius:0;margin-top:auto}
.fb{padding:16px 18px 18px;display:grid;gap:7px;align-content:start}
.fn{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 14px/1 var(--body)}
.fstep h3{font-family:var(--display);font-weight:500;font-size:20px;line-height:1.25}
.fstep p{font-size:15px;line-height:1.62}
.farr,.fturn{display:flex;justify-content:center;align-items:center;min-height:38px}
.farr svg,.fturn svg{display:block;overflow:visible}
.ah-h{display:none!important}
.fturn i{display:none}
@container wrap (min-width:760px){
  .frow{grid-template-columns:var(--tpl)}
  .farr{min-height:0}
  .ah-h{display:block!important;width:44px;height:14px}
  .ah-v{display:none!important}
  .fturn{--half:calc((100% - (var(--cols) - 1) * 44px) / (2 * var(--cols)));position:relative;height:48px;min-height:0;display:block}
  .fturn::before{content:"";position:absolute;top:0;height:calc(50% + 1px);left:calc(var(--half) + 10px);right:calc(var(--half) - 1px);border:solid var(--accent);border-width:0 2.2px 2.2px 0;border-bottom-right-radius:12px}
  .fturn::after{content:"";position:absolute;top:calc(50% - 1.1px);bottom:8px;left:calc(var(--half) - 1.1px);width:12px;border:solid var(--accent);border-width:2.2px 0 0 2.2px;border-top-left-radius:12px}
  .fturn i{display:block;position:absolute;left:calc(var(--half) - 6px);bottom:0;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--accent)}
}

/* ---------- mindmap: cobalt core, white branches, cobalt connectors */
.mm{display:grid;gap:12px}
.mm-c{order:-1}
.mm-side{display:grid;gap:12px;min-width:0}
.mm-b{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px 14px;min-width:0}
.mm-b h3{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.25}
.mm-b ul{margin:6px 0 0;padding:0 0 0 18px;font-size:14.5px;line-height:1.55;display:grid;gap:3px}
.mm-b li::marker{color:var(--accent)}
.mm-core{position:relative;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px 18px;text-align:center;display:grid;gap:4px}
.mm-core b{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.2}
.mm-core span{font-size:14px;line-height:1.5;opacity:.92}
@container wrap (max-width:759px){
  .mm-side{padding-left:24px}
  .mm-b::before{content:"";position:absolute;left:-18px;top:-13px;bottom:-1px;width:2px;background:var(--accent)}
  .mm-b::after{content:"";position:absolute;left:-18px;top:50%;width:18px;height:2px;background:var(--accent)}
  .mm-r .mm-b:last-child::before,.mm.one .mm-l .mm-b:last-child::before{bottom:50%}
}
@container wrap (min-width:760px){
  .mm{grid-template-columns:minmax(0,1fr) 56px minmax(170px,230px) 56px minmax(0,1fr);gap:0;align-items:center}
  .mm-l{grid-column:1;grid-row:1} .mm-c{grid-column:3;grid-row:1} .mm-r{grid-column:5;grid-row:1}
  .mm-side{gap:16px}
  .mm-l .mm-b::after{content:"";position:absolute;top:calc(50% - 1px);left:100%;width:29px;height:2px;background:var(--accent)}
  .mm-r .mm-b::after{content:"";position:absolute;top:calc(50% - 1px);right:100%;width:29px;height:2px;background:var(--accent)}
  .mm-l .mm-b::before{content:"";position:absolute;left:calc(100% + 27px);width:2px;background:var(--accent);top:-9px;bottom:-9px}
  .mm-r .mm-b::before{content:"";position:absolute;right:calc(100% + 27px);width:2px;background:var(--accent);top:-9px;bottom:-9px}
  .mm-side .mm-b:first-child::before{top:calc(50% - 1px)}
  .mm-side .mm-b:last-child::before{bottom:calc(50% - 1px)}
  .mm-side .mm-b:only-child::before{display:none}
  .mm-core{padding:22px 18px}
  .mm-core::before{content:"";position:absolute;top:calc(50% - 1px);right:100%;width:28px;height:2px;background:var(--accent)}
  .mm-core::after{content:"";position:absolute;top:calc(50% - 1px);left:100%;width:28px;height:2px;background:var(--accent)}
  .mm.one .mm-core::after{display:none}
}

/* ---------- anatomy: illustrative floor plan */
.an-note{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:4px 12px;margin-bottom:16px;line-height:1.5}
.an-note::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.an-plan{position:relative;max-width:880px;margin:0 0 42px}
.an-plan svg{display:block;width:100%;height:auto;overflow:visible}
.an-out{fill:var(--surface);stroke:var(--muted);stroke-width:.4}
.az rect{stroke:var(--line);stroke-width:.22}
.az-art rect{fill:var(--z-art);stroke:var(--accent-line)} .az-sale rect{fill:var(--z-sale)} .az-service rect{fill:var(--z-service)} .az-back rect{fill:var(--z-back)}
.az-id{fill:var(--ink);font-family:var(--display);font-size:5px;font-weight:600}
.az-nm{display:none;fill:var(--text);font-family:var(--body);font-size:1.85px;font-weight:500}
.az-sh{display:none;fill:var(--muted);font-family:var(--body);font-size:1.7px;font-weight:700}
.ad{stroke:var(--accent);stroke-width:1.5;stroke-linecap:round}
.adh{fill:var(--accent)}
.an-door{position:absolute;top:calc(100% + 8px);transform:translateX(-50%);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);white-space:nowrap;line-height:1.4}
.an-keys{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);margin:0 0 14px}
.ak{display:inline-flex;align-items:center;gap:7px}
.ak i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
i.az-art,.al-id.az-art{background:var(--z-art)} i.az-sale,.al-id.az-sale{background:var(--z-sale)} i.az-service,.al-id.az-service{background:var(--z-service)} i.az-back,.al-id.az-back{background:var(--z-back)}
.an-leg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:0 36px}
.an-leg li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;padding:13px 0;border-top:1px solid var(--hair)}
.al-id{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;font:600 17px/1 var(--display);color:var(--ink);border:1px solid var(--line)}
.an-leg b{color:var(--ink)}
.al-sh{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);border:1px solid var(--hair);border-radius:99px;padding:0 8px;line-height:1.6}
.an-leg p{font-size:15px;line-height:1.62;margin-top:3px}
@container wrap (min-width:600px){
  .az-id{font-size:3.4px}
  .az-nm,.az-sh{display:inline}
  .an-leg{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ---------- cards and principles: uniform equal-height grid */
.grid3{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@container wrap (min-width:600px){ .grid3{grid-template-columns:repeat(12,minmax(0,1fr))} .grid3>*{grid-column:span var(--st,6)} }
@container wrap (min-width:900px){ .grid3>*{grid-column:span var(--sd,4)} }
.card{background:var(--surface);border:1px solid var(--hair);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .frame{border-radius:0}
.cb{padding:18px 20px 20px;display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.card h3{font-size:17px;line-height:1.38}
.card .meta{font-size:13px;color:var(--muted);line-height:1.5}
.card p{font-size:15px;line-height:1.62}
.cgb{border-top:1px solid var(--hair);padding-top:9px}
.cgb .lab{margin-bottom:3px}
.cgb.g .lab{color:var(--good)} .cgb.b .lab{color:var(--risk)}
.card .tags{margin-top:auto;padding-top:6px}
.pn{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 13px/1 var(--body);letter-spacing:.02em}
.rule{color:var(--ink)}
.card .why{font-size:14px;color:var(--muted);padding-top:2px}
.why b{color:var(--ink);font-weight:600}

/* ---------- compare: aligned rows */
.cmp{border-top:1px solid var(--line)}
.cmp-h{display:none}
.cmp-r{display:grid;grid-template-columns:minmax(0,1fr);border-bottom:1px solid var(--hair);padding:12px 0}
.cmp-r>div{font-size:15.5px;line-height:1.6;min-width:0}
.cmp-l{font-weight:700;color:var(--ink);margin-bottom:6px}
.cmp-a,.cmp-b{padding:8px 12px;border-radius:9px}
.cmp-b{background:var(--accent-soft);margin-top:6px}
.cmp-a::before,.cmp-b::before{content:attr(data-h);display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.cmp-b::before{color:var(--accent)}
@container wrap (min-width:640px){
  .cmp-h{display:grid;grid-template-columns:22% minmax(0,1fr) minmax(0,1fr);border-bottom:1.5px solid var(--ink)}
  .cmp-h>div{padding:12px 18px;font-family:var(--display);font-size:21px;line-height:1.25;color:var(--ink)}
  .cmp-h>div:last-child{color:var(--accent)}
  .cmp{border-top:0}
  .cmp-r{grid-template-columns:22% minmax(0,1fr) minmax(0,1fr);padding:0}
  .cmp-r>div{padding:14px 18px}
  .cmp-l{margin:0;padding-left:0!important}
  .cmp-a,.cmp-b{border-radius:0;margin:0}
  .cmp-b{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
  .cmp-a::before,.cmp-b::before{display:none}
}

/* ---------- do and don't */
.dd{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.dd-c{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:18px 20px 20px}
.dd-t{font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.dd-c.do .dd-t{color:var(--good)} .dd-c.dont .dd-t{color:var(--risk)}
.dd ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.dd li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;font-size:15.5px;line-height:1.6}
.ic{width:24px;height:24px;border-radius:50%;position:relative;margin-top:1px}
.ic.ok{background:var(--good-soft)}
.ic.ok::after{content:"";position:absolute;left:8.5px;top:5px;width:5.5px;height:10.5px;border:solid var(--good);border-width:0 2.4px 2.4px 0;transform:rotate(45deg)}
.ic.no{background:var(--risk-soft)}
.ic.no::before,.ic.no::after{content:"";position:absolute;left:11px;top:6px;width:2.4px;height:12px;background:var(--risk);border-radius:1px;transform:rotate(45deg)}
.ic.no::after{transform:rotate(-45deg)}
@container wrap (min-width:640px){ .dd{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px} }

/* ---------- tables: fixed layout, computed widths; cards on phone */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:15px;line-height:1.55}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:13px 16px;border-bottom:1px solid var(--hair);overflow-wrap:anywhere}
.tbl th{background:var(--th);font-size:13px;font-weight:700;color:var(--ink);line-height:1.4;letter-spacing:.01em}
.tbl tbody tr:nth-child(even) td{background:var(--soft)}
.tbl td:first-child{font-weight:600;color:var(--ink)}
.tbl table.dense th,.tbl table.dense td{padding:12px 12px;font-size:14.5px}
.tbl tr:last-child td{border-bottom:none}
@container wrap (max-width:639px){
  .tbl{border:0;background:transparent;overflow:visible;border-radius:0}
  .tbl table{min-width:0!important;table-layout:auto}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:auto}
  .tbl tr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:10px}
  .tbl tbody tr:nth-child(even) td{background:transparent}
  .tbl td{border:0;padding:5px 0}
  .tbl td::before{content:attr(data-l);display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;line-height:1.5}
  .tbl td:first-child{font-size:16px;padding-top:0}
  .tbl td:first-child::before{display:none}
  .tbl td:empty{display:none}
}

/* ---------- stats */
.stats{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.stat{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:18px 20px 20px;min-width:0}
.sv{font-family:var(--display);font-size:32px;line-height:1.08;color:var(--ink);letter-spacing:-.01em}
.sl{font-size:14.5px;color:var(--muted);margin-top:8px;line-height:1.55}
@container wrap (min-width:480px){ .stats{grid-template-columns:repeat(12,minmax(0,1fr))} .stat{grid-column:span var(--st,6)} }
@container wrap (min-width:900px){ .stat{grid-column:span var(--sd,4)} .sv{font-size:35px} }

/* ---------- quotes */
.qgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@container wrap (min-width:760px){ .qgrid.two{grid-template-columns:repeat(12,minmax(0,1fr))} .qgrid.two>*{grid-column:span var(--sq,6)} }
.q{margin:0;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:16px 22px 18px;display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.q::before{content:"\201C";font-family:var(--display);font-size:52px;line-height:1;height:24px;color:var(--accent);display:block}
.q blockquote{margin:0}
.qp{font-family:var(--display);font-size:19.5px;line-height:1.48;color:var(--ink)}
.qo{margin-top:10px;font-size:14px;line-height:1.6;color:var(--muted);font-style:italic}
.qby{margin-top:auto;padding-top:14px;font-size:13px;color:var(--muted);line-height:1.5}
.sent{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;margin-right:8px;line-height:1.6}
.sent.positive{background:var(--good-soft);color:var(--good)} .sent.negative{background:var(--risk-soft);color:var(--risk)} .sent.mixed{background:var(--warn-soft);color:var(--warn)}

/* ---------- callout: one tinted panel, never one box per paragraph */
.co{border-radius:16px;padding:22px 22px 14px;background:var(--info-soft)}
.co-good{background:var(--good-soft)} .co-warn{background:var(--warn-soft)} .co-risk{background:var(--risk-soft)}
.co-t{display:flex;align-items:center;gap:10px;font-size:18px;line-height:1.35;margin-bottom:14px;color:var(--accent)}
.co-good .co-t{color:var(--good)} .co-warn .co-t{color:var(--warn)} .co-risk .co-t{color:var(--risk)}
.co-i{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.co-l{list-style:none;margin:0;padding:0}
.co-l li{position:relative;padding-left:20px;margin-bottom:12px;break-inside:avoid;font-size:16px;line-height:1.65;color:var(--ink)}
.co-l li::before{content:"";position:absolute;left:2px;top:calc(.82em - 3px);width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.6}
.co-good li::before{background:var(--good)} .co-warn li::before{background:var(--warn)} .co-risk li::before{background:var(--risk)}
@container wrap (min-width:600px){ .co{padding:26px 30px 16px} }
@container wrap (min-width:900px){ .co-l.cols{columns:2;column-gap:48px} }

/* ---------- store profile */
.st-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.st-head h2{margin:0}
.code{font-size:12px;letter-spacing:.08em;font-weight:700;border-radius:6px;padding:3px 9px;background:var(--accent);color:var(--accent-ink);line-height:1.5}
.st-meta{color:var(--muted);font-size:15px;line-height:1.6;max-width:80ch;margin:10px 0 26px}
.st-prof{display:grid;grid-template-columns:minmax(0,1fr);gap:26px}
.st-gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;align-content:start}
.st-gal>.fig:first-child{grid-column:1/-1}
.st-gal.n2>.fig:first-child{grid-column:auto}
.st-gal .fig:not(:first-child) figcaption{font-size:12.5px}
.fl{list-style:none;margin:0;padding:0}
.fl li{padding:11px 0;border-top:1px solid var(--hair);font-size:15.5px;line-height:1.6}
.fl li:first-child{border-top:0;padding-top:0}
.st-secs{display:grid;gap:34px;margin-top:38px}
.nl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:14px 36px}
.nl li{padding-top:12px;border-top:1px solid var(--hair);min-width:0}
.nl b{display:block;color:var(--ink);font-size:15.5px;line-height:1.45;margin-bottom:3px}
.nl b.when{color:var(--accent);font-size:13.5px;letter-spacing:.02em}
.nl p{font-size:15px;line-height:1.62}
.ckl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);column-gap:36px}
.ckl li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--hair);font-size:15px;line-height:1.58;min-width:0}
.cid{font:700 11.5px/1.9 var(--body);letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 7px;height:fit-content;white-space:nowrap}
.go-btn{display:inline-flex;align-items:center;gap:12px;margin-top:16px;padding:10px 16px;border-radius:10px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:14.5px;line-height:1.4}
.go-btn:hover{filter:brightness(1.08)}
.chev{width:7px;height:7px;border:solid currentColor;border-width:2px 2px 0 0;transform:rotate(45deg);flex:none}
@container wrap (min-width:760px){ .nl{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container wrap (min-width:820px){ .st-prof{grid-template-columns:minmax(0,57fr) minmax(0,43fr);gap:36px} }
@container wrap (min-width:900px){ .ckl.two{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ---------- theme */
.th-meta{margin:-12px 0 16px}
.freq{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);line-height:1.6}
.verdict{font-size:17.5px;line-height:1.65;color:var(--ink);max-width:68ch;margin-bottom:22px}
.t-theme .gal{margin-top:22px}

/* ---------- flywheel (unchanged from v1) */
.fly-svg{display:none;max-width:900px}
.fly-list{display:block}
.fly-svg svg{width:100%;height:auto}
.fw-node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.fw-core{fill:var(--accent)}
.fw-t{fill:var(--ink);font-family:var(--body);font-size:14px}
.fw-tb{fill:var(--ink);font-family:var(--display);font-size:19px}
.fw-c{fill:var(--accent-ink);font-family:var(--body);font-size:13.5px}
.fw-cb{fill:var(--accent-ink);font-family:var(--display);font-size:19px}
.fw-a{stroke:var(--accent);stroke-width:2.2;fill:none}
.fw-ah{fill:var(--accent)}
.fw-cap{fill:var(--muted);font-family:var(--body);font-size:12.5px;font-style:italic}
.fly-list ol{margin:0;padding-left:20px;display:grid;gap:10px}
@container wrap (min-width:640px){ .fly-svg{display:block} .fly-list{display:none} }

/* ---------- elements of the formula */
.el{padding:34px 0 40px;border-top:1px solid var(--hair);scroll-margin-top:28px}
.el:first-child{border-top:0;padding-top:4px}
.elh{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.eln{font-family:var(--display);font-size:44px;line-height:.92;color:var(--accent);min-width:30px}
.elh h3{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.2}
.layer{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:3px}
.elg{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.eli{display:grid;gap:10px;align-content:start}
.eli .thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.eli .thumbs .frame{border-radius:7px}
.elt{display:grid;gap:12px;align-content:start;max-width:68ch}
.claim{font-size:17.5px;color:var(--ink);line-height:1.62}
.elt ul.bl li{font-size:15.5px;line-height:1.62}
.elb{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:22px}
.box{border-radius:12px;padding:13px 17px 15px;font-size:15px;line-height:1.6;color:var(--ink)}
.box.v{background:var(--info-soft)} .box.h{background:var(--warn-soft)}
.box.v .lab{color:var(--accent)} .box.h .lab{color:var(--warn)}
@container wrap (min-width:600px){ .elb{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container wrap (min-width:720px){ .elg.has-img{grid-template-columns:minmax(0,44fr) minmax(0,56fr);gap:34px} .elh h3{font-size:27px} .eln{font-size:52px} }

/* ---------- verify checklist */
.vsum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.vsum span{font-size:13.5px;border-radius:99px;padding:4px 12px;background:var(--surface);border:1px solid var(--line)}
.vavail{font-size:13.5px;color:var(--muted);margin-bottom:16px;max-width:70ch}
.vchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.vchips a{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.04em}
.vchips a span{font-weight:500;color:var(--muted);letter-spacing:0}
.vg{margin-top:36px;scroll-margin-top:28px}
.vg h3{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--display);font-weight:500;font-size:23px;line-height:1.25;margin-bottom:4px}
.vg h3 .chip{font-family:var(--body)}
.vitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;display:grid;gap:10px;scroll-margin-top:28px}
.vitem.ok{background:var(--good-soft);border-color:transparent} .vitem.no{background:var(--risk-soft);border-color:transparent} .vitem.unclear{background:var(--warn-soft);border-color:transparent}

/* ---------- cover: collage (Francis Bacon ref) ---------- */
.jhero{container-type:inline-size;position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));height:clamp(560px,52vw,760px);margin:-54px calc(-1 * clamp(20px,4.2vw,64px)) 0;background:#050505;color:var(--ink);overflow:hidden}
.jhero figure{margin:0;position:relative;overflow:hidden;background:#141210}
.jhero figure img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.jh-a{grid-column:1/6;grid-row:1/6}
.jh-a img{object-position:30% 50%}
.jh-b{grid-column:4/8;grid-row:5/11;z-index:1;box-shadow:0 0 0 6px #050505}

.jh-ttl{grid-column:8/13;grid-row:5/11;align-self:end;padding:0 clamp(18px,3vw,44px) clamp(22px,3vw,40px) clamp(10px,1.5vw,20px);z-index:2}
.jh-ttl small{display:block;font:400 11px var(--mono);color:var(--muted);margin-bottom:8px}
.jh-ttl h2.jh-h{margin:0;white-space:nowrap;font:400 clamp(64px,17cqw,260px)/.82 var(--cond);text-transform:uppercase;letter-spacing:.005em;color:var(--ink)}

.jh-ttl a:hover{color:var(--accent)}

/* ---------- index: staggered white plates (HAUS ref) ---------- */
.jidx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.4vw,20px);align-items:start;margin:0 calc(-1 * clamp(20px,4.2vw,64px)) 80px;padding:clamp(40px,5vw,72px) clamp(20px,4.2vw,64px) 0;background:#050505}

g", "w": 1200, "h": 799, "cap": "Seurat, A Sunday on La Grande Jatte, 1884–1886 · Art Institute of Chicago", "credit": "Wikimedia Commons, public domain", "page": "https://commons.wikimedia.org/wiki/File:A_Sunday_on_La_Grande_Jatte,_Georges_Seurat,_1884.jpg"}, "v1-0707": {"file": "v1-0707.jpg", "w": 800, "h": 450, "cap": "Episode 1, 11:47: Courbet (left) and Renoir (right)", "credit": "Video frame from the Art d'Histoire lecture, used for citation"}, "v1-0757": {"file": "v1-0757.jpg", "w": 800, "h": 450, "cap": "Episode 1, 12:37: Courbet, L'Après-dînée à Ornans and Renoir, À l'auberge de la mère Anthony", "credit": "Video frame from the Art d'Histoire lecture, used for citation"}, "v1-1097": {"file": "v1-1097.jpg", "w": 800, "h": 450, "cap": "Episode 1, 18:17: three sky studies by Boudin", "credit": "Video frame from the Art d'Histoire lecture, used for citation"}, "v3-0277": {"file": "v3-0277.jpg", "w": 800, "h": 449, "cap": "Episode 3, 4:37: list of exhibitors in 1874", "credit": "Video frame from the Art d'Histoire lecture, used for citation"}, "v4-0065": {"file": "v4-0065.jpg", "w": 800, "h": 449, "cap": "Episode 4, 1:05: the two Grenouillères, Renoir and Monet", "credit": "Video frame from the Art d'Histoire lecture, used for citation"}}, "pages": {"overview": {"page": "overview", "title": "Overview", "group": "Start", "lead": "Impressionism was not a school with a manifesto, a leader and a shared style. Art d'Histoire's four lectures untangle one preconception after another: it was a group of art-school friends who organised eight exhibitions themselves to sell their work, and the name “Impressionist” was a jibe they ended up keeping.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, episode 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 min)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, episode 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 min)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, episode 3: “Les huit expositions impressionnistes” (YouTube, 26 min)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, episode 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 min)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Additional art-historical knowledge beyond the four lectures, compiled by the editor", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), the main reference cited in episode 4", "date": "2000"}], "blocks": [{"type": "summary", "title": "5 key ideas from the four lectures", "items": [{"title": "Not as rebellious as the story goes", "text": "The official Salon was in decline; Courbet (1855) and Manet (1867) had already exhibited on their own; the dealer Durand-Ruel backed them commercially. According to the lecturer, the young group “followed a movement”, however brilliantly.", "src": [0]}, {"title": "There were forerunners", "text": "Delacroix taught that shadows are complementary colours and that small strokes should not be blended; Courbet taught self-exhibiting and selling small pictures; Boudin taught holding on to the “first impression”; Jongkind “educated the eye” of Monet.", "src": [0]}, {"title": "A group of friends, not a school", "text": "They met at the Académie Suisse and Gleyre's studio, shared lodgings and lent each other money. No charter, no imposed subject, no imposed style, quite unlike Cubism or Futurism later on.", "src": [1]}, {"title": "Eight exhibitions, many participants not “impressionist”", "text": "From 1874 to 1886, Degas brought in realist painters; Monet, Renoir and Sisley repeatedly left to submit to the Salon; Manet never took part. The list of exhibitors does not match a single style.", "src": [2]}, {"title": "In the narrow sense, “impression” means painting quickly", "text": "A picture made in two or three sessions, with a few dozen to about a hundred brushstrokes. Monet in the 1870s made many, Renoir few, Degas almost none. To hold the whole group, the label has to be very elastic.", "src": [3, 5]}]}, {"type": "diagram", "title": "How “Impressionism” came about, in one diagram", "img": "d01", "note": "Diagram reconstructed by the editor from the argument of the four lectures."}, {"type": "story", "title": "In depth: four episodes, four layers of truth", "items": [{"title": "Episode 1 · The forerunners (1850–1865)", "img": "dela-dieppe", "caption": "Delacroix, The Sea from the Heights of Dieppe, 1852", "paras": ["The lecturer opens with an irritation: art magazines keep calling the Impressionists “rebels”, “avant-garde”, “intransigeant”. The lecture only wants to “put things back in their place”.", "Four forerunners are chosen: Delacroix for the colour theory in his journal; Courbet for his independent character and the lesson of selling small pictures at Trouville; Boudin and Jongkind because they painted the Normandy coast right beside the young Monet."], "src": [0]}, {"title": "Episode 2 · The friends (1862–1870)", "img": "bazille-atelier", "caption": "Bazille, The Studio on the Rue La Condamine, 1870", "paras": ["Those later called Impressionists were “school friends”. Each admired a different master: Degas had Ingres, Monet had Normandy, Pissarro had Corot.", "Bazille, from a well-off Montpellier family, rented large studios and put up Renoir and Monet. Yet he himself painted in an academic manner, with preparatory drawings. He was killed at the front in 1870, before the group could exhibit."], "src": [1]}, {"title": "Episode 3 · Eight exhibitions (1874–1886)", "img": "nadar-capucines", "caption": "Nadar's photography studio, 35 boulevard des Capucines, venue of the first exhibition", "paras": ["Repeatedly rejected by the Salon, the group set up a “société anonyme” to exhibit and sell on their own. The first show in 1874 had around thirty exhibitors, most of them not Impressionists.", "The name came from a humorous article: Louis Leroy mocked Monet's Impression, soleil levant. Over the following shows, Degas brought in realists, Monet and Renoir walked out, and Seurat arrived at the last one."], "src": [2]}, {"title": "Episode 4 · What an impression really is", "img": "monet-grenouillere", "caption": "Monet, La Grenouillère, 1869", "paras": ["If an “impression” is defined as a picture painted very quickly to record an image just received, only part of the group's work qualifies: about a quarter of Monet's 1870s paintings, a rare few by Renoir, almost none by Degas.", "Many works now seen as Impressionist masterpieces were merely “pochades” (sketches) intended for a larger picture. The lecturer calls it an art “born of an accident”: there was no money to finish them."], "src": [3]}]}, {"type": "gallery", "title": "Four paintings that sum up the story", "items": [{"img": "boudin-trouville", "caption": "Boudin, around 1865: the beach and sky of Normandy"}, {"img": "monet-grenouillere", "caption": "Monet, 1869: painting beside Renoir at La Grenouillère"}, {"img": "monet-impression", "caption": "Monet, 1872: the picture that named the whole group"}, {"img": "degas-rehearsal", "caption": "Degas, 1874: the group's “organiser” was a draughtsman"}]}, {"type": "stats", "title": "A few figures from the lectures", "items": [{"value": "8", "label": "Exhibitions from 1874 to 1886", "src": [2]}, {"value": "≈30", "label": "Artists at the first show, with about 250 works; only a small group were Impressionists", "src": [2]}, {"value": "52", "label": "Press articles on the first show; only 5 openly hostile", "src": [2]}, {"value": "2 hours", "label": "“Two hours' work and it's sold”: Courbet on his small Trouville pictures", "src": [0]}, {"value": "2.500 F", "label": "The price Bazille paid for Monet's Femmes au jardin, at 50 francs a month", "src": [1]}, {"value": "≈ ¼", "label": "Share of Monet's 1870s paintings that are truly “painted quickly”, according to the specialists cited in episode 4", "src": [3, 5]}]}, {"type": "callout", "tone": "info", "title": "Quotes chosen as the spirit of the lectures", "items": ["Boudin: “Three strokes of the brush from nature are worth more than two days' work at the easel.”", "Monet on Jongkind: “It is to him that I owe the definitive education of my eye.”", "The lecturer concludes: the “Impressionist” label needs to be “particularly flexible” to cover all these styles, subjects and ways of painting."]}]}, "myths": {"page": "myths", "title": "Five myths to untangle", "group": "Context", "lead": "The press and popular books often present the Impressionists as rebels sharing one style and one leader. Episode 1 begins by taking these preconceptions apart one by one.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, episode 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 min)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, episode 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 min)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, episode 3: “Les huit expositions impressionnistes” (YouTube, 26 min)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, episode 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 min)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Additional art-historical knowledge beyond the four lectures, compiled by the editor", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), the main reference cited in episode 4", "date": "2000"}], "blocks": [{"type": "compare", "title": "Myth and reality", "left": "Popular myth", "right": "According to the lectures", "rows": [{"label": "Rebels", "left": "Overthrew the Salon, broke with tradition", "right": "The Salon was already in decline; Courbet and Manet had exhibited on their own first; a dealer stood behind them. They followed a movement", "src": [0]}, {"label": "Marriage", "left": "Marrying outside one's class or religion as an act of protest", "right": "A practical choice: a working-class wife could cope with irregular income, model and cook. A bourgeois wife like Gauguin's could not", "src": [0]}, {"label": "“Intransigeant”", "left": "An extremist, politically coloured group", "right": "A word used by Le Figaro and repeated by The Times. The group was almost apolitical; Pissarro had views but kept them out of his painting", "src": [0]}, {"label": "A group with a leader", "left": "Manet as master, the young friends as pupils", "right": "Manet never exhibited with them; in 1874 it was Manet who learned Monet's way of painting at Argenteuil", "src": [0, 1]}, {"label": "Same subjects, same style", "left": "Landscape, broken brushwork, light", "right": "Monet's seas and Degas's dancers are “worlds apart”; Bazille and Caillebotte painted in a very academic way", "src": [0, 2]}, {"label": "Painted outdoors in 15 minutes", "left": "Done in one go, right in front of the motif", "right": "At least two sessions of about 30 minutes each; many large pictures were finished in the studio", "src": [0, 3]}]}, {"type": "diagram", "title": "Visualised: myth and reality", "img": "d-myths", "note": "Diagram redrawn by the editor from the table above. Left column: the popular image; right column: what the lectures demonstrate."}, {"type": "story", "title": "Each myth, each piece of evidence", "items": [{"title": "“Rebels” who still submitted to the Salon", "img": "monet-heve", "caption": "Monet, La Pointe de la Hève at Low Tide, Salon 1865", "paras": ["Monet entered the Salon in 1865 with a large seascape painted in the studio. According to the lecturer, right up to the Impressionist exhibitions and even afterwards, he kept submitting to the Salon.", "In 1880 Monet again sent the Salon a Lavacourt picture, which kept him out of the fifth exhibition. “Rebel” is only partly true."], "src": [0, 2]}, {"title": "“A group” with no group photograph", "img": "fantin-batignolles", "caption": "Fantin-Latour, A Studio at Les Batignolles, 1870", "paras": ["In the 1860s–1870s, people happy to be together went to have their photograph taken. The lecturer searched in vain for a single group photo: only individual portraits, and one picture of Pissarro with Cézanne.", "The image of a “group” comes from the paintings of Fantin-Latour, a Salon painter who always opposed exhibiting outside the Salon. He painted Manet as a master among disciples, which the lecturer calls “completely far-fetched”."], "src": [1]}, {"title": "“One style”, yet Degas hated painting outdoors", "img": "degas-orchestra", "caption": "Degas, The Orchestra at the Opera, around 1870", "paras": ["Degas organised almost every exhibition, yet he was a draughtsman who worked from memory and loathed outdoor landscape painters. He even wanted to name the first show “La Capucine” to avoid the word “impression”.", "Editor's note: if “Impressionism” is a style, its main organiser stood outside that style."], "src": [2, 3]}]}, {"type": "callout", "tone": "warn", "title": "The lecturer's own disclaimer", "items": ["The lecture has “a very low profile”, no big thesis, no polemic: it simply “puts the Impressionists back in their context”.", "So read the following pages as a correction of preconceptions, not as a new theory."], "src": [0, 3]}]}, "timeline": {"page": "timeline", "title": "Timeline 1855–1886", "group": "Context", "lead": "Thirty years from Courbet's private pavilion to the eighth exhibition with Seurat. The milestones come from the four lectures; the background is added by the editor.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, episode 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 min)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, episode 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 min)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, episode 3: “Les huit expositions impressionnistes” (YouTube, 26 min)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, episode 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 min)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Additional art-historical knowledge beyond the four lectures, compiled by the editor", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), the main reference cited in episode 4", "date": "2000"}], "blocks": [{"type": "timeline", "title": "Key milestones", "items": [{"when": "1855", "title": "Courbet builds the “Pavilion of Realism”", "text": "Rejected at the Exposition Universelle, Courbet put up his own pavilion to show his work.", "src": [0], "detail": [["Context", "The Salon was the only way for a painter to become known and sell; its jury was dominated by the Académie."], ["What happened", "Courbet wrote to Nieuwerkerke, the superintendent of Fine Arts: you are your government, and I am my government."], ["Significance", "For the first time a painter proved one could exhibit outside the Salon. Manet did it again in 1867; the young group followed in 1874."]], "img": "courbet-burial"}, {"when": "1858–1859", "title": "Boudin meets Monet in Le Havre", "text": "Boudin spotted the talent of 18-year-old Monet, then drawing caricatures, and urged him to study in Paris.", "src": [0], "detail": [["Context", "Le Havre and Honfleur were ports and summer resorts for the well-to-do. Boudin painted small, postcard-sized pictures in oil on paper."], ["What happened", "In 1859 Monet went to Paris. That same year Baudelaire visited Boudin's studio and wrote about his cloud studies in his review of the Salon of 1859."], ["Significance", "Monet's first lesson was light and sky, learned in front of the motif, not at school."]], "img": "boudin-sky"}, {"when": "1862", "title": "Monet meets Jongkind", "text": "The two painted together around the Saint-Siméon inn at Honfleur.", "src": [0], "detail": [["Context", "Jongkind was Dutch, steeped in the marine tradition, and painted watercolours very fast with two or three tones."], ["What happened", "They went a long way together. In 1871 Edmond de Goncourt wrote that all contemporary landscape painting owed a debt to Jongkind."], ["Significance", "Monet: “It is to him that I owe the definitive education of my eye.”"]], "img": "jongkind-honfleur"}, {"when": "1862–1863", "title": "Friends at the Académie Suisse and Gleyre's studio", "text": "Pissarro, Guillaumin and Cézanne were at the Suisse; Monet went to both and met Bazille, Renoir and Sisley at Gleyre's.", "src": [1], "detail": [["Context", "Free studios like the Suisse hired out models without teaching; Gleyre's studio trained students for the École des Beaux-Arts."], ["What happened", "The group of friends formed gradually, with no document and no programme."], ["Significance", "The lecturer sums up: the Impressionists were “school friends”, and school friends do not all end up in the same job."]], "img": "renoir-bazille"}, {"when": "1863", "title": "Delacroix dies", "text": "The young painters were annoyed that he only got a small retrospective in his studio. The State held a major one more than twenty years later.", "src": [0], "detail": [["Context", "Delacroix worked for the State and the Church, painting mythological and romantic violence, far from the young group's subjects."], ["What happened", "In 1864 Fantin-Latour painted Hommage à Delacroix: Manet, Whistler, Baudelaire, Bracquemond, Duranty and Champfleury around his portrait."], ["Significance", "They revered him for colour: Delacroix's journal anticipated principles later used by the Impressionists and Seurat."]], "img": "fantin-hommage"}, {"when": "1864–1866", "title": "Small pictures in Normandy: a lesson in selling", "text": "At Trouville in 1865 Courbet painted a series of small seascapes that sold “like hot cakes”. Monet did the same at Honfleur.", "src": [0], "detail": [["Context", "A large picture like A Burial at Ornans cost paint, canvas and time, and was hard to sell."], ["What happened", "Courbet wrote: “Two hours' work and it's sold.” Monet sold his first study to a Honfleur collector, then another to Boudin."], ["Significance", "According to the lecturer, “painting quickly” began for economic reasons, not only from a theory of sensation."]], "img": "courbet-trouville"}, {"when": "1865", "title": "Monet's first Salon", "text": "La Pointe de la Hève at Low Tide, painted large in the studio from outdoor studies, was accepted.", "src": [0], "detail": [["Context", "To become known and find buyers, you had to go through the Salon."], ["What happened", "Monet combined the lessons of Boudin (sky), Jongkind (sea) and Courbet (contrast, palette knife)."], ["Significance", "Monet kept submitting to the Salon even after the Impressionist exhibitions began."]], "img": "monet-heve"}, {"when": "1867", "title": "Salon rejection and the letter to Nieuwerkerke", "text": "Monet, Sisley and Renoir failed to get past the jury. The group signed a letter demanding a Salon of the rejected.", "src": [2], "detail": [["Context", "Monet's Femmes au jardin (about 2.5 m) was rejected, probably for a light subject on a large format, not for lack of finish."], ["What happened", "According to the lecturer, the letter arrived on 1 April and never got a reply. Bazille bought the painting for 2,500 francs."], ["Significance", "The idea of organising their own exhibition began to take shape. Manet also set up his own pavilion in 1867."]], "img": "monet-femmes"}, {"when": "1869", "title": "La Grenouillère", "text": "Monet and Renoir set up their easels side by side, a few metres apart, each painting three canvases.", "src": [3], "detail": [["Context", "La Grenouillère was a bathing and boating spot on the Seine near Bougival."], ["What happened", "Monet wrote to Bazille that he dreamed of a large picture and had only “a few bad sketches” (pochades)."], ["Significance", "Works now seen as the start of the Impressionist style were merely studies for a large picture that was never painted."]], "img": "monet-grenouillere"}, {"when": "1870–1871", "title": "The Franco-Prussian War", "text": "Bazille volunteered with the Zouaves and was killed. Monet and Pissarro went to London and met the dealer Durand-Ruel.", "src": [1], "detail": [["Context", "Paris was besieged; Cézanne went back to Provence; Renoir served four months in the cavalry without fighting; Degas and Manet joined the National Guard."], ["What happened", "From 1872 Durand-Ruel began buying the group's work. Monet stopped at Zaandam (Holland) in 1871 and painted in a thinned manner rare for him."], ["Significance", "The group lost the man with the stature of a leader, Bazille, and gained a dealer."]], "img": "monet-zaandam"}, {"when": "1874", "title": "The first exhibition", "text": "The Société anonyme of painters, sculptors and engravers showed at Nadar's former studio, 35 boulevard des Capucines.", "src": [2], "detail": [["Context", "Pissarro modelled the society's statutes on those of a bakers' association in Pontoise."], ["What happened", "About thirty artists, 250 works. Ten days later Louis Leroy published a mocking article in Le Charivari."], ["Significance", "From that article on, the word “Impressionist” stuck to the whole group."]], "img": "monet-impression"}, {"when": "1876–1882", "title": "Exhibitions 2 to 7", "text": "The line-up kept changing: Degas brought in realist painters; Renoir, Sisley and Monet left in turn; Gauguin clashed with Raffaëlli.", "src": [2], "detail": [["Context", "The group was selling more and more outside the exhibitions."], ["What happened", "The 3rd show (1877) was the only time the group officially called itself “Impressionist”; it was also Cézanne's last."], ["Significance", "The so-called “core” was never all present at any show after the third."]], "img": "caillebotte-pont"}, {"when": "1886", "title": "The eighth and last exhibition", "text": "After a four-year gap, Degas returned; Seurat and Signac came in; Monet, Renoir and Sisley were absent.", "src": [2], "detail": [["Context", "Monet and Renoir had found their place in the market and no longer needed group shows."], ["What happened", "Seurat showed A Sunday on La Grande Jatte; Félix Fénéon called it “Neo-Impressionism”."], ["Significance", "The series of exhibitions closed with a trend that made a science of the very “small stroke” Delacroix had described."]], "img": "seurat-jatte"}]}, {"type": "story", "title": "Background: the Salon, the boulevards and money", "items": [{"title": "The Salon losing its grip", "paras": ["The Salon was the only channel for painters to become known and sell. Young artists “put all their money into paint”, but unhung pictures did not sell: what future did they have?", "In 1870 Daubigny resigned from the jury because Monet had been rejected. According to the lecturer, Daubigny and Manet tried to broker a deal, while Durand-Ruel said: at this point you have to organise your own Salon."], "src": [2]}, {"title": "The boulevard des Capucines and consumerism", "img": "monet-boulevard", "caption": "Monet, Boulevard des Capucines, 1873–1874", "paras": ["The first show was on a grand, very commercial boulevard among shops. The lecturer notes that Marxist historians in the late 20th century criticised linking the birth of Impressionism with the birth of consumer society, which emerged in the 1870s and exploded in the 1880s–1890s, when the painters themselves began to sell very well.", "Editor's note: this is the thread running through all four episodes: Impressionism was tied to the market before it became a style."], "src": [2]}]}]}, "delacroix-courbet": {"page": "delacroix-courbet", "title": "Delacroix and Courbet: two forerunners", "group": "Forerunners", "lead": "Two masters who seem furthest from Impressionism: a Romantic who painted church ceilings, a Realist who painted with a knife. The lecturer shows that each left the young group a very different lesson.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, episode 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 min)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, episode 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 min)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, episode 3: “Les huit expositions impressionnistes” (YouTube, 26 min)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, episode 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 min)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Additional art-historical knowledge beyond the four lectures, compiled by the editor", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), the main reference cited in episode 4", "date": "2000"}, {"name": "Art d'Histoire, episode 1, 11:47", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&t=707s", "date": ""}, {"name": "Art d'Histoire, episode 1, 12:37", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&t=757s", "date": ""}], "blocks": [{"type": "principles", "title": "Four lessons", "items": [{"title": "Shadows are complementary colours", "rule": "Don't add black to darken a colour; look for its opposite.", "why": "Delacroix: adding black “dirties the tone”. A blond child has violet shadows, a ruddy one green shadows. “All shadows partake of violet.”", "img": "chevreul-cercle"}, {"title": "Small strokes, unblended", "rule": "Place strokes of colour side by side and let the eye mix them at a distance.", "why": "Delacroix: the strokes “blend naturally at the desired distance by the sympathetic law that unites them”, and the colour gains “more energy and freshness”.", "img": "dela-dieppe"}, {"title": "Exhibit yourself, assert yourself", "rule": "No need for the Salon's permission to show your work.", "why": "Courbet built his own pavilion in 1855, a provincial who imposed himself in Paris. The young group learned his character more than his knife-work.", "img": "courbet-burial"}, {"title": "Small pictures, painted fast, sold", "rule": "About 50×50 cm, a few hours, a modest price.", "why": "Trouville 1865: “Two hours' work and it's sold.” For the lecturer, this is the “huge lesson” Monet remembered.", "img": "courbet-trouville"}]}, {"type": "story", "title": "Delacroix: a classic revered as a master", "items": [{"title": "A journal that reads like an Impressionist's", "img": "delacroix-portrait", "caption": "Delacroix, Self-Portrait, around 1837", "paras": ["Delacroix kept Chevreul's colour circle in his studio. At Saint-Denis-du-Saint-Sacrement he noted: lights painted in pure chrome yellow, half-tones in Prussian blue, no black because it “dirties”.", "On the “small stroke”, he said one must seek it in Raphael and advised a friend to see Correggio's large gouaches. The lecturer recalls that the Impressionist palette still kept black when needed; Manet and even Monet used it."], "src": [0]}, {"title": "Criticised as “daubing” for broken strokes", "img": "dela-sardanapale", "caption": "Delacroix, The Death of Sardanapalus, 1827", "paras": ["From afar it looked fine; up close critics saw a mass of little strokes, “unfinished”, and called it “tartouillage”, “barbouillage”.", "The very same criticism the Impressionists would receive twenty years later."], "src": [0]}]}, {"type": "media", "kicker": "Case study · Episode 1, 11:47", "title": "Renoir borrows Courbet's figures, but that is not the point", "img": "v1-0707", "caption": "Left: Courbet, Les Baigneuses (1853) and Les Demoiselles des bords de la Seine (1856). Right: Renoir, Baigneuse au griffon, Salon 1870 · 11:47", "text": "The lecturer shows the Renoir as a “hybrid” of two Courbets: the nude and the clothed woman tilting her head from Les Baigneuses; the reclining girl who has taken off her white dress with red lace, and the tree like the edge of a stage, from Les Demoiselles. Then the lecturer dismisses it: these iconographic references are “of no use at all”, because Courbet's role as forerunner lies elsewhere.", "bullets": ["Look at the white dress with red trim: the same garment in both pictures.", "Look at the body: Courbet's is fleshy, Renoir's smoother and brighter.", "Renoir also painted Diana (1867) with a dead deer, a nod to Courbet, a keen hunter."], "src": [6]}, {"type": "media", "kicker": "Case study · Episode 1, 12:37", "title": "Mother Anthony's inn: a pose borrowed from Courbet", "img": "v1-0757", "side": "right", "caption": "Left: Courbet, L'Après-dînée à Ornans, 1849. Right: Renoir, À l'auberge de la mère Anthony, 1866 · 12:37", "text": "Both pictures play on black-and-white contrast, and Renoir takes almost exactly the pose of the man seated with his back turned, three-quarters, before a table. On the table lies L'Événement, Zola's newspaper, a nod to Zola; the dog under the table is Toto.", "bullets": ["The figure with his back to us in the foreground: same position in both pictures.", "A dark palette, nothing “impressionist” yet: Renoir in 1866 was still very close to Courbet."], "src": [7]}, {"type": "callout", "tone": "good", "title": "Conclusion", "items": ["Delacroix left a colour theory: shadows as complementary colours, small unblended strokes, “retinal mixing” (later made rigorous by Seurat).", "Courbet left a character and an economic model: exhibit on your own, and sell small, quickly painted pictures.", "Renoir's borrowings from Courbet are real, but according to the lecturer they are not why Courbet was a forerunner."], "src": [0]}]}, "boudin-jongkind": {"page": "boudin-jongkind", "title": "Boudin, Jongkind and the Normandy coast", "group": "Forerunners", "lead": "Le Havre, Sainte-Adresse, Trouville, Honfleur: the young Monet learned to paint on the shore itself, beside two masters of sky and water.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, episode 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 min)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, episode 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 min)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, episode 3: “Les huit expositions impressionnistes” (YouTube, 26 min)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, episode 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 min)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Additional art-historical knowledge beyond the four lectures, compiled by the editor", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), the main reference cited in episode 4", "date": "2000"}, {"name": "Art d'Histoire, episode 1, 18:17", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&t=1097s", "date": ""}], "blocks": [{"type": "principles", "title": "Four things Monet learned in Normandy", "items": [{"title": "A sky with date and time", "rule": "Paint clouds very fast and note the date, time and wind direction in the margin.", "why": "Boudin worked like Constable. Baudelaire saw studies in his studio inscribed “8 October, noon, north-west wind”.", "img": "boudin-sky"}, {"title": "Hold on to the first impression", "rule": "What is painted on the spot has a power the studio cannot recover.", "why": "Boudin: one must be “extremely stubborn” in staying with the first impression, the “primitive impression”, because it is the right one.", "img": "boudin-trouville"}, {"title": "Two or three thinned tones", "rule": "A beige, a blackish brown, a blue, thinned to various degrees.", "why": "Jongkind's watercolours were painted very fast: wet the brush, sweep, almost dry at once. At Zaandam in 1871 Monet used nearly the same approach.", "img": "jongkind-honfleur"}, {"title": "Synthesised into a Salon picture", "rule": "Combine the lessons in a large picture painted in the studio.", "why": "La Pointe de la Hève (Salon 1865): sky learned from Boudin, sea in Jongkind's tones, contrast probably from Courbet.", "img": "monet-heve"}]}, {"type": "media", "kicker": "Case study · Episode 1, 18:17", "title": "Boudin's sky “postcards”", "img": "v1-1097", "caption": "Three sky studies by Boudin: stormy sky, sky at 4 pm with an east wind, sky after rain · 18:17", "text": "The lecturer stresses the size: 10×14 or 11×18 cm, like a postcard. They are oil on paper, not watercolour: the paper absorbs the oil so it dries faster. Boudin stood before the clouds and painted as fast as he could, like Constable.", "bullets": ["Tiny format: one session and it's done.", "No figures, no scenery: just light and movement.", "These “postcards” were exercises, not pictures to sell at the Salon."], "src": [6]}, {"type": "story", "title": "Three masters on the shore", "items": [{"title": "Boudin and Baudelaire's praise", "img": "boudin-trouville", "caption": "Boudin, The Beach at Trouville", "paras": ["Boudin met Monet in 1858, when Monet was still a caricaturist. In 1859 Monet went to Paris to study.", "Baudelaire's mother had a house in Le Havre. In his review of the Salon of 1859, Baudelaire wrote that if only other critics had seen the studies he saw in Boudin's studio; they “went to my head like a heady drink or the eloquence of opium”.", "Boudin is famous for Trouville beaches full of elegant holidaymakers, but what the lecturer wants us to see is the sky and the luminosity."], "src": [0]}, {"title": "Jongkind, “when he wasn't drunk”", "img": "jongkind-havre", "caption": "Jongkind, Le Havre", "paras": ["Jongkind was Dutch, versed in marine painting, and worked at Le Havre, Sainte-Adresse, Trouville and Honfleur, the very places Monet painted. They met in 1862 and worked together at the Saint-Siméon inn.", "The lecturer sums up: Monet learned composition and colour from Jongkind, light from Boudin; some add Ribot, and occasionally Courbet for impasto and the palette knife."], "src": [0]}, {"title": "From small study to Salon picture", "img": "monet-honfleur", "caption": "Monet, The Beach at Honfleur, around 1864–1866", "paras": ["At Saint-Siméon in 1864–1866 Monet made small pictures that cost little time and paint, and sold them. He wrote to Bazille that he preferred to send a Montpellier patron a “study” rather than “paintings”.", "The lecturer explains: “tableau” meant a finished picture. What we admire today as “impressions” may have been unfinished in his mind; they were simply cheap and saleable."], "src": [0]}]}, {"type": "callout", "tone": "good", "title": "Conclusion", "items": ["All three ingredients of the “impression” were already present on the Normandy coast before 1866: quick notation of light (Boudin), simplified tones (Jongkind), and a market for small pictures (Courbet).", "Boudin voiced the contradiction Monet would wrestle with: the life of a sketch is very hard to carry over into a large finished picture."], "src": [0, 3]}]}, "friends": {"page": "friends", "title": "Art-school friends", "group": "The friends", "lead": "No charter, no leader, no required subject. A group of friends who met in studios, shared lodgings, gave each other money, sat in cafés together, and each found their own voice.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, episode 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 min)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, episode 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 min)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, episode 3: “Les huit expositions impressionnistes” (YouTube, 26 min)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, episode 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 min)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Additional art-historical knowledge beyond the four lectures, compiled by the editor", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), the main reference cited in episode 4", "date": "2000"}], "blocks": [{"type": "cards", "title": "Who's who in the group", "items": [{"title": "Camille Pissarro", "meta": "1830–1903 · Académie Suisse", "text": "Still listed at the Salon as a “pupil of Corot” until 1866. The only one with real pupils (Cézanne, Gauguin), but too egalitarian to lead.", "src": [1, 2], "img": "pissarro-louveciennes"}, {"title": "Claude Monet", "meta": "1840–1926 · Suisse and Gleyre", "text": "The one people wanted as leader; he talked to journalists and gathered signatures. But he was “not political at all”: it was his paintings that sold, not the group's.", "src": [2], "img": "monet-camille"}, {"title": "Pierre-Auguste Renoir", "meta": "1841–1919 · Gleyre's studio", "text": "First and foremost a painter of portraits and figures. Shared studios with Bazille for years.", "src": [1, 3], "img": "renoir-loge"}, {"title": "Frédéric Bazille", "meta": "1841–1870 · Gleyre's studio", "text": "From a well-off Montpellier family, the tallest of the group; he housed friends and bought Monet's work. Killed in 1870.", "src": [1], "img": "renoir-bazille"}, {"title": "Edgar Degas", "meta": "1834–1917 · academic training, 3 years in Italy", "text": "Admired Ingres above all. Organised almost every exhibition, but was a draughtsman.", "src": [1, 2], "img": "degas-manet"}, {"title": "Édouard Manet", "meta": "1832–1883", "text": "Already well known; he showed the group a way but did not teach, and never exhibited with them.", "src": [1, 2], "img": "manet-olympia"}]}, {"type": "story", "title": "An “informal” group", "items": [{"title": "Corot, and the road into Pissarro's pictures", "img": "corot-souvenir", "caption": "Corot, Souvenir of Mortefontaine, 1864", "paras": ["The lecturer mentions the Barbizon school but only touches on Corot. Barbizon pictures now look dark because they were painted over bitumen grounds, which bleed black up through the paint.", "Corot has something found almost systematically in Pissarro: a road leading into the picture, drawing the eye into its illusory depth, punctuated by small figures, walls and trees. When the first exhibition opened in 1874, a critic sighed: “O Corot, what crimes are committed in your name!”"], "src": [1]}, {"title": "Pissarro's brush changes after London", "img": "pissarro-louveciennes", "caption": "Pissarro, The Road to Louveciennes, 1872", "paras": ["There is still a road, but now on a diagonal; a wall closes the view instead of leading the eye. One stroke for a window, two for a wooden slat (brown, then white on top). The lecturer calls the quick jabs for winter branches the brush's “staccato”.", "In London in 1870–1871, Monet and Pissarro, probably unable to speak English, sought each other out, painted together and met Durand-Ruel. Pissarro's change accelerated from there."], "src": [1]}, {"title": "Shared lodgings: “a financial infirmary”", "img": "renoir-bazille", "caption": "Renoir, Bazille at His Easel, 1867", "paras": ["Bazille rented a studio on the rue Visconti around 1866–1867 and shared it with Renoir. Monet, who had to leave Sisley's when Sisley married, moved in too. Bazille wrote to his mother that it was a real “infirmary”, a financial one according to the lecturer.", "From 1868 to 1870 Renoir shared and paid part of the rent of the studio on the rue La Condamine. Living together, they painted each other: Renoir painted Bazille painting, with what may be a Monet snow scene behind him."], "src": [1]}, {"title": "Café Guerbois: leader of the conversations", "img": "manet-olympia", "caption": "Manet, Olympia, 1863", "paras": ["Manet led in one respect: he drew the grou
