<style>
/* v2: same index rail + one reading column, but rebuilt for comfortable reading:
   larger type, whitespace instead of boxes, fixed-ratio photo frames, diagrams in the flywheel language. */
:root{
  --bg:#F2F2EE; --surface:#FFFFFF; --ink:#141619; --text:#24272C; --muted:#5C626A; --faint:#80868E;
  --line:#D8DAD3; --hair:#E4E5DF; --soft:#F7F7F4; --th:#ECEFF6;
  --accent:#2340C4; --accent-ink:#FFFFFF; --accent-soft:#E3E8FA; --accent-line:#B4C1F0;
  --good:#1C7549; --good-soft:#E2F1E7; --warn:#8F5600; --warn-soft:#F9EFD9; --risk:#AE2A20; --risk-soft:#F9E4E0; --info-soft:#E8ECF6;
  --z-art:#DCE3FB; --z-sale:#F4F4F0; --z-service:#DBEFE1; --z-back:#E2E3DF;
  --display:"Newsreader","Iowan Old Style","Times New Roman",serif;
  --body:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
  --rhythm:68px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1012; --surface:#17191C; --ink:#EEEFF1; --text:#D8DBE0; --muted:#9CA3AD; --faint:#7C838D;
  --line:#2D3137; --hair:#25282D; --soft:#1C1F23; --th:#1D2230;
  --accent:#8FA3FF; --accent-ink:#0F1012; --accent-soft:#1E2649; --accent-line:#3B4885;
  --good:#5CC38C; --good-soft:#13261A; --warn:#E2A64C; --warn-soft:#2A2111; --risk:#F08B80; --risk-soft:#2D1614; --info-soft:#1A1F2B;
  --z-art:#202A55; --z-sale:#1E2125; --z-service:#15291C; --z-back:#282B30; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1012; --surface:#17191C; --ink:#EEEFF1; --text:#D8DBE0; --muted:#9CA3AD; --faint:#7C838D;
  --line:#2D3137; --hair:#25282D; --soft:#1C1F23; --th:#1D2230;
  --accent:#8FA3FF; --accent-ink:#0F1012; --accent-soft:#1E2649; --accent-line:#3B4885;
  --good:#5CC38C; --good-soft:#13261A; --warn:#E2A64C; --warn-soft:#2A2111; --risk:#F08B80; --risk-soft:#2D1614; --info-soft:#1A1F2B;
  --z-art:#202A55; --z-sale:#1E2125; --z-service:#15291C; --z-back:#282B30; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
p{margin:0}
h1,h2,h3{color:var(--ink)}
.muted{color:var(--muted)}

/* ---------- app frame */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:26px 22px 40px}
.brand{display:grid;gap:4px;margin-bottom:20px}
.brand .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand .name{font-family:var(--display);font-size:26px;line-height:1.12;font-weight:500;color:var(--ink)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink);font:inherit;font-size:14.5px}
.navg{margin-top:22px}
.navg h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.navg a{display:block;padding:6px 10px;margin-inline:-10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.45}
.navg a:hover{background:var(--soft)}
.navg a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sidefoot{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.55}
.topbar{display:none;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:12px}
.topbar .t{font-family:var(--display);font-size:19px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:9px}
.burger{width:14px;height:10px;border-top:2px solid currentColor;border-bottom:2px solid currentColor;position:relative}
.burger::after{content:"";position:absolute;left:0;right:0;top:2px;border-top:2px solid currentColor}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(10,11,13,.4)}
main{min-width:0;padding:52px clamp(20px,4.2vw,64px) 120px}
.wrap{max-width:1060px;margin-inline:auto;container-type:inline-size;container-name:wrap;min-width:0}

/* ---------- page head */
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-weight:500;font-size:clamp(34px,3.7vw,50px);line-height:1.06;letter-spacing:-.012em;margin:10px 0 16px;text-wrap:balance;max-width:20em}
.lead{font-size:19px;line-height:1.62;color:var(--ink);max-width:62ch}
.toc{margin-top:30px;display:grid;gap:10px}
.toc-h{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.toc-c{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.tchip{flex:none;display:inline-block;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.tchip:hover{border-color:var(--accent);color:var(--accent)}
@container wrap (min-width:600px){ .toc-c{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none} }

/* ---------- section rhythm */
.block{margin-top:var(--rhythm);scroll-margin-top:28px;min-width:0}
.block.hd{border-top:1px solid var(--line);padding-top:28px}
.kick{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 10px}
h2{font-family:var(--display);font-weight:500;font-size:27px;line-height:1.16;letter-spacing:-.006em;margin:0 0 22px;text-wrap:balance;max-width:30em}
@container wrap (min-width:600px){ h2{font-size:32px;margin-bottom:26px} }
h3{font-size:17px;line-height:1.4;margin:0;font-weight:600}
.lab{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px;line-height:1.5}
.note{font-size:14px;color:var(--muted);margin-top:16px;max-width:80ch;line-height:1.6}
.nd{font-weight:600;color:var(--accent)}
.src1{font-size:.86em;color:var(--warn);white-space:nowrap}
.prose{display:grid;gap:16px;max-width:68ch}
ul.bl{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.bl li{position:relative;padding-left:20px}
ul.bl li::before{content:"";position:absolute;left:3px;top:calc(.85em - 3px);width:6px;height:6px;border-radius:50%;background:var(--accent)}
ul.bl.sm li{font-size:14.5px;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;line-height:1.6;border-radius:99px;padding:1px 9px;color:var(--muted);background:var(--soft);border:1px solid var(--hair)}

/* ---------- source references: at most 3 shown, rest behind +N */
sup.s{font-size:.62em;line-height:0;vertical-align:super;margin-left:.3em;font-weight:600;letter-spacing:0;font-style:normal;white-space:nowrap}
sup.s .rest{white-space:normal}
sup.s a,sup.s .n,sup.s .more{color:var(--muted);text-decoration:none;background:var(--soft);border:1px solid var(--hair);border-radius:4px;padding:.05em .38em;font-variant-numeric:tabular-nums}
sup.s a:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
sup.s .more{font:inherit;line-height:1.25;cursor:pointer;margin:0;vertical-align:baseline}
sup.s .more:hover{color:var(--accent);border-color:var(--accent-line)}

/* ---------- photos: fixed-ratio frames, cover crop, lightbox on click */
.fig{margin:0;min-width:0}
.frame{display:block;position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:10px;background:var(--soft);padding:0;border:0;cursor:zoom-in;appearance:none}
.frame.r32{aspect-ratio:3/2} .frame.r169{aspect-ratio:16/9} .frame.r21{aspect-ratio:21/9}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.frame:hover img{transform:scale(1.025)}
.fig figcaption{font-size:13px;line-height:1.5;color:var(--muted);margin-top:9px}
.fig .cr{color:var(--faint)}
.fig .cr a{color:inherit}

/* gallery: uniform 12-col grid, rows balanced so there are no holes */
.gal{display:grid;grid-template-columns:minmax(0,1fr);gap:24px 18px}
.gal.one{max-width:760px}
@container wrap (min-width:600px){
  .gal{grid-template-columns:repeat(12,minmax(0,1fr))}
  .gal>.fig{grid-column:span var(--st,6)}
  .gal.one{grid-template-columns:minmax(0,1fr)}
  .gal.one>.fig{grid-column:auto}
}
@container wrap (min-width:900px){
  .gal>.fig{grid-column:span var(--sd,4)}
  .gal>.fig.gbig{grid-row:span 2;display:flex;flex-direction:column}
  .gal>.fig.gbig .frame{flex:1 1 auto;aspect-ratio:auto;min-height:280px}
}

/* ---------- summary rows */
.sum{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);column-gap:52px}
.sum li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:18px 0 20px;border-top:1px solid var(--hair)}
.sum li:first-child{border-top:0;padding-top:2px}
.sn{font-family:var(--display);font-size:25px;line-height:1.05;color:var(--accent);font-variant-numeric:lining-nums tabular-nums}
.st{font-size:17.5px;line-height:1.42;margin-bottom:5px}
@container wrap (min-width:880px){
  .sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sum li{grid-template-columns:46px minmax(0,1fr)}
  .sum li:nth-child(2){border-top:0;padding-top:2px}
  .sn{font-size:27px}
}

/* ---------- media and story: image beside its claim */
.media{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.mtx{display:grid;gap:14px;align-content:start;max-width:68ch;min-width:0}
.mtx h3{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.22}
.story{display:grid;gap:52px}
@container wrap (min-width:640px){
  .media{grid-template-columns:minmax(0,45fr) minmax(0,55fr);gap:36px}
  .media.imgr{grid-template-columns:minmax(0,55fr) minmax(0,45fr)}
  .media.imgr>.fig{order:2}
  .story{gap:60px}
}
dl.facts{margin:4px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:10px;overflow:hidden}
dl.facts>div{background:var(--surface);padding:10px 14px;min-width:0}
dl.facts>div:last-child:nth-child(odd){grid-column:1/-1}
dl.facts dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
dl.facts dd{margin:2px 0 0;font-weight:600;color:var(--ink);font-size:15.5px;line-height:1.45}

/* ---------- timeline and years: vertical rail */
.tl,.yrs{list-style:none;margin:0;padding:0}
.tl>li,.yr{display:grid;grid-template-columns:minmax(0,1fr);row-gap:6px;position:relative;padding:0 0 32px 30px}
.tl>li::before,.yr::before{content:"";position:absolute;left:5px;top:14px;bottom:-14px;width:2px;background:var(--line)}
.tl>li:last-child::before,.yr:last-child::before{display:none}
.tl>li::after,.yr::after{content:"";position:absolute;left:0;top:8px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent)}
.tw,.yw{font-family:var(--display);font-size:20px;line-height:1.25;color:var(--accent);font-variant-numeric:lining-nums}
.tc{display:grid;gap:6px;max-width:66ch;min-width:0}
.tc h3{font-size:17.5px}
.tc p{font-size:16px}
.tlth{width:160px;height:120px;aspect-ratio:auto;border-radius:8px}
@container wrap (min-width:600px){
  .tl>li,.yr{grid-template-columns:96px minmax(0,1fr);column-gap:34px;padding-left:0}
  .tl>li.has-th{grid-template-columns:96px minmax(0,1fr) 160px}
  .tl>li::before,.yr::before{left:112px}
  .tl>li::after,.yr::after{left:107px}
  .tw,.yw{text-align:right;font-size:22px}
}
.yb{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.yg,.yx{border-radius:12px;padding:13px 17px 15px}
.yg{background:var(--good-soft)} .yx{background:var(--risk-soft)}
.yg .lab{color:var(--good)} .yx .lab{color:var(--risk)}
.yg p,.yx p,.yg li,.yx li{font-size:15.5px;line-height:1.62;color:var(--ink)}
.yev{grid-column:1/-1;font-size:13.5px;color:var(--muted);line-height:1.6}
details.yev summary{cursor:pointer;font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:8px}
details.yev summary::-webkit-details-marker{display:none}
details.yev summary::before{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 1.8px 1.8px 0;transform:rotate(-45deg);transition:transform .15s}
details.yev[open] summary::before{transform:rotate(45deg)}
details.yev p{margin-top:6px}
@container wrap (min-width:600px){ .yb{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} }

/* ---------- phases: numbered stages on a cobalt rail */
.ph{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:14px;position:relative;padding-bottom:46px}
.ph::before{content:"";position:absolute;left:16px;top:40px;bottom:6px;width:2px;background:var(--accent-line)}
.ph:last-child::before{display:none}
.ph-n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:500 18px/1 var(--display)}
.ph-c{display:grid;gap:18px;min-width:0}
.ph-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;padding-top:2px}
.ph-h h3{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.2}
.chip{display:inline-block;font-size:12px;letter-spacing:.05em;font-weight:700;border-radius:6px;padding:3px 9px;background:var(--accent-soft);color:var(--accent);line-height:1.5}
.ph-sum{max-width:70ch}
.ph-did ul.bl{display:block}
.ph-did ul.bl li{margin-bottom:8px;break-inside:avoid;font-size:15.5px;line-height:1.62}
.gb{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.gb ul.bl li::before{background:currentColor;opacity:.5}
.ph-num{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:13px 17px;font-size:15.5px;line-height:1.62}
.ph-next{background:var(--accent-soft);border-radius:12px;padding:13px 17px;font-size:15.5px;line-height:1.62;color:var(--ink)}
.ph-next .lab{color:var(--accent)}
@container wrap (min-width:640px){
  .ph{grid-template-columns:44px minmax(0,1fr);column-gap:22px}
  .ph::before{left:21px;top:52px}
  .ph-n{width:44px;height:44px;font-size:21px}
  .ph-h{padding-top:6px}
  .ph-h h3{font-size:26px}
  .gb{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@container wrap (min-width:900px){ .ph-did ul.bl{columns:2;column-gap:40px} }

/* ---------- flow: numbered white boxes joined by cobalt arrows */
.flow{display:grid}
.frow{display:grid;grid-template-columns:minmax(0,1fr);align-items:stretch}
.fstep{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.fstep .frame{border-radius:0;margin-top:auto}
.fb{padding:16px 18px 18px;display:grid;gap:7px;align-content:start}
.fn{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 14px/1 var(--body)}
.fstep h3{font-family:var(--display);font-weight:500;font-size:20px;line-height:1.25}
.fstep p{font-size:15px;line-height:1.62}
.farr,.fturn{display:flex;justify-content:center;align-items:center;min-height:38px}
.farr svg,.fturn svg{display:block;overflow:visible}
.ah-h{display:none!important}
.fturn i{display:none}
@container wrap (min-width:760px){
  .frow{grid-template-columns:var(--tpl)}
  .farr{min-height:0}
  .ah-h{display:block!important;width:44px;height:14px}
  .ah-v{display:none!important}
  .fturn{--half:calc((100% - (var(--cols) - 1) * 44px) / (2 * var(--cols)));position:relative;height:48px;min-height:0;display:block}
  .fturn::before{content:"";position:absolute;top:0;height:calc(50% + 1px);left:calc(var(--half) + 10px);right:calc(var(--half) - 1px);border:solid var(--accent);border-width:0 2.2px 2.2px 0;border-bottom-right-radius:12px}
  .fturn::after{content:"";position:absolute;top:calc(50% - 1.1px);bottom:8px;left:calc(var(--half) - 1.1px);width:12px;border:solid var(--accent);border-width:2.2px 0 0 2.2px;border-top-left-radius:12px}
  .fturn i{display:block;position:absolute;left:calc(var(--half) - 6px);bottom:0;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--accent)}
}

/* ---------- mindmap: cobalt core, white branches, cobalt connectors */
.mm{display:grid;gap:12px}
.mm-c{order:-1}
.mm-side{display:grid;gap:12px;min-width:0}
.mm-b{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px 14px;min-width:0}
.mm-b h3{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.25}
.mm-b ul{margin:6px 0 0;padding:0 0 0 18px;font-size:14.5px;line-height:1.55;display:grid;gap:3px}
.mm-b li::marker{color:var(--accent)}
.mm-core{position:relative;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px 18px;text-align:center;display:grid;gap:4px}
.mm-core b{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.2}
.mm-core span{font-size:14px;line-height:1.5;opacity:.92}
@container wrap (max-width:759px){
  .mm-side{padding-left:24px}
  .mm-b::before{content:"";position:absolute;left:-18px;top:-13px;bottom:-1px;width:2px;background:var(--accent)}
  .mm-b::after{content:"";position:absolute;left:-18px;top:50%;width:18px;height:2px;background:var(--accent)}
  .mm-r .mm-b:last-child::before,.mm.one .mm-l .mm-b:last-child::before{bottom:50%}
}
@container wrap (min-width:760px){
  .mm{grid-template-columns:minmax(0,1fr) 56px minmax(170px,230px) 56px minmax(0,1fr);gap:0;align-items:center}
  .mm-l{grid-column:1;grid-row:1} .mm-c{grid-column:3;grid-row:1} .mm-r{grid-column:5;grid-row:1}
  .mm-side{gap:16px}
  .mm-l .mm-b::after{content:"";position:absolute;top:calc(50% - 1px);left:100%;width:29px;height:2px;background:var(--accent)}
  .mm-r .mm-b::after{content:"";position:absolute;top:calc(50% - 1px);right:100%;width:29px;height:2px;background:var(--accent)}
  .mm-l .mm-b::before{content:"";position:absolute;left:calc(100% + 27px);width:2px;background:var(--accent);top:-9px;bottom:-9px}
  .mm-r .mm-b::before{content:"";position:absolute;right:calc(100% + 27px);width:2px;background:var(--accent);top:-9px;bottom:-9px}
  .mm-side .mm-b:first-child::before{top:calc(50% - 1px)}
  .mm-side .mm-b:last-child::before{bottom:calc(50% - 1px)}
  .mm-side .mm-b:only-child::before{display:none}
  .mm-core{padding:22px 18px}
  .mm-core::before{content:"";position:absolute;top:calc(50% - 1px);right:100%;width:28px;height:2px;background:var(--accent)}
  .mm-core::after{content:"";position:absolute;top:calc(50% - 1px);left:100%;width:28px;height:2px;background:var(--accent)}
  .mm.one .mm-core::after{display:none}
}

/* ---------- anatomy: illustrative floor plan */
.an-note{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:4px 12px;margin-bottom:16px;line-height:1.5}
.an-note::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.an-plan{position:relative;max-width:880px;margin:0 0 42px}
.an-plan svg{display:block;width:100%;height:auto;overflow:visible}
.an-out{fill:var(--surface);stroke:var(--muted);stroke-width:.4}
.az rect{stroke:var(--line);stroke-width:.22}
.az-art rect{fill:var(--z-art);stroke:var(--accent-line)} .az-sale rect{fill:var(--z-sale)} .az-service rect{fill:var(--z-service)} .az-back rect{fill:var(--z-back)}
.az-id{fill:var(--ink);font-family:var(--display);font-size:5px;font-weight:600}
.az-nm{display:none;fill:var(--text);font-family:var(--body);font-size:1.85px;font-weight:500}
.az-sh{display:none;fill:var(--muted);font-family:var(--body);font-size:1.7px;font-weight:700}
.ad{stroke:var(--accent);stroke-width:1.5;stroke-linecap:round}
.adh{fill:var(--accent)}
.an-door{position:absolute;top:calc(100% + 8px);transform:translateX(-50%);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);white-space:nowrap;line-height:1.4}
.an-keys{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);margin:0 0 14px}
.ak{display:inline-flex;align-items:center;gap:7px}
.ak i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
i.az-art,.al-id.az-art{background:var(--z-art)} i.az-sale,.al-id.az-sale{background:var(--z-sale)} i.az-service,.al-id.az-service{background:var(--z-service)} i.az-back,.al-id.az-back{background:var(--z-back)}
.an-leg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:0 36px}
.an-leg li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;padding:13px 0;border-top:1px solid var(--hair)}
.al-id{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;font:600 17px/1 var(--display);color:var(--ink);border:1px solid var(--line)}
.an-leg b{color:var(--ink)}
.al-sh{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);border:1px solid var(--hair);border-radius:99px;padding:0 8px;line-height:1.6}
.an-leg p{font-size:15px;line-height:1.62;margin-top:3px}
@container wrap (min-width:600px){
  .az-id{font-size:3.4px}
  .az-nm,.az-sh{display:inline}
  .an-leg{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ---------- cards and principles: uniform equal-height grid */
.grid3{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@container wrap (min-width:600px){ .grid3{grid-template-columns:repeat(12,minmax(0,1fr))} .grid3>*{grid-column:span var(--st,6)} }
@container wrap (min-width:900px){ .grid3>*{grid-column:span var(--sd,4)} }
.card{background:var(--surface);border:1px solid var(--hair);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .frame{border-radius:0}
.cb{padding:18px 20px 20px;display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.card h3{font-size:17px;line-height:1.38}
.card .meta{font-size:13px;color:var(--muted);line-height:1.5}
.card p{font-size:15px;line-height:1.62}
.cgb{border-top:1px solid var(--hair);padding-top:9px}
.cgb .lab{margin-bottom:3px}
.cgb.g .lab{color:var(--good)} .cgb.b .lab{color:var(--risk)}
.card .tags{margin-top:auto;padding-top:6px}
.pn{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 13px/1 var(--body);letter-spacing:.02em}
.rule{color:var(--ink)}
.card .why{font-size:14px;color:var(--muted);padding-top:2px}
.why b{color:var(--ink);font-weight:600}

/* ---------- compare: aligned rows */
.cmp{border-top:1px solid var(--line)}
.cmp-h{display:none}
.cmp-r{display:grid;grid-template-columns:minmax(0,1fr);border-bottom:1px solid var(--hair);padding:12px 0}
.cmp-r>div{font-size:15.5px;line-height:1.6;min-width:0}
.cmp-l{font-weight:700;color:var(--ink);margin-bottom:6px}
.cmp-a,.cmp-b{padding:8px 12px;border-radius:9px}
.cmp-b{background:var(--accent-soft);margin-top:6px}
.cmp-a::before,.cmp-b::before{content:attr(data-h);display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.cmp-b::before{color:var(--accent)}
@container wrap (min-width:640px){
  .cmp-h{display:grid;grid-template-columns:22% minmax(0,1fr) minmax(0,1fr);border-bottom:1.5px solid var(--ink)}
  .cmp-h>div{padding:12px 18px;font-family:var(--display);font-size:21px;line-height:1.25;color:var(--ink)}
  .cmp-h>div:last-child{color:var(--accent)}
  .cmp{border-top:0}
  .cmp-r{grid-template-columns:22% minmax(0,1fr) minmax(0,1fr);padding:0}
  .cmp-r>div{padding:14px 18px}
  .cmp-l{margin:0;padding-left:0!important}
  .cmp-a,.cmp-b{border-radius:0;margin:0}
  .cmp-b{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
  .cmp-a::before,.cmp-b::before{display:none}
}

/* ---------- do and don't */
.dd{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.dd-c{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:18px 20px 20px}
.dd-t{font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.dd-c.do .dd-t{color:var(--good)} .dd-c.dont .dd-t{color:var(--risk)}
.dd ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.dd li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;font-size:15.5px;line-height:1.6}
.ic{width:24px;height:24px;border-radius:50%;position:relative;margin-top:1px}
.ic.ok{background:var(--good-soft)}
.ic.ok::after{content:"";position:absolute;left:8.5px;top:5px;width:5.5px;height:10.5px;border:solid var(--good);border-width:0 2.4px 2.4px 0;transform:rotate(45deg)}
.ic.no{background:var(--risk-soft)}
.ic.no::before,.ic.no::after{content:"";position:absolute;left:11px;top:6px;width:2.4px;height:12px;background:var(--risk);border-radius:1px;transform:rotate(45deg)}
.ic.no::after{transform:rotate(-45deg)}
@container wrap (min-width:640px){ .dd{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px} }

/* ---------- tables: fixed layout, computed widths; cards on phone */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:15px;line-height:1.55}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:13px 16px;border-bottom:1px solid var(--hair);overflow-wrap:anywhere}
.tbl th{background:var(--th);font-size:13px;font-weight:700;color:var(--ink);line-height:1.4;letter-spacing:.01em}
.tbl tbody tr:nth-child(even) td{background:var(--soft)}
.tbl td:first-child{font-weight:600;color:var(--ink)}
.tbl table.dense th,.tbl table.dense td{padding:12px 12px;font-size:14.5px}
.tbl tr:last-child td{border-bottom:none}
@container wrap (max-width:639px){
  .tbl{border:0;background:transparent;overflow:visible;border-radius:0}
  .tbl table{min-width:0!important;table-layout:auto}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:auto}
  .tbl tr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:10px}
  .tbl tbody tr:nth-child(even) td{background:transparent}
  .tbl td{border:0;padding:5px 0}
  .tbl td::before{content:attr(data-l);display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;line-height:1.5}
  .tbl td:first-child{font-size:16px;padding-top:0}
  .tbl td:first-child::before{display:none}
  .tbl td:empty{display:none}
}

/* ---------- stats */
.stats{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.stat{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:18px 20px 20px;min-width:0}
.sv{font-family:var(--display);font-size:32px;line-height:1.08;color:var(--ink);letter-spacing:-.01em}
.sl{font-size:14.5px;color:var(--muted);margin-top:8px;line-height:1.55}
@container wrap (min-width:480px){ .stats{grid-template-columns:repeat(12,minmax(0,1fr))} .stat{grid-column:span var(--st,6)} }
@container wrap (min-width:900px){ .stat{grid-column:span var(--sd,4)} .sv{font-size:35px} }

/* ---------- quotes */
.qgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@container wrap (min-width:760px){ .qgrid.two{grid-template-columns:repeat(12,minmax(0,1fr))} .qgrid.two>*{grid-column:span var(--sq,6)} }
.q{margin:0;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:16px 22px 18px;display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.q::before{content:"\201C";font-family:var(--display);font-size:52px;line-height:1;height:24px;color:var(--accent);display:block}
.q blockquote{margin:0}
.qp{font-family:var(--display);font-size:19.5px;line-height:1.48;color:var(--ink)}
.qo{margin-top:10px;font-size:14px;line-height:1.6;color:var(--muted);font-style:italic}
.qby{margin-top:auto;padding-top:14px;font-size:13px;color:var(--muted);line-height:1.5}
.sent{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;margin-right:8px;line-height:1.6}
.sent.positive{background:var(--good-soft);color:var(--good)} .sent.negative{background:var(--risk-soft);color:var(--risk)} .sent.mixed{background:var(--warn-soft);color:var(--warn)}

/* ---------- callout: one tinted panel, never one box per paragraph */
.co{border-radius:16px;padding:22px 22px 14px;background:var(--info-soft)}
.co-good{background:var(--good-soft)} .co-warn{background:var(--warn-soft)} .co-risk{background:var(--risk-soft)}
.co-t{display:flex;align-items:center;gap:10px;font-size:18px;line-height:1.35;margin-bottom:14px;color:var(--accent)}
.co-good .co-t{color:var(--good)} .co-warn .co-t{color:var(--warn)} .co-risk .co-t{color:var(--risk)}
.co-i{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.co-l{list-style:none;margin:0;padding:0}
.co-l li{position:relative;padding-left:20px;margin-bottom:12px;break-inside:avoid;font-size:16px;line-height:1.65;color:var(--ink)}
.co-l li::before{content:"";position:absolute;left:2px;top:calc(.82em - 3px);width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.6}
.co-good li::before{background:var(--good)} .co-warn li::before{background:var(--warn)} .co-risk li::before{background:var(--risk)}
@container wrap (min-width:600px){ .co{padding:26px 30px 16px} }
@container wrap (min-width:900px){ .co-l.cols{columns:2;column-gap:48px} }

/* ---------- store profile */
.st-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.st-head h2{margin:0}
.code{font-size:12px;letter-spacing:.08em;font-weight:700;border-radius:6px;padding:3px 9px;background:var(--accent);color:var(--accent-ink);line-height:1.5}
.st-meta{color:var(--muted);font-size:15px;line-height:1.6;max-width:80ch;margin:10px 0 26px}
.st-prof{display:grid;grid-template-columns:minmax(0,1fr);gap:26px}
.st-gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;align-content:start}
.st-gal>.fig:first-child{grid-column:1/-1}
.st-gal.n2>.fig:first-child{grid-column:auto}
.st-gal .fig:not(:first-child) figcaption{font-size:12.5px}
.fl{list-style:none;margin:0;padding:0}
.fl li{padding:11px 0;border-top:1px solid var(--hair);font-size:15.5px;line-height:1.6}
.fl li:first-child{border-top:0;padding-top:0}
.st-secs{display:grid;gap:34px;margin-top:38px}
.nl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:14px 36px}
.nl li{padding-top:12px;border-top:1px solid var(--hair);min-width:0}
.nl b{display:block;color:var(--ink);font-size:15.5px;line-height:1.45;margin-bottom:3px}
.nl b.when{color:var(--accent);font-size:13.5px;letter-spacing:.02em}
.nl p{font-size:15px;line-height:1.62}
.ckl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);column-gap:36px}
.ckl li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--hair);font-size:15px;line-height:1.58;min-width:0}
.cid{font:700 11.5px/1.9 var(--body);letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 7px;height:fit-content;white-space:nowrap}
.go-btn{display:inline-flex;align-items:center;gap:12px;margin-top:16px;padding:10px 16px;border-radius:10px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:14.5px;line-height:1.4}
.go-btn:hover{filter:brightness(1.08)}
.chev{width:7px;height:7px;border:solid currentColor;border-width:2px 2px 0 0;transform:rotate(45deg);flex:none}
@container wrap (min-width:760px){ .nl{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container wrap (min-width:820px){ .st-prof{grid-template-columns:minmax(0,57fr) minmax(0,43fr);gap:36px} }
@container wrap (min-width:900px){ .ckl.two{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ---------- theme */
.th-meta{margin:-12px 0 16px}
.freq{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);line-height:1.6}
.verdict{font-size:17.5px;line-height:1.65;color:var(--ink);max-width:68ch;margin-bottom:22px}
.t-theme .gal{margin-top:22px}

/* ---------- flywheel (unchanged from v1) */
.fly-svg{display:none;max-width:900px}
.fly-list{display:block}
.fly-svg svg{width:100%;height:auto}
.fw-node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.fw-core{fill:var(--accent)}
.fw-t{fill:var(--ink);font-family:var(--body);font-size:14px}
.fw-tb{fill:var(--ink);font-family:var(--display);font-size:19px}
.fw-c{fill:var(--accent-ink);font-family:var(--body);font-size:13.5px}
.fw-cb{fill:var(--accent-ink);font-family:var(--display);font-size:19px}
.fw-a{stroke:var(--accent);stroke-width:2.2;fill:none}
.fw-ah{fill:var(--accent)}
.fw-cap{fill:var(--muted);font-family:var(--body);font-size:12.5px;font-style:italic}
.fly-list ol{margin:0;padding-left:20px;display:grid;gap:10px}
@container wrap (min-width:640px){ .fly-svg{display:block} .fly-list{display:none} }

/* ---------- elements of the formula */
.el{padding:34px 0 40px;border-top:1px solid var(--hair);scroll-margin-top:28px}
.el:first-child{border-top:0;padding-top:4px}
.elh{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.eln{font-family:var(--display);font-size:44px;line-height:.92;color:var(--accent);min-width:30px}
.elh h3{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.2}
.layer{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:3px}
.elg{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.eli{display:grid;gap:10px;align-content:start}
.eli .thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.eli .thumbs .frame{border-radius:7px}
.elt{display:grid;gap:12px;align-content:start;max-width:68ch}
.claim{font-size:17.5px;color:var(--ink);line-height:1.62}
.elt ul.bl li{font-size:15.5px;line-height:1.62}
.elb{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:22px}
.box{border-radius:12px;padding:13px 17px 15px;font-size:15px;line-height:1.6;color:var(--ink)}
.box.v{background:var(--info-soft)} .box.h{background:var(--warn-soft)}
.box.v .lab{color:var(--accent)} .box.h .lab{color:var(--warn)}
@container wrap (min-width:600px){ .elb{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container wrap (min-width:720px){ .elg.has-img{grid-template-columns:minmax(0,44fr) minmax(0,56fr);gap:34px} .elh h3{font-size:27px} .eln{font-size:52px} }

/* ---------- verify checklist */
.vsum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.vsum span{font-size:13.5px;border-radius:99px;padding:4px 12px;background:var(--surface);border:1px solid var(--line)}
.vavail{font-size:13.5px;color:var(--muted);margin-bottom:16px;max-width:70ch}
.vchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.vchips a{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.04em}

/* ---------- cover: collage (Francis Bacon ref) ---------- */
.jhero{container-type:inline-size;position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));height:clamp(560px,52vw,760px);margin:-54px calc(-1 * clamp(20px,4.2vw,64px)) 0;background:#050505;color:var(--ink);overflow:hidden}

.jh-a{grid-column:1/6;grid-row:1/6}

.jidx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.4vw,20px);align-items:start;margin:0 calc(-1 * clamp(20px,4.2vw,64px)) 80px;padding:clamp(40px,5vw,72px) clamp(20px,4.2vw,64px) 0;background:#050505}

n", "credit": "Wikimedia Commons, phạm vi công cộng", "page": "https://commons.wikimedia.org/wiki/File:Pierre-Auguste_Renoir_-_Luncheon_of_the_Boating_Party_-_Google_Art_Project.jpg"}, "renoir-grenouillere": {"file": "renoir-grenouillere.jpg", "w": 1200, "h": 967, "cap": "Renoir, La Grenouillère, 1869 · Nationalmuseum Stockholm", "credit": "Wikimedia Commons, phạm vi công cộng", "page": "https://commons.wikimedia.org/wiki/File:Auguste_Renoir_-_La_Grenouillère_-_Google_Art_Project.jpg"}, "renoir-loge": {"file": "renoir-loge.jpg", "w": 966, "h": 1200, "cap": "Renoir, La Loge, 1874 · Courtauld Gallery", "credit": "Wikimedia Commons, phạm vi công cộng", "page": "https://commons.wikimedia.org/wiki/File:Pierre-Auguste_Renoir,_La_Loge,_Courtauld_Gallery.jpg"}, "renoir-moulin": {"file": "renoir-moulin.jpg", "w": 1200, "h": 893, "cap": "Renoir, Bal du moulin de la Galette, 1876 · Musée d'Orsay", "credit": "Wikimedia Commons, phạm vi công cộng", "page": "https://commons.wikimedia.org/wiki/File:Pierre-Auguste_Renoir,_Le_Moulin_de_la_Galette.jpg"}, "renoir-parc": {"file": "renoir-parc.jpg", "w": 1200, "h": 962, "cap": "Renoir, Dans le parc de Saint-Cloud", "credit": "Wikimedia Commons, phạm vi công cộng", "page": "https://commons.wikimedia.org/wiki/File:Pierre-Auguste_Renoir_-_Dans_le_Parc_de_Saint-Cloud.jpg"}, "renoir-torse": {"file": "renoir-torse.jpg", "w": 939, "h": 1200, "cap": "Renoir, Torse, effet de soleil, 1875–1876 · Musée d'Orsay", "credit": "Wikimedia Commons, phạm vi công cộng", "page": "https://commons.wikimedia.org/wiki/File:Pierre-Auguste_Renoir_-_Torse,_effet_de_soleil.jpg"}, "renoir-wave": {"file": "renoir-wave.jpg", "w": 1200, "h": 997, "cap": "Renoir, La Vague, 1882 · Art Institute of Chicago", "credit": "Wikimedia Commons, phạm vi công cộng", "page": "https://commons.wikimedia.org/wiki/File:The_Wave_-_Pierre-Auguste_Renoir_-_Google_Cultural_Institute.jpg"}, "seurat-jatte": {"file": "seurat-jatte.jpg", "w": 1200, "h": 799, "cap": "Seurat, Chủ nhật trên đảo Grande Jatte, 1884–1886 · Art Institute of Chicago", "credit": "Wikimedia Commons, phạm vi công cộng", "page": "https://commons.wikimedia.org/wiki/File:A_Sunday_on_La_Grande_Jatte,_Georges_Seurat,_1884.jpg"}, "v1-0707": {"file": "v1-0707.jpg", "w": 800, "h": 450, "cap": "Tập 1, phút 11:47: Courbet (trái) và Renoir (phải)", "credit": "Khung hình từ bài giảng Art d'Histoire, dùng để trích dẫn"}, "v1-0757": {"file": "v1-0757.jpg", "w": 800, "h": 450, "cap": "Tập 1, phút 12:37: Courbet, L'Après-dînée à Ornans và Renoir, À l'auberge de la mère Anthony", "credit": "Khung hình từ bài giảng Art d'Histoire, dùng để trích dẫn"}, "v1-1097": {"file": "v1-1097.jpg", "w": 800, "h": 450, "cap": "Tập 1, phút 18:17: ba nghiên cứu bầu trời của Boudin", "credit": "Khung hình từ bài giảng Art d'Histoire, dùng để trích dẫn"}, "v3-0277": {"file": "v3-0277.jpg", "w": 800, "h": 449, "cap": "Tập 3, phút 4:37: danh sách người triển lãm năm 1874", "credit": "Khung hình từ bài giảng Art d'Histoire, dùng để trích dẫn"}, "v4-0065": {"file": "v4-0065.jpg", "w": 800, "h": 449, "cap": "Tập 4, phút 1:05: hai bức La Grenouillère, Renoir và Monet", "credit": "Khung hình từ bài giảng Art d'Histoire, dùng để trích dẫn"}}, "pages": {"overview": {"page": "overview", "title": "Tổng quan", "group": "Bắt đầu", "lead": "Ấn tượng không phải một trường phái có tuyên ngôn, có thủ lĩnh, có phong cách chung. Bốn bài giảng của Art d'Histoire gỡ dần từng định kiến: đó là một nhóm bạn trường vẽ, tự tổ chức tám kỳ triển lãm để bán tranh, và cái tên “Ấn tượng” là một lời chế giễu được giữ lại.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, tập 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 phút)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, tập 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 phút)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, tập 3: “Les huit expositions impressionnistes” (YouTube, 26 phút)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, tập 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 phút)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài bốn bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), tài liệu tham khảo chính mà tập 4 nêu", "date": "2000"}], "blocks": [{"type": "summary", "title": "5 ý chính của bốn bài giảng", "items": [{"title": "Không nổi loạn như người ta kể", "text": "Salon chính thức đang suy tàn; Courbet (1855) và Manet (1867) đã tự triển lãm trước đó; nhà buôn Durand-Ruel đỡ họ về thương mại. Theo người giảng, nhóm trẻ “đi theo một chuyển động”, dù đi rất xuất sắc.", "src": [0]}, {"title": "Có những người đi trước", "text": "Delacroix dạy bóng đổ là màu bổ sung và nét nhỏ không trộn; Courbet dạy tự triển lãm và bán tranh nhỏ; Boudin dạy giữ “ấn tượng ban đầu”; Jongkind “giáo dục con mắt” của Monet.", "src": [0]}, {"title": "Một nhóm bạn, không phải một trường phái", "text": "Họ gặp nhau ở xưởng Suisse và xưởng Gleyre, ở chung, cho nhau vay tiền. Không có hiến chương, không chủ đề áp đặt, không phong cách áp đặt, khác hẳn Lập thể hay Vị lai sau này.", "src": [1]}, {"title": "Tám kỳ triển lãm, nhiều người không “ấn tượng”", "text": "Từ 1874 đến 1886, Degas kéo vào các hoạ sĩ hiện thực; Monet, Renoir, Sisley nhiều lần bỏ đi để gửi Salon; Manet không bao giờ tham gia. Danh sách người triển lãm không trùng với một phong cách.", "src": [2]}, {"title": "“Ấn tượng” theo nghĩa hẹp là vẽ nhanh", "text": "Một bức vẽ trong hai, ba buổi, vài chục đến khoảng trăm nét cọ. Monet thập niên 1870 có nhiều, Renoir hiếm, Degas gần như không. Muốn chứa hết cả nhóm, cái nhãn phải rất co giãn.", "src": [3, 5]}]}, {"type": "diagram", "title": "Cơ chế ra đời của “Ấn tượng” trong một sơ đồ", "img": "d01", "note": "Sơ đồ do người tổng hợp dựng lại từ lập luận của bốn bài giảng."}, {"type": "story", "title": "Đọc sâu: bốn tập, bốn lớp sự thật", "items": [{"title": "Tập 1 · Những người đi trước (1850–1865)", "img": "dela-dieppe", "caption": "Delacroix, Biển nhìn từ cao điểm Dieppe, 1852", "paras": ["Người giảng mở đầu bằng một lời bực mình: tạp chí nghệ thuật cứ gọi nhóm Ấn tượng là “nổi loạn”, “tiên phong”, “intransigeant”. Bài giảng chỉ muốn “đặt mọi thứ về đúng chỗ”.", "Bốn người đi trước được chọn: Delacroix vì lý thuyết màu viết trong nhật ký; Courbet vì cá tính độc lập và bài học bán tranh nhỏ ở Trouville; Boudin và Jongkind vì họ vẽ biển Normandie ngay cạnh Monet trẻ."], "src": [0]}, {"title": "Tập 2 · Nhóm bạn (1862–1870)", "img": "bazille-atelier", "caption": "Bazille, Xưởng vẽ phố La Condamine, 1870", "paras": ["Những người sau này gọi là Ấn tượng là “bạn học”. Mỗi người ngưỡng mộ một bậc thầy khác: Degas có Ingres, Monet có Normandie, Pissarro có Corot.", "Bazille, con nhà khá giả ở Montpellier, thuê xưởng lớn và cho Renoir, Monet ở nhờ. Chính ông lại vẽ theo lối hàn lâm, có phác thảo chuẩn bị. Ông chết ở mặt trận năm 1870, trước khi nhóm kịp triển lãm."], "src": [1]}, {"title": "Tập 3 · Tám kỳ triển lãm (1874–1886)", "img": "nadar-capucines", "caption": "Xưởng ảnh Nadar, 35 đại lộ Capucines, nơi diễn ra kỳ triển lãm đầu tiên", "paras": ["Bị Salon từ chối liên tục, nhóm lập một “hội vô danh” để tự triển lãm và bán tranh. Kỳ đầu năm 1874 có khoảng ba mươi người, phần lớn không phải hoạ sĩ Ấn tượng.", "Cái tên đến từ một bài báo hài: Louis Leroy chế giễu bức Impression, soleil levant của Monet. Qua các kỳ sau, Degas kéo vào hoạ sĩ hiện thực, Monet và Renoir bỏ đi, Seurat bước vào ở kỳ cuối."], "src": [2]}, {"title": "Tập 4 · Ấn tượng thật sự là gì", "img": "monet-grenouillere", "caption": "Monet, La Grenouillère, 1869", "paras": ["Nếu định nghĩa “ấn tượng” là một bức tranh vẽ thật nhanh để ghi lại một hình ảnh vừa nhận được, thì chỉ một phần tranh của nhóm đạt chuẩn: khoảng một phần tư tranh Monet thập niên 1870, vài bức hiếm hoi của Renoir, gần như không có của Degas.", "Nhiều bức nay được coi là kiệt tác Ấn tượng vốn chỉ là “pochade” (bản phác) mà hoạ sĩ định dùng cho một tranh lớn. Người giảng gọi đó là một nghệ thuật “sinh ra từ một sự cố”: không có tiền để hoàn thiện."], "src": [3]}]}, {"type": "gallery", "title": "Bốn bức tranh tóm tắt câu chuyện", "items": [{"img": "boudin-trouville", "caption": "Boudin, khoảng 1865: bãi biển và bầu trời Normandie"}, {"img": "monet-grenouillere", "caption": "Monet, 1869: vẽ cạnh Renoir ở La Grenouillère"}, {"img": "monet-impression", "caption": "Monet, 1872: bức tranh đặt tên cho cả nhóm"}, {"img": "degas-rehearsal", "caption": "Degas, 1874: “người tổ chức” nhóm lại là một nhà hình hoạ"}]}, {"type": "stats", "title": "Vài con số trong bài giảng", "items": [{"value": "8", "label": "Kỳ triển lãm từ 1874 đến 1886", "src": [2]}, {"value": "≈30", "label": "Nghệ sĩ ở kỳ đầu, với khoảng 250 tác phẩm; chỉ một nhóm nhỏ là Ấn tượng", "src": [2]}, {"value": "52", "label": "Bài báo viết về kỳ đầu; chỉ 5 bài ra mặt thù địch", "src": [2]}, {"value": "2 giờ", "label": "“Hai giờ làm việc và đã bán được”: Courbet nói về tranh nhỏ ở Trouville", "src": [0]}, {"value": "2.500 F", "label": "Giá Bazille mua bức Femmes au jardin của Monet, trả 50 franc mỗi tháng", "src": [1]}, {"value": "≈ ¼", "label": "Tỷ lệ tranh Monet thập niên 1870 thật sự là “vẽ nhanh”, theo các chuyên gia mà tập 4 dẫn", "src": [3, 5]}]}, {"type": "callout", "tone": "info", "title": "Những câu được trích làm tinh thần bài giảng", "items": ["Boudin: “Ba nét cọ vẽ theo tự nhiên còn giá trị hơn hai ngày làm việc trên giá vẽ.”", "Monet nói về Jongkind: “Tôi nợ ông ấy sự giáo dục sau cùng cho con mắt của mình.”", "Người giảng kết luận: nhãn “Ấn tượng” cần phải “đặc biệt mềm dẻo” để phủ được tất cả các phong cách, chủ đề và cách vẽ ấy."]}]}, "myths": {"page": "myths", "title": "Năm định kiến cần gỡ", "group": "Bối cảnh", "lead": "Báo chí và sách phổ thông thường kể nhóm Ấn tượng như những kẻ nổi loạn, cùng một phong cách, cùng một thủ lĩnh. Bài giảng tập 1 bắt đầu bằng việc tháo từng định kiến một.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, tập 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 phút)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, tập 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 phút)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, tập 3: “Les huit expositions impressionnistes” (YouTube, 26 phút)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, tập 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 phút)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài bốn bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), tài liệu tham khảo chính mà tập 4 nêu", "date": "2000"}], "blocks": [{"type": "compare", "title": "Huyền thoại và thực tế", "left": "Huyền thoại phổ biến", "right": "Theo bài giảng", "rows": [{"label": "Nổi loạn", "left": "Lật đổ Salon, phá truyền thống", "right": "Salon đã suy tàn; Courbet và Manet đã tự triển lãm trước; nhà buôn đỡ phía sau. Họ đi theo một chuyển động", "src": [0]}, {"label": "Hôn nhân", "left": "Cưới ngoài tầng lớp, ngoài tôn giáo như một cử chỉ phản kháng", "right": "Lựa chọn thực tế: vợ bình dân chịu được thu nhập bấp bênh, làm mẫu, nấu ăn. Vợ tư sản như của Gauguin thì không", "src": [0]}, {"label": "“Intransigeant”", "left": "Nhóm cực đoan, có màu chính trị", "right": "Chữ do báo Le Figaro dùng, The Times chép lại. Nhóm gần như phi chính trị; Pissarro có quan điểm nhưng không đưa vào tranh", "src": [0]}, {"label": "Một nhóm có thủ lĩnh", "left": "Manet là thầy, các bạn trẻ là học trò", "right": "Manet chưa từng triển lãm cùng họ; năm 1874 chính Manet theo học cách vẽ của Monet ở Argenteuil", "src": [0, 1]}, {"label": "Cùng chủ đề, cùng phong cách", "left": "Phong cảnh, nét cọ rời, ánh sáng", "right": "Biển của Monet và vũ nữ của Degas “cách nhau cả một thế giới”; Bazille, Caillebotte vẽ rất hàn lâm", "src": [0, 2]}, {"label": "Vẽ ngoài trời trong 15 phút", "left": "Một nhát là xong, ngay trước cảnh", "right": "Ít nhất hai buổi, mỗi buổi chừng 30 phút; nhiều tranh lớn hoàn thiện trong xưởng", "src": [0, 3]}]}, {"type": "diagram", "title": "Trực quan hoá: huyền thoại và thực tế", "img": "d-myths", "note": "Sơ đồ do người tổng hợp vẽ lại từ bảng trên. Cột trái là hình dung phổ biến, cột phải là điều bài giảng chứng minh."}, {"type": "story", "title": "Từng định kiến, từng bằng chứng", "items": [{"title": "“Nổi loạn” nhưng vẫn gửi Salon", "img": "monet-heve", "caption": "Monet, Mũi La Hève lúc triều xuống, Salon 1865", "paras": ["Monet bước vào Salon năm 1865 với một bức biển lớn vẽ trong xưởng. Theo người giảng, cho đến tận lúc có các kỳ triển lãm Ấn tượng và cả sau đó, ông vẫn gửi tranh vào Salon.", "Đến năm 1880 Monet lại gửi Salon bức Lavacourt, khiến ông vắng mặt ở kỳ triển lãm thứ năm. Chữ “nổi loạn” chỉ đúng một phần."], "src": [0, 2]}, {"title": "“Một nhóm” mà không có ảnh chụp chung", "img": "fantin-batignolles", "caption": "Fantin-Latour, Xưởng vẽ ở Batignolles, 1870", "paras": ["Thập niên 1860–1870, ai vui vì được ở cùng nhau thì đi chụp ảnh. Người giảng tìm mãi không thấy một bức ảnh chung nào của nhóm, chỉ có ảnh riêng từng người, và một tấm Pissarro chụp cùng Cézanne.", "Hình ảnh “nhóm” đến từ tranh của Fantin-Latour, một hoạ sĩ Salon luôn phản đối việc triển lãm ngoài Salon. Ông vẽ Manet như một ông thầy giữa các môn đồ, điều mà người giảng gọi là “hoàn toàn kỳ quặc”."], "src": [1]}, {"title": "“Cùng phong cách” mà Degas thì ghét vẽ ngoài trời", "img": "degas-orchestra", "caption": "Degas, Dàn nhạc Nhà hát Opéra, khoảng 1870", "paras": ["Degas là người tổ chức gần như mọi kỳ triển lãm, nhưng là một nhà hình hoạ, vẽ theo trí nhớ, ghét người vẽ phong cảnh ngoài trời. Ông còn muốn đặt tên cho kỳ đầu là “La Capucine” để tránh chữ “ấn tượng”.", "Nhận định: nếu “Ấn tượng” là một phong cách, người tổ chức chính của nó lại đứng ngoài phong cách ấy."], "src": [2, 3]}]}, {"type": "callout", "tone": "warn", "title": "Người giảng tự nhận", "items": ["Bài giảng “có profil rất thấp”, không có vấn đề lớn, không tranh luận: chỉ “đặt các hoạ sĩ Ấn tượng về đúng bối cảnh”.", "Vì thế nên đọc các trang sau như một bài hiệu đính định kiến, không phải một học thuyết mới."], "src": [0, 3]}]}, "timeline": {"page": "timeline", "title": "Dòng thời gian 1855–1886", "group": "Bối cảnh", "lead": "Ba mươi năm từ gian triển lãm riêng của Courbet đến kỳ triển lãm thứ tám có Seurat. Các mốc lấy từ bốn bài giảng, phần bối cảnh do người tổng hợp bổ sung.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, tập 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 phút)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, tập 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 phút)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, tập 3: “Les huit expositions impressionnistes” (YouTube, 26 phút)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, tập 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 phút)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài bốn bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), tài liệu tham khảo chính mà tập 4 nêu", "date": "2000"}], "blocks": [{"type": "timeline", "title": "Các mốc chính", "items": [{"when": "1855", "title": "Courbet dựng “Gian Hiện thực”", "text": "Bị từ chối ở Triển lãm Thế giới, Courbet tự dựng một gian riêng để trưng tranh của mình.", "src": [0], "detail": [["Bối cảnh", "Salon là con đường duy nhất để một hoạ sĩ được biết đến và bán tranh; ban giám khảo do Học viện chi phối."], ["Diễn biến", "Courbet viết cho Nieuwerkerke, quan phụ trách Mỹ thuật: ông là chính phủ của ông, tôi là chính phủ của tôi."], ["Ý nghĩa", "Lần đầu một hoạ sĩ chứng minh có thể triển lãm ngoài Salon. Manet làm lại năm 1867; nhóm trẻ làm theo năm 1874."]], "img": "courbet-burial"}, {"when": "1858–1859", "title": "Boudin gặp Monet ở Le Havre", "text": "Boudin thấy tài của cậu Monet 18 tuổi, lúc đó đang vẽ tranh biếm hoạ, và khuyên lên Paris học.", "src": [0], "detail": [["Bối cảnh", "Le Havre và Honfleur là cảng, cũng là nơi giới khá giả nghỉ hè. Boudin vẽ những bức nhỏ như bưu thiếp, bằng sơn dầu trên giấy."], ["Diễn biến", "Năm 1859 Monet lên Paris. Cùng năm, Baudelaire đến xưởng Boudin và viết về các nghiên cứu mây trời trong bài phê bình Salon 1859."], ["Ý nghĩa", "Bài học đầu tiên của Monet là ánh sáng và bầu trời, học ngay trước cảnh, chưa phải ở trường."]], "img": "boudin-sky"}, {"when": "1862", "title": "Monet gặp Jongkind", "text": "Hai người cùng vẽ quanh quán trọ Saint-Siméon ở Honfleur.", "src": [0], "detail": [["Bối cảnh", "Jongkind là người Hà Lan, quen truyền thống tranh biển, vẽ màu nước rất nhanh với hai, ba tông."], ["Diễn biến", "Họ đi cùng nhau một chặng dài. Năm 1871 Edmond de Goncourt viết rằng cả nền phong cảnh đương thời nợ Jongkind."], ["Ý nghĩa", "Monet: “Tôi nợ ông ấy sự giáo dục sau cùng cho con mắt của mình.”"]], "img": "jongkind-honfleur"}, {"when": "1862–1863", "title": "Những người bạn ở xưởng Suisse và xưởng Gleyre", "text": "Pissarro, Guillaumin, Cézanne ở xưởng Suisse; Monet đi cả hai nơi và gặp Bazille, Renoir, Sisley ở xưởng Gleyre.", "src": [1], "detail": [["Bối cảnh", "Xưởng tự do như Suisse cho thuê mẫu, không dạy; xưởng Gleyre là xưởng dạy luyện thi Trường Mỹ thuật."], ["Diễn biến", "Nhóm bạn hình thành dần, không có văn bản, không có chương trình."], ["Ý nghĩa", "Người giảng tóm lại: các hoạ sĩ Ấn tượng là “bạn cùng trường”, và bạn cùng trường thì lớn lên không làm cùng một nghề."]], "img": "renoir-bazille"}, {"when": "1863", "title": "Delacroix mất", "text": "Nhóm trẻ bực vì chỉ có một cuộc hồi cố nhỏ trong xưởng của ông. Hơn hai mươi năm sau Nhà nước mới làm một hồi cố lớn.", "src": [0], "detail": [["Bối cảnh", "Delacroix làm cho Nhà nước và nhà thờ, vẽ bạo lực thần thoại và lãng mạn, rất xa đề tài của nhóm trẻ."], ["Diễn biến", "Năm 1864 Fantin-Latour vẽ Hommage à Delacroix: Manet, Whistler, Baudelaire, Bracquemond, Duranty, Champfleury quanh chân dung ông."], ["Ý nghĩa", "Họ tôn ông vì màu: nhật ký của Delacroix đã viết trước những nguyên tắc mà nhóm Ấn tượng và Seurat dùng sau này."]], "img": "fantin-hommage"}, {"when": "1864–1866", "title": "Tranh nhỏ ở Normandie: bài học bán hàng", "text": "Courbet ở Trouville năm 1865 vẽ hàng loạt bức biển nhỏ, bán “như bánh mì”. Monet ở Honfleur làm điều tương tự.", "src": [0], "detail": [["Bối cảnh", "Một tranh lớn như Đám tang ở Ornans tốn sơn, tốn vải, tốn thời gian, khó bán."], ["Diễn biến", "Courbet viết: “Hai giờ làm việc và đã bán được.” Monet bán bức nghiên cứu đầu tiên cho một nhà sưu tập ở Honfleur, rồi một bức cho Boudin."], ["Ý nghĩa", "Theo người giảng, “vẽ nhanh” bắt đầu từ lý do kinh tế, không chỉ từ một lý thuyết về cảm giác."]], "img": "courbet-trouville"}, {"when": "1865", "title": "Monet lần đầu vào Salon", "text": "Bức Mũi La Hève lúc triều xuống, vẽ lớn trong xưởng từ các nghiên cứu ngoài trời, được nhận.", "src": [0], "detail": [["Bối cảnh", "Muốn được biết đến và có khách, phải qua Salon."], ["Diễn biến", "Monet tổng hợp bài học của Boudin (bầu trời), Jongkind (biển), Courbet (tương phản, dao vẽ)."], ["Ý nghĩa", "Monet tiếp tục gửi Salon cả khi đã có triển lãm Ấn tượng."]], "img": "monet-heve"}, {"when": "1867", "title": "Salon từ chối, thư gửi Nieuwerkerke", "text": "Monet, Sisley, Renoir không qua được ban giám khảo. Nhóm ký thư đòi một Salon của những người bị từ chối.", "src": [2], "detail": [["Bối cảnh", "Femmes au jardin của Monet (khoảng 2,5 m) bị từ chối, có lẽ vì đề tài nhẹ trên khổ lớn, không phải vì thiếu độ hoàn thiện."], ["Diễn biến", "Theo lời giảng, thư đến vào ngày 1 tháng 4 và không bao giờ có hồi âm. Bazille mua bức tranh với giá 2.500 franc."], ["Ý nghĩa", "Ý tưởng tự tổ chức triển lãm bắt đầu thành hình. Manet cũng dựng gian riêng năm 1867."]], "img": "monet-femmes"}, {"when": "1869", "title": "La Grenouillère", "text": "Monet và Renoir đặt giá vẽ cạnh nhau, cách nhau vài mét, mỗi người vẽ ba bức.", "src": [3], "detail": [["Bối cảnh", "La Grenouillère là quán tắm và chèo thuyền trên sông Seine gần Bougival."], ["Diễn biến", "Monet viết cho Bazille rằng ông mơ một bức lớn và chỉ có được “mấy bản phác tồi” (pochades)."], ["Ý nghĩa", "Những bức nay được coi là khởi đầu của phong cách Ấn tượng vốn chỉ là nghiên cứu cho một tranh lớn không bao giờ được vẽ."]], "img": "monet-grenouillere"}, {"when": "1870–1871", "title": "Chiến tranh Pháp–Phổ", "text": "Bazille tình nguyện vào đội Zouaves và tử trận. Monet và Pissarro sang London, gặp nhà buôn Durand-Ruel.", "src": [1], "detail": [["Bối cảnh", "Paris bị vây; Cézanne về Provence; Renoir vào kỵ binh bốn tháng nhưng không ra trận; Degas và Manet vào Vệ binh Quốc gia."], ["Diễn biến", "Từ 1872 Durand-Ruel bắt đầu mua tranh của nhóm. Monet ghé Zaandam (Hà Lan) năm 1871 và vẽ bằng lối pha loãng hiếm thấy ở ông."], ["Ý nghĩa", "Nhóm mất người có tầm vóc thủ lĩnh, Bazille; đồng thời có được một nhà buôn."]], "img": "monet-zaandam"}, {"when": "1874", "title": "Kỳ triển lãm đầu tiên", "text": "Hội vô danh của các hoạ sĩ, nhà điêu khắc, thợ khắc trưng bày ở xưởng cũ của Nadar, 35 đại lộ Capucines.", "src": [2], "detail": [["Bối cảnh", "Quy chế hội được Pissarro lấy theo quy chế của hội thợ làm bánh ở Pontoise."], ["Diễn biến", "Khoảng ba mươi nghệ sĩ, 250 tác phẩm. Mười ngày sau, Louis Leroy viết bài chế giễu trên Le Charivari."], ["Ý nghĩa", "Từ bài báo đó, chữ “Ấn tượng” bám lấy cả nhóm."]], "img": "monet-impression"}, {"when": "1876–1882", "title": "Các kỳ 2 đến 7", "text": "Danh sách thay đổi liên tục: Degas kéo hoạ sĩ hiện thực vào; Renoir, Sisley, Monet lần lượt rời đi; Gauguin đấu với Raffaëlli.", "src": [2], "detail": [["Bối cảnh", "Nhóm bán được tranh ngày càng nhiều ngoài các kỳ triển lãm."], ["Diễn biến", "Kỳ 3 (1877) là lần duy nhất nhóm chính thức tự gọi là “Ấn tượng”; đó cũng là lần cuối Cézanne tham gia."], ["Ý nghĩa", "Những người được coi là “lõi” không có mặt đủ ở bất kỳ kỳ nào sau kỳ 3."]], "img": "caillebotte-pont"}, {"when": "1886", "title": "Kỳ thứ tám, kỳ cuối", "text": "Sau bốn năm gián đoạn, Degas trở lại; Seurat và Signac bước vào; Monet, Renoir, Sisley vắng mặt.", "src": [2], "detail": [["Bối cảnh", "Monet và Renoir đã có chỗ đứng trên thị trường và không cần triển lãm chung nữa."], ["Diễn biến", "Seurat trưng bức Chủ nhật trên đảo Grande Jatte; Félix Fénéon gọi đó là “Tân Ấn tượng”."], ["Ý nghĩa", "Chuỗi triển lãm khép lại bằng một khuynh hướng khoa học hoá chính cái “nét nhỏ” mà Delacroix đã nói tới."]], "img": "seurat-jatte"}]}, {"type": "story", "title": "Bối cảnh: Salon, đại lộ và tiền", "items": [{"title": "Salon đang mất quyền lực", "paras": ["Salon là kênh duy nhất để hoạ sĩ được biết tới và bán được tranh. Người trẻ “dồn hết tiền vào sơn” mà tranh không được treo thì không bán được: tương lai của họ ở đâu?", "Năm 1870 Daubigny từ chức khỏi ban giám khảo vì Monet bị từ chối. Theo lời giảng, chính Daubigny và Manet cố dàn xếp, còn Durand-Ruel thì nói: đến nước này, phải tự tổ chức Salon của mình."], "src": [2]}, {"title": "Đại lộ Capucines và chủ nghĩa tiêu dùng", "img": "monet-boulevard", "caption": "Monet, Đại lộ Capucines, 1873–1874", "paras": ["Kỳ đầu đặt ở đại lộ lớn, rất thương mại, giữa các cửa hàng. Người giảng nhắc rằng các sử gia Mác-xít nửa sau thế kỷ 20 phê phán việc gắn khởi đầu của Ấn tượng với khởi đầu của xã hội tiêu dùng, nảy ra thập niên 1870 và bùng nổ thập niên 1880–1890, khi chính các hoạ sĩ bắt đầu bán rất chạy.", "Nhận định: đây là mạch xuyên suốt cả bốn tập: Ấn tượng gắn với thị trường từ trước khi nó trở thành một phong cách."], "src": [2]}]}]}, "delacroix-courbet": {"page": "delacroix-courbet", "title": "Delacroix và Courbet: hai người đi trước", "group": "Tiền đề", "lead": "Hai bậc thầy có vẻ xa nhất với Ấn tượng: một nhà lãng mạn làm trần nhà thờ, một nhà hiện thực vẽ bằng dao. Người giảng chỉ ra mỗi người để lại cho nhóm trẻ một bài học khác hẳn.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, tập 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 phút)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, tập 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 phút)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, tập 3: “Les huit expositions impressionnistes” (YouTube, 26 phút)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, tập 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 phút)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài bốn bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), tài liệu tham khảo chính mà tập 4 nêu", "date": "2000"}, {"name": "Art d'Histoire, tập 1, phút 11:47", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&t=707s", "date": ""}, {"name": "Art d'Histoire, tập 1, phút 12:37", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&t=757s", "date": ""}], "blocks": [{"type": "principles", "title": "Bốn bài học", "items": [{"title": "Bóng đổ là màu bổ sung", "rule": "Không thêm đen vào màu để làm tối; tìm màu đối lập.", "why": "Delacroix: thêm đen là “làm bẩn tông”. Đứa bé tóc vàng có bóng tím, đứa má đỏ có bóng xanh lục. “Mọi bóng đổ đều mang màu tím.”", "img": "chevreul-cercle"}, {"title": "Nét nhỏ không trộn", "rule": "Đặt các nét màu cạnh nhau, để mắt tự trộn ở khoảng cách.", "why": "Delacroix: các nét “tự hoà vào nhau ở khoảng cách mong muốn theo một luật thiện cảm”, và màu “có thêm năng lượng và tươi mới”.", "img": "dela-dieppe"}, {"title": "Tự triển lãm, tự khẳng định", "rule": "Không cần Salon cho phép mới được trưng tranh.", "why": "Courbet dựng gian riêng 1855, là người tỉnh lẻ tự áp đặt mình ở Paris. Nhóm trẻ học tính cách đó nhiều hơn học nét dao của ông.", "img": "courbet-burial"}, {"title": "Tranh nhỏ, vẽ nhanh, bán được", "rule": "Khổ chừng 50×50 cm, vài giờ, giá vừa phải.", "why": "Trouville 1865: “Hai giờ làm việc và đã bán được.” Theo người giảng đây là “bài học lớn” mà Monet nhớ.", "img": "courbet-trouville"}]}, {"type": "story", "title": "Delacroix: một nhà cổ điển được tôn làm thầy", "items": [{"title": "Nhật ký đọc như của một hoạ sĩ Ấn tượng", "img": "delacroix-portrait", "caption": "Delacroix, Chân dung tự hoạ, khoảng 1837", "paras": ["Delacroix có đĩa màu của Chevreul trong xưởng. Khi đi Saint-Denis-du-Saint-Sacrement, ông ghi: vẽ ánh sáng bằng vàng crôm nguyên chất, nửa tối bằng xanh Phổ, không pha đen vì “bẩn”.", "Về “nét nhỏ”, ông nói phải tìm nó từ Raphael và khuyên bạn đi xem các bức gouache lớn của Correggio. Người giảng nhắc rằng bảng màu Ấn tượng vẫn giữ màu đen khi cần, Manet và cả Monet đều dùng."], "src": [0]}, {"title": "Bị chê “bôi bẩn” vì nét rời", "img": "dela-sardanapale", "caption": "Delacroix, Cái chết của Sardanapale, 1827", "paras": ["Nhìn xa thì đẹp, nhìn gần thì giới phê bình thấy đầy nét nhỏ, chưa “hoàn thiện”, gọi là “tartouillage”, “barbouillage”.", "Đó cũng chính là lời chê mà nhóm Ấn tượng sẽ nhận hai mươi năm sau."], "src": [0]}]}, {"type": "media", "kicker": "Case study · Tập 1, phút 11:47", "title": "Renoir mượn hình của Courbet, nhưng đó không phải điểm chính", "img": "v1-0707", "caption": "Trái: Courbet, Les Baigneuses (1853) và Les Demoiselles des bords de la Seine (1856). Phải: Renoir, Baigneuse au griffon, Salon 1870 · phút 11:47", "text": "Người giảng chỉ ra bức Renoir như một “lai ghép” của hai tranh Courbet: thân khoả thân và người mặc áo nghiêng đầu từ Les Baigneuses, cô gái nằm đã cởi chiếc áo trắng viền ren đỏ và gốc cây như mép sân khấu từ Les Demoiselles. Rồi người giảng gạt đi: các tham chiếu hình tượng này “chẳng để làm gì”, vì Courbet là tiền đề ở chỗ khác.", "bullets": ["Nhìn chiếc váy trắng viền đỏ: cùng một món đồ ở hai bức.", "Nhìn thân thể: Courbet đầy da thịt, Renoir mịn và sáng hơn.", "Renoir còn vẽ Diane (1867) với con nai chết, một lời chào Courbet, người mê săn bắn."], "src": [6]}, {"type": "media", "kicker": "Case study · Tập 1, phút 12:37", "title": "Quán mẹ Anthony: tư thế mượn từ Courbet", "img": "v1-0757", "side": "right", "caption": "Trái: Courbet, L'Après-dînée à Ornans, 1849. Phải: Renoir, À l'auberge de la mère Anthony, 1866 · phút 12:37", "text": "Hai bức cùng chơi tương phản đen trắng, và Renoir lấy lại gần như nguyên tư thế người đàn ông ngồi quay lưng, ba phần tư, trước một chiếc bàn. Trên bàn là tờ L'Événement, tờ báo của Zola, một cái nháy mắt cho Zola; con chó dưới bàn là Toto.", "bullets": ["Người quay lưng ở tiền cảnh: cùng vị trí trong cả hai tranh.", "Bảng màu tối, chưa có gì “ấn tượng”: Renoir 1866 còn rất gần Courbet."], "src": [7]}, {"type": "callout", "tone": "good", "title": "Kết luận của trang", "items": ["Delacroix để lại lý thuyết màu: bóng là màu bổ sung, nét nhỏ không trộn, “trộn trên võng mạc” (về sau Seurat làm chặt chẽ).", "Courbet để lại tính cách và một mô hình kinh tế: tự triển lãm, và bán tranh nhỏ vẽ nhanh.", "Các mượn hình từ Courbet ở Renoir có thật, nhưng theo người giảng đó không phải lý do Courbet là tiền đề."], "src": [0]}]}, "boudin-jongkind": {"page": "boudin-jongkind", "title": "Boudin, Jongkind và bờ biển Normandie", "group": "Tiền đề", "lead": "Le Havre, Sainte-Adresse, Trouville, Honfleur: Monet trẻ học vẽ ngay trên bờ biển, cạnh hai bậc thầy về bầu trời và mặt nước.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, tập 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 phút)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, tập 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 phút)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, tập 3: “Les huit expositions impressionnistes” (YouTube, 26 phút)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, tập 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 phút)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài bốn bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), tài liệu tham khảo chính mà tập 4 nêu", "date": "2000"}, {"name": "Art d'Histoire, tập 1, phút 18:17", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&t=1097s", "date": ""}], "blocks": [{"type": "principles", "title": "Bốn điều Monet học ở Normandie", "items": [{"title": "Bầu trời ghi ngày giờ", "rule": "Vẽ mây thật nhanh, ghi ngay ngày, giờ, hướng gió bên lề.", "why": "Boudin làm như Constable. Baudelaire thấy trong xưởng ông những nghiên cứu ghi “8 tháng 10, trưa, gió tây bắc”.", "img": "boudin-sky"}, {"title": "Giữ ấn tượng ban đầu", "rule": "Cái vẽ tại chỗ có một sức mạnh mà xưởng không lấy lại được.", "why": "Boudin: phải “cứng đầu tột độ” để ở lại trong ấn tượng ban đầu, “ấn tượng nguyên sơ”, vì nó mới đúng.", "img": "boudin-trouville"}, {"title": "Hai, ba tông pha loãng", "rule": "Một màu be, một nâu đen, một xanh lam, pha loãng nhiều mức.", "why": "Màu nước của Jongkind vẽ rất nhanh: ướt cọ, quét, gần như khô ngay. Monet ở Zaandam năm 1871 dùng lại gần đúng lối đó.", "img": "jongkind-honfleur"}, {"title": "Tổng hợp thành tranh Salon", "rule": "Ghép các bài học vào một bức lớn vẽ trong xưởng.", "why": "Mũi La Hève (Salon 1865): bầu trời học từ Boudin, biển theo tông Jongkind, tương phản có lẽ từ Courbet.", "img": "monet-heve"}]}, {"type": "media", "kicker": "Case study · Tập 1, phút 18:17", "title": "“Bưu thiếp” mây trời của Boudin", "img": "v1-1097", "caption": "Ba nghiên cứu bầu trời của Boudin: trời giông, trời 4 giờ chiều gió đông, trời sau mưa · phút 18:17", "text": "Người giảng nhấn vào kích thước: 10×14, 11×18 cm, như một tấm bưu thiếp. Đây là sơn dầu trên giấy, không phải màu nước: giấy hút dầu nên khô nhanh hơn. Boudin đứng trước mây, vẽ nhanh nhất có thể, như Constable.", "bullets": ["Khổ tí hon: một buổi là xong.", "Không có người, không có cảnh: chỉ có ánh sáng và chuyển động.", "Những “bưu thiếp” này là bài tập, không phải tranh để bán ở Salon."], "src": [6]}, {"type": "story", "title": "Ba người thầy trên bờ biển", "items": [{"title": "Boudin và lời ca của Baudelaire", "img": "boudin-trouville", "caption": "Boudin, Bãi biển Trouville", "paras": ["Boudin gặp Monet năm 1858, khi Monet còn là một người vẽ biếm hoạ. Năm 1859, Monet lên Paris học.", "Mẹ Baudelaire có nhà ở Le Havre. Trong bài phê bình Salon 1859, Baudelaire viết rằng giá các nhà phê bình khác thấy được những nghiên cứu ông thấy ở xưởng Boudin; chúng “bốc lên óc như một thứ đồ uống nồng hay như hùng biện của thuốc phiện”.", "Boudin nổi tiếng với cảnh bãi Trouville đầy khách nghỉ hè sang trọng, nhưng điều người giảng muốn ta nhìn là bầu trời và độ sáng."], "src": [0]}, {"title": "Jongkind, “khi không say”", "img": "jongkind-havre", "caption": "Jongkind, Le Havre", "paras": ["Jongkind là người Hà Lan, quen tranh biển, vẽ ở Le Havre, Sainte-Adresse, Trouville, Honfleur, đúng những nơi Monet vẽ. Hai người gặp nhau năm 1862 và làm việc cùng nhau ở quán Saint-Siméon.", "Người giảng tóm: Monet học bố cục và màu với Jongkind, ánh sáng với Boudin; có người kể thêm Ribot, và đôi khi Courbet về lớp sơn dày và dao vẽ."], "src": [0]}, {"title": "Từ nghiên cứu nhỏ đến bức tranh Salon", "img": "monet-honfleur", "caption": "Monet, Bãi biển Honfleur, khoảng 1864–1866", "paras": ["Ở Saint-Siméon những năm 1864–1866, Monet làm những bức nhỏ, tốn ít thời gian và ít sơn, rồi bán. Ông viết cho Bazille rằng ông thích gửi cho một ông chủ ở Montpellier một bức “nghiên cứu” hơn là “tranh”.", "Người giảng giải thích: “tranh” (tableau) nghĩa là tranh đã hoàn thiện. Những gì ta ngày nay ngưỡng mộ như “ấn tượng” thì trong đầu ông có thể chưa xong; chỉ là chúng rẻ và bán được."], "src": [0]}]}, {"type": "callout", "tone": "good", "title": "Kết luận của trang", "items": ["Ba thứ cần có của “ấn tượng” đều đã có trên bờ biển Normandie trước năm 1866: ghi nhanh ánh sáng (Boudin), giản lược tông màu (Jongkind), và một thị trường cho tranh nhỏ (Courbet).", "Boudin đã nói ra mâu thuẫn mà Monet sẽ vật lộn: sức sống của bản phác rất khó truyền sang tranh lớn hoàn thiện."], "src": [0, 3]}]}, "friends": {"page": "friends", "title": "Nhóm bạn trường vẽ", "group": "Nhóm bạn", "lead": "Không có hiến chương, không thủ lĩnh, không chủ đề bắt buộc. Một nhóm bạn quen nhau ở xưởng vẽ, ở chung, cho nhau tiền, ngồi cà phê cùng nhau, và mỗi người tìm ra giọng riêng.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, tập 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 phút)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, tập 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 phút)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, tập 3: “Les huit expositions impressionnistes” (YouTube, 26 phút)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, tập 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 phút)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài bốn bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), tài liệu tham khảo chính mà tập 4 nêu", "date": "2000"}], "blocks": [{"type": "cards", "title": "Ai là ai trong nhóm", "items": [{"title": "Camille Pissarro", "meta": "1830–1903 · xưởng Suisse", "text": "Đến năm 1866 còn ghi tên ở Salon là “học trò Corot”. Người duy nhất có học trò thật (Cézanne, Gauguin), nhưng quá bình đẳng để làm thủ lĩnh.", "src": [1, 2], "img": "pissarro-louveciennes"}, {"title": "Claude Monet", "meta": "1840–1926 · Suisse và Gleyre", "text": "Người được muốn làm thủ lĩnh, nói chuyện với nhà báo, đi xin chữ ký. Nhưng “không chính trị chút nào”: tranh của ông bán, không phải tranh của nhóm.", "src": [2], "img": "monet-camille"}, {"title": "Pierre-Auguste Renoir", "meta": "1841–1919 · xưởng Gleyre", "text": "Trước hết là hoạ sĩ chân dung và hình người. Ở chung xưởng với Bazille nhiều năm.", "src": [1, 3], "img": "renoir-loge"}, {"title": "Frédéric Bazille", "meta": "1841–1870 · xưởng Gleyre", "text": "Con nhà khá giả ở Montpellier, cao nhất nhóm, cho bạn ở nhờ và mua tranh của Monet. Tử trận năm 1870.", "src": [1], "img": "renoir-bazille"}, {"title": "Edgar Degas", "meta": "1834–1917 · học hàn lâm, 3 năm ở Ý", "text": "Ngưỡng mộ Ingres trên hết. Người tổ chức gần như mọi kỳ triển lãm, nhưng là một nhà hình hoạ.", "src": [1, 2], "img": "degas-manet"}, {"title": "Édouard Manet", "meta": "1832–1883", "text": "Có tên tuổi từ trước, chỉ đường cho nhóm nhưng không dạy, và chưa từng triển lãm cùng họ.", "src": [1, 2], "img": "manet-olympia"}]}, {"type": "story", "title": "Một nhóm “không chính thức”", "items": [{"title": "Corot, con đường dẫn vào tranh của Pissarro", "img": "corot-souvenir", "caption": "Corot, Kỷ niệm Mortefontaine, 1864", "paras": ["Người giảng nhắc tới trường Barbizon nhưng chỉ nói nhanh về Corot. Tranh Barbizon nay trông tối vì họ vẽ trên nền bitum, màu đen ăn ngược lên lớp sơn.", "Ở Corot có một thứ gần như luôn thấy ở Pissarro: con đường đi vào tranh, đưa mắt vào không gian ba chiều giả, điểm thêm người nhỏ, tường, cây. Khi kỳ triển lãm đầu mở năm 1874, một nhà phê bình than: “Ôi Corot, bao tội ác đã nhân danh ông!”"], "src": [1]}, {"title": "Pissarro đổi nét sau London", "img": "pissarro-louveciennes", "caption": "Pissarro, Đường Louveciennes, 1872", "paras": ["Vẫn có con đường, nhưng giờ nằm chéo; bức tường đóng lại thay vì dẫn mắt. Một nét cọ cho một khung cửa sổ, hai nét cho một thanh gỗ (một nâu, một trắng đè lên). Người giảng gọi những nét đâm nhanh vẽ cành cây mùa đông là “staccato của cọ”.", "Ở London 1870–1871, Monet và Pissarro, có lẽ không nói được tiếng Anh, tìm đến nhau, vẽ cùng nhau, và gặp Durand-Ruel. Sự thay đổi ở Pissarro tăng tốc từ đó."], "src": [1]}, {"title": "Ở chung: “một bệnh xá tài chính”", "img": "renoir-bazille", "caption": "Renoir, Bazille bên giá vẽ, 1867", "paras": ["Bazille thuê xưởng phố Visconti khoảng 1866–1867 và cho Renoir ở chung. Monet, vừa phải rời nhà Sisley vì Sisley lấy vợ, cũng dọn tới. Bazille viết cho mẹ: đây là một “bệnh xá” thật sự, theo người giảng là bệnh xá về tiền.", "Từ 1868 đến 1870, Renoir ở chung và góp một phần tiền thuê xưởng phố La Condamine. Ở chung nên họ vẽ nhau: Renoir vẽ Bazille đang vẽ, sau lưng có lẽ là một cảnh tuyết của Monet."], "src": [1]}, {"title": "Café Guerbois: thủ lĩnh của những cuộc chuyện trò", "img": "manet-olympia", "caption": "Manet, Olympia, 1863", "paras": ["Manet là thủ lĩnh ở một chỗ: kéo cả nhóm đến quán cà phê Guerbois, nơi ông có bàn riêng vào tối thứ Sáu. Monet kể những cuộc chuyện trò ấy “rất màu mỡ”. Đây là những người ăn mặc chỉnh tề, khác xa giới bohème của Courbet đầu thập niên 1850.", "Một lần Manet tát nhẹ Duranty vì một bài phê bình, hai người xắn tay áo đánh nhau rồi được tách ra. Còn các kỳ triển lãm thì được quyết định sau này ở quán Nouvelle-Athènes."], "src": [1]}]}, {"type": "media", "kicker": "Tranh nhóm, không phải ảnh nhóm", "title": "Fantin-Latour vẽ Manet như một ông thầy", "img": "fantin-batignolles", "caption": "Fantin-Latour, Xưởng vẽ ở Batignolles, 1870", "text": "Về phong cách, bức này không có gì “ấn tượng”: sáng tối kiểu hàn lâm, có cả một tượng Hy Lạp. Fantin-Latour đặt Manet
