ở giữa như một ông thầy, quanh là Scholderer, Renoir, Astruc, Zola, Maître, Bazille, Monet. Một bức biếm hoạ thời đó còn vẽ Manet như Chúa với các con chiên.", "bullets": ["Manet không có học trò; năm 1874 ông đến Argenteuil và tự học theo Monet một thời gian.", "Renoir đứng như một cậu bé giúp lễ, như đang nghe giảng.", "Bazille, người cao nhất, đứng bên phải."], "src": [1]}, {"type": "callout", "tone": "info", "title": "Kết luận của trang", "items": ["Họ là “bạn cùng trường”: có những lúc chia sẻ, nhưng không cùng phong cách, vì không ai viết một hiến chương nói phải vẽ gì, vẽ thế nào.", "So sánh của người giảng: Lập thể Salon và Vị lai đầu thế kỷ 20 mới là những avant-garde có thủ lĩnh và đường lối."], "src": [1]}]}, "bazille": {"page": "bazille", "title": "Bazille: hàn lâm giữa lòng Ấn tượng", "group": "Nhóm bạn", "lead": "Người có thể đã thành thủ lĩnh của nhóm lại vẽ có phác thảo chuẩn bị, kẻ ô, và dựng khối như một hoạ sĩ Salon. Trường hợp Bazille là bằng chứng mạnh nhất rằng không có một “phong cách Ấn tượng” chung.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, tập 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 phút)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, tập 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 phút)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, tập 3: “Les huit expositions impressionnistes” (YouTube, 26 phút)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, tập 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 phút)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài bốn bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), tài liệu tham khảo chính mà tập 4 nêu", "date": "2000"}], "blocks": [{"type": "principles", "title": "Bốn điểm khiến Bazille khác Monet", "items": [{"title": "Phác thảo chuẩn bị, kẻ ô", "rule": "Vẽ hình trước trên giấy, chuyển lên toan từng ô một.", "why": "Trong kho hình hoạ của Louvre có các phác thảo cho Vue de village, còn nguyên các đường kẻ để chuyển ô.", "img": "bazille-village"}, {"title": "Khoả thân hàn lâm", "rule": "Thân thể dựng như tượng Hy Lạp.", "why": "Pêcheur à l'épervier bị Salon từ chối, theo người giảng không phải vì vẽ kém mà vì “quá hiện thực”; người thứ hai lấy dáng từ tượng Spinario.", "img": "bazille-pecheur"}, {"title": "Trả lại mỗi vật sức nặng và khối", "rule": "Nhận ra được loài cây, từng khuôn mặt.", "why": "Bazille viết muốn “trả lại cho mỗi vật sức mạnh và khối của nó”: ngược hẳn sự hoà tan của Renoir, Morisot, Monet đầu thập niên 1870.", "img": "bazille-reunion"}, {"title": "Hình người ghép vào cảnh", "rule": "Cảnh vẽ ngoài trời, người vẽ trong xưởng.", "why": "Scène d'été (Salon 1870): chân không “ăn” vào nền, một người sai tỉ lệ, người đang tắm lệch màu với nước.", "img": "bazille-ete"}]}, {"type": "story", "title": "Người bạn giàu, người mua tranh, người lính", "items": [{"title": "Mạnh thường quân của Monet", "img": "monet-femmes", "caption": "Monet, Femmes au jardin, 1866–1867", "paras": ["Femmes au jardin cao khoảng 2,5 m. Monet đào một cái hào trong vườn và dùng ròng rọc kéo toan lên xuống để luôn vẽ trước cảnh mà không đổi điểm nhìn.", "Tranh bị Salon từ chối. Bazille mua với giá 2.500 franc, trả 50 franc mỗi tháng; theo người giảng chuyện này sinh ra cả một “cuộc chiến thư từ” vì Monet muốn tiền ngay."], "src": [1]}, {"title": "Hai cô gái trước phong cảnh, hai cách vẽ", "img": "bazille-village", "caption": "Bazille, Vue de village, 1868", "paras": ["Ở Vue de village, đường nét cô gái gần như Ý, nhận ra được vỏ thông, lá thông, và một ngôi làng bố cục hoàn hảo phía sau.", "Cùng năm, ở Au bord de l'eau, Bennecourt của Monet: thân cây là nét cọ, không nhận ra vỏ; cô gái không có mặt, váy là một nét xanh và một nét trắng. Người giảng gọi đó là “một khoảng cách khổng lồ”."], "src": [1]}, {"title": "Chết ở trận đầu", "img": "bazille-renoir", "caption": "Bazille, Chân dung Renoir, 1867", "paras": ["Năm 1870 Bazille ở Montpellier. Trước quân Phổ, ông tình nguyện vào đội Zouaves; người cao nhất trên chiến trường thì dễ bị thấy, và ông là một trong những người đầu tiên trúng đạn.", "Bức chân dung Renoir này vẽ nhanh, có thể trong hai buổi vì màu đã định vị sẵn. Nhưng người giảng nhấn mạnh: đây là bức vẽ “không chính thức”, không đại diện cho tranh hoàn thiện của Bazille."], "src": [1]}]}, {"type": "media", "kicker": "Hình ảnh gần nhất với “một nhóm”", "title": "Xưởng vẽ phố La Condamine", "img": "bazille-atelier", "caption": "Bazille, L'Atelier de Bazille, 1870 · Musée d'Orsay", "text": "Theo người giảng, đây có lẽ là hình ảnh đúng nhất về một “nhóm Ấn tượng”: cái xưởng Bazille ở chung với Renoir. Bazille (người cao, do Manet vẽ vào) đứng trước giá vẽ; Manet râu vàng bình phẩm tranh, cạnh là Monet; người chơi đàn là Edmond Maître; hai người còn lại có lẽ là Astruc và Renoir.", "bullets": ["Tường xanh: các kỳ triển lãm sau sẽ có tường lila và khung màu.", "Trên tường: tranh Renoir và tranh Bazille từng bị Salon từ chối.", "Trên đi-văng: có lẽ một tranh của Monet, nhắc rằng Bazille mua tranh của ông."], "src": [1]}, {"type": "callout", "tone": "warn", "title": "Kết luận của trang", "items": ["Ở trung tâm của nhóm đầu thập niên 1870 có một chủ nghĩa hiện thực rất cao.", "Vẽ ngoài trời đã có từ đầu thế kỷ 19 và được đẩy nhanh nhờ ống sơn (một người Mỹ phát minh năm 1841, sau đó Lefranc làm ở Pháp). Nó không phải phát minh của nhóm."], "src": [1]}]}, "exhibitions": {"page": "exhibitions", "title": "Tám kỳ triển lãm 1874–1886", "group": "Triển lãm", "lead": "Nếu gọi “Ấn tượng” là những ai tham gia tám kỳ triển lãm, định nghĩa ấy đổ vỡ ngay: Manet không bao giờ có mặt, Monet và Renoir thường vắng, còn những người hiện thực do Degas mời lại có mặt.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, tập 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 phút)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, tập 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 phút)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, tập 3: “Les huit expositions impressionnistes” (YouTube, 26 phút)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, tập 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 phút)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài bốn bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), tài liệu tham khảo chính mà tập 4 nêu", "date": "2000"}, {"name": "Art d'Histoire, tập 3, phút 4:37", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&t=277s", "date": ""}], "blocks": [{"type": "timeline", "title": "Từng kỳ một", "items": [{"when": "1874 · Kỳ 1", "title": "Hội vô danh, 35 đại lộ Capucines", "text": "Khoảng 30 nghệ sĩ, 250 tác phẩm, ở xưởng cũ của Nadar.", "src": [2], "detail": [["Bối cảnh", "Một “hội vô danh” có quy chế lấy từ hội thợ làm bánh Pontoise, ý của Pissarro, người theo chủ nghĩa bình quân của Proudhon."], ["Diễn biến", "Tầng một, hướng bắc, ánh sáng tuyệt vời; tranh treo hai hàng, không phủ kín từ sàn tới trần như Salon."], ["Ý nghĩa", "Một hội thực dụng và kinh tế, không có ý thức hệ. Chưa có chữ “Ấn tượng” trên catalogue."]], "img": "nadar-capucines"}, {"when": "1876 · Kỳ 2", "title": "Phòng tranh Durand-Ruel, phố Le Peletier", "text": "Ít người hơn, nhưng vẫn nhiều tên phụ.", "src": [2], "detail": [["Bối cảnh", "Hai năm sau kỳ đầu, nhà buôn cho mượn chỗ."], ["Diễn biến", "Degas và Caillebotte đứng ra tổ chức. Albert Wolff trên Le Figaro chê bức Torse của Renoir."], ["Ý nghĩa", "Degas càng tổ chức càng “kéo khăn bàn về phía mình”: mời hoạ sĩ vẽ người."]], "img": "renoir-torse"}, {"when": "1877 · Kỳ 3", "title": "Lần duy nhất tự gọi là “Ấn tượng”", "text": "Nhóm chấp nhận cái tên trên catalogue.", "src": [2], "detail": [["Bối cảnh", "Caillebotte, người giàu, mua tranh và gánh tổ chức."], ["Diễn biến", "Cézanne trưng chân dung Victor Chocquet; ông Chocquet có mặt để bênh tranh trước một công chúng cười nhạo."], ["Ý nghĩa", "Kỳ cuối của Cézanne: ông sắp thừa kế từ cha và không chịu nổi phê bình."]], "img": "cezanne-pendu"}, {"when": "1879 · Kỳ 4", "title": "Chữ “Ấn tượng” lại biến mất", "text": "Renoir và Sisley vắng mặt.", "src": [2], "detail": [["Bối cảnh", "Monet chỉ có mặt vì Caillebotte tự đến xưởng ông lấy tranh, cùng với tranh của Monet mà Caillebotte đã mua."], ["Diễn biến", "Jean-Louis Forain, một hoạ sĩ vẽ người, được mời vào. Caillebotte than Degas “không chịu nổi, không thể thương lượng”."], ["Ý nghĩa", "Lõi của nhóm không còn đủ mặt."]], "img": "degas-cafe"}, {"when": "1880 · Kỳ 5", "title": "Raffaëlli và cơn giận của Gauguin", "text": "Monet, Renoir, Sisley đều vắng. Raffaëlli, một hoạ sĩ tự nhiên chủ nghĩa, tham gia.", "src": [2], "detail": [["Bối cảnh", "Monet gửi Salon bức Lavacourt."], ["Diễn biến", "Degas đưa vào những người vẽ giống ông. Gauguin nổi giận."], ["Ý nghĩa", "Ranh giới giữa “Ấn tượng” và “hiện thực” bị xoá ngay trong triển lãm của chính nhóm."]], "img": "raffaelli-absinthe"}, {"when": "1881 · Kỳ 6", "title": "Còn 13 người", "text": "Degas vẫn đó, vẫn với Forain và Raffaëlli.", "src": [2], "detail": [["Bối cảnh", "Gauguin tìm cách loại Raffaëlli."], ["Diễn biến", "Năm sau Gauguin thắng."], ["Ý nghĩa", "Mâu thuẫn giữa “phái phong cảnh” và “phái hình người” lên đỉnh."]], "img": "degas-repasseuses"}, {"when": "1882 · Kỳ 7", "title": "Renoir, Sisley trở lại, Degas rời đi", "text": "Raffaëlli bị gạt, Degas bỏ không tham gia.", "src": [2], "detail": [["Bối cảnh", "Sự đổi chỗ cho thấy cái “nhóm” vận hành như một liên minh tạm thời."], ["Diễn biến", "Monet có mặt lần cuối."], ["Ý nghĩa", "Người giảng: “bạn thấy những bất đồng giữa người này người kia”."]], "img": "renoir-canotiers"}, {"when": "1886 · Kỳ 8", "title": "Seurat và Signac bước vào", "text": "Sau bốn năm gián đoạn. Monet, Renoir, Sisley vắng; Degas trở lại.", "src": [2], "detail": [["Bối cảnh", "Họ bán ngày càng nhiều ngoài vòng triển lãm này."], ["Diễn biến", "Seurat trưng Chủ nhật trên đảo Grande Jatte; Félix Fénéon gọi là “Tân Ấn tượng”."], ["Ý nghĩa", "Hết chuỗi triển lãm Ấn tượng."]], "img": "seurat-jatte"}]}, {"type": "media", "kicker": "Case study · Tập 3, phút 4:37", "title": "Danh sách kỳ đầu, tô màu theo loại hoạ sĩ", "img": "v3-0277", "caption": "Danh sách người triển lãm năm 1874: xanh là hoạ sĩ Ấn tượng, đỏ là hoạ sĩ Salon, đen là hoạ sĩ nghiệp dư hoặc hạng hai · phút 4:37", "text": "Người giảng tô màu để ta “thấy sự pha loãng”: chỉ có vài hoạ sĩ Ấn tượng trong triển lãm này. Bên cạnh Cézanne, Degas, Guillaumin, Monet, Morisot, Pissarro, Renoir, Sisley là các hoạ sĩ Salon như Boudin, Bracquemond, Cals, De Nittis, và hàng loạt tên mà nay không ai nhớ.", "bullets": ["Đếm màu xanh: chưa tới một phần ba danh sách.", "Boudin, người thầy của Monet, có mặt nhưng bị xếp vào hoạ sĩ Salon.", "Pissarro bình đẳng quá, Monet không chính trị: Degas là người có tầm vóc để cầm trịch."], "src": [6]}, {"type": "table", "title": "Bảng tóm tắt tám kỳ", "columns": ["Kỳ", "Năm", "Địa điểm", "Tên trên catalogue", "Vắng hoặc mới"], "widths": [8, 9, 27, 24, 32], "rows": [["1", "1874", "35 bd des Capucines (xưởng cũ của Nadar)", "Hội vô danh của các hoạ sĩ, nhà điêu khắc, thợ khắc…", "Manet không tham gia"], ["2", "1876", "Durand-Ruel, phố Le Peletier", "Không có chữ “Ấn tượng”", "Caillebotte và Degas tổ chức"], ["3", "1877", "Phố Le Peletier", "Triển lãm của các hoạ sĩ Ấn tượng", "Lần cuối của Cézanne"], ["4", "1879", "Đại lộ Opéra", "Không có chữ “Ấn tượng”", "Vắng Renoir, Sisley; Forain vào"], ["5", "1880", "Phố Pyramides", "Một nhóm nghệ sĩ độc lập", "Vắng Monet, Renoir, Sisley; Raffaëlli vào"], ["6", "1881", "Đại lộ Capucines", "Nghệ sĩ độc lập", "Chỉ còn 13 người"], ["7", "1882", "Phố Saint-Honoré", "Nghệ sĩ độc lập", "Renoir, Sisley trở lại; Degas rời đi"], ["8", "1886", "Phố Laffitte", "Không có chữ “Ấn tượng”", "Seurat, Signac vào; vắng Monet, Renoir, Sisley"]], "note": "Tên và địa điểm từ kỳ 4 trở đi do người tổng hợp bổ sung; bài giảng nêu chủ yếu ai có mặt, ai vắng.", "src": [2, 4]}, {"type": "callout", "tone": "warn", "title": "Câu hỏi người giảng đặt ra", "items": ["Các hoạ sĩ hiện thực do Degas mời có phải Ấn tượng vì đã triển lãm ở các kỳ Ấn tượng?", "Manet, Cézanne, Monet, Renoir có không còn là Ấn tượng vì không triển lãm ở đó?", "Nhãn chỉ dùng được nếu “rất mềm dẻo”."], "src": [2]}]}, "name": {"page": "name", "title": "Cái tên “Ấn tượng” ra đời", "group": "Triển lãm", "lead": "Báo lớn im lặng. Mười ngày sau khai mạc, một tờ báo hài đặt cho nhóm cái tên mà họ sẽ mang mãi: “Ấn tượng”, như một lời chế nhạo.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, tập 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 phút)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, tập 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 phút)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, tập 3: “Les huit expositions impressionnistes” (YouTube, 26 phút)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, tập 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 phút)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài bốn bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), tài liệu tham khảo chính mà tập 4 nêu", "date": "2000"}], "blocks": [{"type": "stats", "title": "Báo chí về kỳ đầu (1874)", "items": [{"value": "52", "label": "Bài báo còn lưu giữ được", "src": [2]}, {"value": "10–15", "label": "Chỉ là một mẩu tin ngắn", "src": [2]}, {"value": "20", "label": "Bài thiện cảm", "src": [2]}, {"value": "18", "label": "Bài khen chê lẫn lộn", "src": [2]}, {"value": "5", "label": "Bài ra mặt thù địch, không gây scandal lớn", "src": [2]}, {"value": "10 ngày", "label": "Phải chờ đến lúc Le Charivari và Journal amusant “nổ”", "src": [2]}]}, {"type": "story", "title": "Bài báo của Louis Leroy trên Le Charivari", "items": [{"title": "Ông Vincent đi xem triển lãm", "img": "pissarro-gelee", "caption": "Pissarro, Gelée blanche, 1873", "paras": ["Louis Leroy, một hoạ sĩ phong cảnh cũ từng gửi Salon những năm 1830–1860, bịa ra một ông Vincent, hoạ sĩ phong cảnh, học trò của Bertin, đi xem triển lãm.", "Trước Gelée blanche của Pissarro, ông lau kính mãi vẫn không thấy rõ: đây là luống cày hay sương giá? Trước tranh Berthe Morisot, ông bảo đó là “bốn nét sơn”. Trước một bức khác, ông lại kêu “quá hoàn thiện”."], "src": [2]}, {"title": "Số 98: Impression, soleil levant", "img": "monet-impression", "caption": "Monet, Impression, soleil levant, 1872", "paras": ["Ông tra catalogue: số 98, tên là gì? Ấn tượng, mặt trời mọc. “Ấn tượng, tôi biết ngay mà. Tôi tự nhủ, vì tôi đang bị ấn tượng, hẳn phải có chút ấn tượng trong đó.” Rồi: “Giấy dán tường ở trạng thái phôi thai còn xong hơn bức tranh biển này.”", "Cuối bài, ông Vincent nổi cơn, đỏ như quả cà chua, nhảy một điệu nhảy da đỏ trước tranh. “Và đó là cách người ta sẽ nói về hội hoạ Ấn tượng.”"], "src": [2]}, {"title": "Morisot: “bốn nét sơn”", "img": "morisot-berceau", "caption": "Morisot, Le Berceau, 1872", "paras": ["Berthe Morisot thuộc giới đại tư sản Paris, như Degas và Manet; gia đình các bên qua lại với nhau.", "Nhận định: Le Berceau ngày nay trông mềm và dịu; lời chê “bốn nét” cho thấy chuẩn “hoàn thiện” của Salon khắt khe đến đâu."], "src": [2]}]}, {"type": "media", "kicker": "Kỳ 2, 1876", "title": "Torse, effet de soleil và “xác thịt đang rữa”", "img": "renoir-torse", "caption": "Renoir, Torse, effet de soleil, 1875–1876 · Musée d'Orsay", "text": "Tác phẩm được gọi là “nghiên cứu”, tức chưa hoàn thiện. Albert Wolff trên Le Figaro chê thân thể với những nét tím làm bóng như một thứ xác thịt lôi ra từ nhà xác. Cô gái lại đeo vòng tay và nhẫn: không phải một nữ thần Hy Lạp mà là người của thời đại.", "bullets": ["Nhìn bóng tím trên da: đúng lời Delacroix, bóng là màu bổ sung.", "Nền phong cảnh là những mảng xanh lam và lục không xác định.", "Ở đây đúng là bảng màu, nét cọ mà người ta gán cho Ấn tượng; nhưng vẫn chỉ là một nghiên cứu."], "src": [2]}, {"type": "keypoints", "title": "Ba điểm rút ra", "items": ["Tên nhóm là một lời chế giễu của báo hài, không phải tuyên ngôn. Nhóm chỉ chính thức dùng nó một lần (1877).", "Phản ứng báo chí ban đầu không dữ dội như huyền thoại: phần lớn im lặng hoặc thiện cảm.", "Degas phản đối chữ “Ấn tượng” từ đầu và muốn gọi kỳ đầu là “La Capucine”."], "src": [2, 3]}]}, "technique": {"page": "technique", "title": "Ấn tượng là vẽ nhanh: 8 thủ pháp", "group": "Ngôn ngữ cốt lõi", "lead": "Tập 4 đề nghị một định nghĩa hẹp và dùng được: “ấn tượng” là một bức tranh vẽ nhanh, trong vài buổi, để ghi lại một hình ảnh vừa nhận được, như một người đánh máy vừa nghe vừa gõ.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, tập 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 phút)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, tập 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 phút)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, tập 3: “Les huit expositions impressionnistes” (YouTube, 26 phút)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, tập 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 phút)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài bốn bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), tài liệu tham khảo chính mà tập 4 nêu", "date": "2000"}, {"name": "Art d'Histoire, tập 4, phút 1:05", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&t=65s", "date": ""}], "blocks": [{"type": "principles", "title": "8 thủ pháp của tranh vẽ nhanh", "items": [{"title": "Khổ nhỏ", "rule": "Chừng 40×60 cm hoặc nhỏ hơn.", "why": "Courbet ở Trouville, Monet ở Honfleur: tốn ít sơn, ít thời gian, bán được. Bức 42×59 của Monet, người giảng đoán ngay “vẽ nhanh, bán nhanh”.", "img": "monet-boats"}, {"title": "Lót nền trước, chờ se", "rule": "Lớp xanh cho trời và biển, đợi vài ngày cho dính tay.", "why": "Phân tích phục chế cho thấy Monet vẽ nền xanh, chờ đến khi dính (không cần khô hẳn) rồi mới đặt lớp thứ hai, thứ ba.", "img": "monet-honfleur"}, {"title": "Định vị màu ngay từ đầu", "rule": "Đặt đúng màu đúng chỗ để khỏi phải chờ khô mà chồng lớp.", "why": "Nhờ “localiser” màu, Bazille vẽ chân dung Renoir trong hai buổi, Renoir tự hoạ trong một hai buổi.", "img": "bazille-renoir"}, {"title": "Hai, ba buổi, mỗi buổi 30 phút trở lên", "rule": "Không phải 15 phút như huyền thoại.", "why": "Camille ở bãi Trouville: nền xanh, nền be; buổi hai thêm trắng, lục, xanh ô; buổi ba ba nét cho tấm mạng che mặt.", "img": "monet-trouville"}, {"title": "Đếm được nét", "rule": "Từ 50 đến khoảng 100 nét cọ cho cả bức.", "why": "Ở La Grenouillère, mỗi người tắm của Monet chỉ năm, sáu nét “và đó là vì phải đổi màu giữa chừng”.", "img": "monet-grenouillere"}, {"title": "Bóng là màu bổ sung", "rule": "Bóng tím, bóng lục; giữ đen khi thật cần.", "why": "Bài học của Delacroix. Monet nổi giận khi thấy Salon và cả châu Âu “bắt đầu vẽ tím” theo mốt.", "img": "renoir-torse"}, {"title": "Ướt chồng ướt", "rule": "Đặt lớp mới khi lớp dưới còn ướt.", "why": "Renoir vẽ La Vague (1882) sau khi xem sóng của Courbet; ông ký khi tranh chưa khô, số “88” lún vào sơn. Ông còn cạo sơn bằng cán cọ để lộ toan như giọt nước.", "img": "renoir-wave"}, {"title": "Chưa ký là chưa xong", "rule": "Nghiên cứu không ký, không bán, không triển lãm.", "why": "La Grenouillère của Monet được ký về sau bằng một cây cọ khác hẳn; bản của Renoir và bức trong công viên Saint-Cloud không triển lãm khi ông còn sống.", "img": "renoir-parc"}]}, {"type": "media", "kicker": "Case study · Tập 4, phút 1:05", "title": "La Grenouillère: hai người, hai bàn tay", "img": "v4-0065", "caption": "Trên: Renoir, La Grenouillère, 1869 (bản Winterthur). Dưới: Monet, La Grenouillère, 1869 (bản New York) · phút 1:05", "text": "Hai người đặt giá vẽ cách nhau vài mét; người ta dựng lại được đúng góc vẽ của từng bức. Monet không phân cấp người và cảnh, phải dừng lâu mới biết đâu là người, đâu là nước. Nét của ông chữ nhật, nặng, “chắc chắn về chính mình”. Renoir đứng gần hơn vì ông tìm hình người; nét của ông xoáy, nhẹ cổ tay, nhiều nét hơn, và người vẫn giữ khối.", "bullets": ["Tìm “người thân cây”: một người tắm đứng nghiêng mà lúc đầu người giảng tưởng là thân cây.", "Váy ở bản Renoir có hình dạng; các chuyên gia đùa rằng có thể mang đi tiệm may mũ.", "Renoir còn vẽ cả khói nhà máy phía xa, thứ mà Monet thường tránh."], "src": [6]}, {"type": "table", "title": "Bảng tra: các cấp độ hoàn thiện", "columns": ["Thuật ngữ", "Nghĩa", "Ví dụ trong bài giảng"], "widths": [18, 42, 40], "rows": [["Croquis", "Ký hoạ, vẽ nhanh bằng bút chì hoặc than", "Degas vẽ đi vẽ lại cùng một tư thế"], ["Pochade", "Bản phác màu nhỏ, vẽ nhanh, thường bị coi là “tồi”", "Monet gọi các bức La Grenouillère là “mauvaises pochades”"], ["Étude", "Nghiên cứu: vẽ để học hoặc chuẩn bị, chưa phải tranh", "Torse, effet de soleil của Renoir (kỳ 2, 1876)"], ["Esquisse", "Phác thảo cho một bức sẽ làm", "Cézanne, Une moderne Olympia, ghi “esquisse” ở kỳ 1"], ["Ébauche", "Bản vẽ dở, đã có bố cục, thiếu chi tiết", "Bản 1,30×1,80 m của Le Déjeuner sur l'herbe (Monet)"], ["Tableau fini", "Tranh hoàn thiện, đủ chuẩn gửi Salon và bán", "Femmes au jardin của Monet, chi tiết ren váy rõ từng sợi"]], "src": [3]}, {"type": "story", "title": "Ấn tượng “sinh ra từ một sự cố”", "items": [{"title": "Bức Déjeuner sur l'herbe bị cắt làm ba", "img": "monet-dejeuner", "caption": "Monet, Le Déjeuner sur l'herbe, 1865–1866 (hai mảnh còn lại) · Musée d'Orsay", "paras": ["Monet định vẽ một bức khoảng 4×6 m. Ông gần như xong, nhưng thiếu chi tiết váy và mặt, không kịp gửi Salon, nên gửi một bức khác.", "Ông cuộn bức tranh lại, để làm vật cầm cố cho chủ nhà vì nợ tiền. Sáu, bảy năm sau lấy về, tranh đã mục phần lớn; ông cắt được ba mảnh, nay còn hai. “Hãy tìm trong gara của các bạn,” người giảng đùa, “biết đâu.”"], "src": [3]}, {"title": "Có những bức “ấn tượng” chỉ vì chưa xong", "img": "caillebotte-rain", "caption": "Caillebotte, Phố Paris, ngày mưa, 1877", "paras": ["Nếu dừng ở bản nghiên cứu, ngay cả Caillebotte, người hoàn thiện tranh rất kỹ, cũng sẽ được gọi là Ấn tượng: ta đếm được từng nét bóng đổ. Nhưng bức cuối cùng ông triển lãm thì khác hẳn.", "Người giảng kết luận: có thể thứ hội hoạ Ấn tượng tuyệt vời này “sinh ra từ một sai lầm”, từ việc không thể hoàn thiện một số tranh vì lý do tiền bạc."], "src": [3]}]}, {"type": "dodont", "title": "Ấn tượng thật và ấn tượng bị gán", "doTitle": "Là “ấn tượng” theo nghĩa hẹp", "dontTitle": "Bị gọi là Ấn tượng nhưng không vẽ nhanh", "do": ["Một đến ba buổi, khổ nhỏ, vài chục nét", "Lớp nền khô rồi đặt nét, màu định vị sẵn", "Không ký hoặc ký về sau, gọi là “nghiên cứu”", "Monet thập niên 1870, khoảng một phần tư trong chừng 400 bức"], "dont": ["Le Déjeuner des canotiers: Renoir nghĩ nhiều năm, vẽ sáu tháng", "Le Moulin de la Galette: có phác thảo, có lẽ hoàn thiện trong xưởng", "Le Pont de l'Europe của Caillebotte: phối cảnh dựng kỹ, phác thảo chuẩn bị", "Lavacourt của Monet (Salon 1880): ông gọi là “tranh cho tư sản”"], "src": [3]}, {"type": "callout", "tone": "info", "title": "Hai nghĩa của chữ “impression”", "items": ["Theo từ điển Larousse: ép một vật lên vật khác (in ấn), và cũng là nhận một hình ảnh.", "Theo người giảng, Monet có độ nhạy với ánh sáng mà thần kinh học nay gọi là “tăng cảm” (hyperesthésie): hoàng hôn đổi sau nửa giờ, nên phải học vẽ thật nhanh.", "Lưu ý: đó là cách giải thích của người giảng, không phải chẩn đoán y khoa đã được xác nhận."], "src": [3]}]}, "monet": {"page": "monet", "title": "Monet: người vẽ nhanh thực thụ", "group": "Nghệ sĩ", "lead": "Trong bộ ba Monet, Renoir, Degas, chỉ Monet thực sự vẽ “ấn tượng” một cách có hệ thống, và chủ yếu trong thập niên 1870. Ngay cả ông cũng gửi Salon, hoàn thiện tranh lớn, và bán “tranh cho tư sản”.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, tập 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 phút)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, tập 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 phút)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, tập 3: “Les huit expositions impressionnistes” (YouTube, 26 phút)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, tập 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 phút)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài bốn bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), tài liệu tham khảo chính mà tập 4 nêu", "date": "2000"}], "blocks": [{"type": "timeline", "title": "Monet qua bốn bài giảng", "items": [{"when": "1858", "title": "Người vẽ biếm hoạ ở Le Havre", "text": "Boudin khuyên lên Paris học. Bức chân dung bác sĩ Leclenché (1864) còn thấy nét biếm hoạ: khoảng 50 nét cọ, có thể vẽ một lần, ký ngay bằng màu đỏ cam.", "src": [0, 3]}, {"when": "1864", "title": "Thuyền trên bãi Honfleur", "text": "Khoảng ba buổi: trời và biển xanh trước, rồi hồng và vàng (có lẽ bóp tube và quệt dao), rồi ngọn hải đăng, cuối cùng là người, mỗi chân một nét.", "src": [3], "img": "monet-boats"}, {"when": "1865–1867", "title": "Salon và tranh khổng lồ", "text": "Mũi La Hève vào Salon 1865. Le Déjeuner sur l'herbe định làm 4×6 m. Femmes au jardin bị từ chối năm 1867.", "src": [0, 1, 3], "img": "monet-femmes"}, {"when": "1869", "title": "La Grenouillère", "text": "Ba bức vẽ cạnh Renoir. Monet gọi là “mauvaises pochades”.", "src": [3], "img": "monet-grenouillere"}, {"when": "1870–1871", "title": "Trouville, London, Zaandam", "text": "Cưới Camille năm 1870, trăng mật ở Trouville, Boudin đến thăm. Sang London, rồi Zaandam.", "src": [1, 3], "img": "monet-trouville"}, {"when": "1872–1874", "title": "Impression, soleil levant", "text": "Hai, ba buổi: xanh trước, cam sau, cam và đen có lẽ cùng lúc. Có nhiều phiên bản; không biết chắc bức nào triển lãm 1874, bức nào 1879.", "src": [3], "img": "monet-impression"}, {"when": "1880", "title": "Lavacourt ở Salon", "text": "Loạt tranh Lavacourt thành công ở Salon. Monet đã nội hoá lối vẽ nhanh đến mức tái tạo được trong xưởng, và gọi chúng là “tranh cho tư sản”.", "src": [3], "img": "monet-lavacourt"}]}, {"type": "story", "title": "Monet và tiền", "items": [{"title": "Nghèo, nhưng có hai người giúp việc", "paras": ["Người giảng nhắc một “chi tiết nhỏ”: khi kể về Monet người ta hay nói chuyện túng thiếu, nhưng ông thường sống với hai người giúp việc, kể cả lúc khó khăn. Có thể có lúc ông không có sơn để vẽ xong tranh, “nhưng đó là chuyện khác”.", "Ông viết cho Bazille xin tiền ngay sau khi kể về “giấc mơ một bức lớn” từ các pochade."], "src": [1, 3]}, {"title": "Hai loại tranh, hai mục đích", "img": "monet-femmes", "caption": "Monet, Femmes au jardin (chi tiết ren váy rất hoàn thiện)", "paras": ["Tranh nhỏ vẽ nhanh để bán, vì chúng có lời. Tranh lớn hoàn thiện để vào Salon và “bước vào hàng những người lớn”.", "Femmes au jardin có độ hoàn thiện thật: ren váy rõ đến mức bảo tàng Orsay trưng nó cạnh những chiếc váy thật trong triển lãm “Ấn tượng và thời trang”."], "src": [1]}, {"title": "Nội hoá kỹ thuật", "img": "monet-lavacourt", "caption": "Monet, Hoàng hôn trên sông Seine ở Lavacourt, 1880", "paras": ["Người giảng chỉ một bức có cây cầu song song mặt tranh trong khi góc nhìn là ba phần tư: hoạ sĩ bắt đầu ở một góc và kết thúc ở góc khác. Đó là một bố cục, có lẽ làm trong xưởng, không phải một ấn tượng vẽ trong hai ba ngày.", "Các tranh Lavacourt không vẽ trong xưởng hoàn toàn, nhưng Monet đã “nội hoá” kỹ thuật đến mức tái tạo được nó trong xưởng. Loạt tranh này thành công ở Salon 1880 đến mức xuất hiện ngay trên Gazette des Beaux-Arts.", "Khi thấy cả Salon bắt đầu dùng tím theo mốt, ông nổi giận: với ông, tím chỉ đặt khi ông thấy nó, hoặc khi ông đã nội hoá ấn tượng ấy đủ sâu."], "src": [3]}]}, {"type": "media", "kicker": "Tranh vẽ nhanh, theo định nghĩa của tập 4", "title": "Camille ngồi trên bãi Trouville", "img": "monet-trouville", "caption": "Monet, Camille assise sur la plage à Trouville, 1870–1871", "text": "Một trong những “ấn tượng” của Monet: nền xanh, nền be trước; khi khô thì thêm các tông sáng hơn, trắng và lục, và màu xanh của ô; có lẽ buổi ba mới là ba nét cọ cho tấm mạng. Người xem thật sự có “ấn tượng” rằng bức tranh được vẽ nhanh.", "bullets": ["Đếm nét ở tấm mạng: ba.", "Khoảng 100 nét cho một bức cùng loại, theo các chuyên gia mà người giảng dẫn."], "src": [3]}, {"type": "callout", "tone": "good", "title": "Kết luận của trang", "items": ["Thập niên 1870 là một “cao nguyên” trong phong cách Monet: khoảng 400 bức, 40 bức mỗi năm, và khoảng một phần tư có chất lượng “vẽ nhanh”.", "Ngay cả với Monet, “ấn tượng” là một phần sản xuất, không phải toàn bộ."], "src": [3, 5]}]}, "renoir": {"page": "renoir", "title": "Renoir: hoạ sĩ chân dung giữ khối", "group": "Nghệ sĩ", "lead": "Renoir sống bằng chân dung, thích ánh sáng dịu, luôn giữ khối, và sau 1880 trách chính Ấn tượng đã làm thân thể thành phù du. Những bức “ấn tượng” thật của ông rất hiếm.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, tập 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 phút)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, tập 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 phút)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, tập 3: “Les huit expositions impressionnistes” (YouTube, 26 phút)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, tập 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 phút)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài bốn bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), tài liệu tham khảo chính mà tập 4 nêu", "date": "2000"}], "blocks": [{"type": "principles", "title": "Bốn điều làm nên Renoir", "items": [{"title": "Tiến gần hình người", "rule": "Cùng một cảnh, Renoir đứng gần hơn Monet.", "why": "Ông là hoạ sĩ hình người, nên ở La Grenouillère ông nhích lại để nắm được dáng người.", "img": "renoir-grenouillere"}, {"title": "Nét xoáy, nhẹ cổ tay", "rule": "Nhiều nét nhỏ, cong, đôi khi zigzag.", "why": "Không chữ nhật và nặng như Monet; tán lá được các chuyên gia gọi là “kiểu Watteau”.", "img": "renoir-parc"}, {"title": "Khối luôn còn", "rule": "Mặt, tay, đồ trang sức đều được dựng.", "why": "La Loge: nét nhanh, nhẹ, nhưng mô hình hoá hoàn hảo; ta “gần như đếm được sợi lông mày”.", "img": "renoir-loge"}, {"title": "Ánh sáng dịu", "rule": "Vẽ khi trời xám, cuối ngày, hoặc trong xưởng.", "why": "Ông hay mời người được vẽ đến khi trời xám và cuối ngày. Le Moulin de la Galette cũng dùng thứ ánh sáng lọc qua tán lá ấy.", "img": "renoir-moulin"}]}, {"type": "story", "title": "Ba bức nổi tiếng, ba lần “ấn tượng” vắng mặt", "items": [{"title": "Le Moulin de la Galette (1876)", "img": "renoir-moulin", "caption": "Renoir, Bal du moulin de la Galette, 1876 · Musée d'Orsay", "paras": ["Bạn ông là Georges Rivière kể: “Ngày nào chúng tôi cũng khiêng bức tranh từ phố Cortot ra Moulin, vì nó được vẽ hoàn toàn tại chỗ.” Người giảng: “Ta không nói ai nói dối, nhưng có lẽ ông ấy nhầm.”", "Tranh 1,30×1,75 m, có phác thảo chuẩn bị, hoà sắc xanh “gãy”, tương phản đen trắng hoàn hảo, màu bổ sung lục–cam. Nhiều khả năng bản khiêng ra Moulin là bản phác, còn tranh làm sau nhiều nghiên cứu trong xưởng."], "src": [3]}, {"title": "Le Déjeuner des canotiers (1880–1881)", "img": "renoir-canotiers", "caption": "Renoir, Le Déjeuner des canotiers, 1881 · Phillips Collection", "paras": ["Một trong những bức cuối cùng theo lối này. Renoir nghĩ về nó nhiều năm và vẽ trong sáu tháng; người ta nói ông vẽ ngoài trời cả sáu tháng.", "Người giảng không tìm được phác thảo chuẩn bị nào, nhưng không tin: Paris không nắng sáu tháng liền để người mẫu mặc áo cộc tay. Người giảng đặt nó cạnh La Liseuse của Fragonard để thấy cùng một gương mặt nghiêng (xem trang Đối chiếu)."], "src": [3]}, {"title": "La Vague (1882): “ấn tượng” trọn vẹn", "img": "renoir-wave", "caption": "Renoir, La Vague, 1882", "paras": ["Xem hồi cố Courbet năm 1882, Renoir chạy ra bờ biển Normandie và làm “một ấn tượng thật sự”. Ông làm được, chỉ là có lẽ “đó không phải phong cách của ông”.", "Ở góc phải ông lật cán cọ cạo sơn để lộ toan như giọt nước; những thuyền đen như bóng ma phía xa. Ký khi chưa khô, số 88 lún vào sơn."], "src": [3]}]}, {"type": "media", "kicker": "Ấn tượng hiếm hoi của Renoir", "title": "Trong công viên Saint-Cloud", "img": "renoir-parc", "caption": "Renoir, Dans le parc de Saint-Cloud", "text": "Người ta có thể nói “đây rồi, một ấn tượng của Renoir”. Nhưng không thấy chữ ký; có thể ông không triển lãm, không định bán. Đây là bản phác cho một bức lớn, cùng logic với La Grenouillère. Có cả nét “thư pháp” của Manet: những que đen làm người, mô hình hoá tối thiểu.", "bullets": ["Người giảng chỉ tìm được ba, bốn, năm nghiên cứu phong cảnh có chất “ấn tượng” của Renoir.", "Nếu có “ấn tượng” ở Renoir, có lẽ nằm ở chân dung khổ nhỏ, như bức tự hoạ 39×31 cm."], "src": [3]}, {"type": "callout", "tone": "good", "title": "Kết luận của trang", "items": ["Nếu coi Ấn tượng là một phong cách, ta sẽ phải loại phần lớn tranh của Renoir.", "Renoir nội hoá được nét nhanh (Chez la modiste, có lẽ vẽ trong xưởng và sửa nhiều lần) nhưng tâm thế của ông là dựng hình và cảm giác da thịt, gần Fragonard, Watteau và Rococo."], "src": [2, 3]}]}, "degas": {"page": "degas", "title": "Degas và Caillebotte: hiện thực trong nhóm", "group": "Nghệ sĩ", "lead": "Người tổ chức gần như mọi kỳ triển lãm là một nhà hình hoạ học Ingres, vẽ theo trí nhớ và muốn có cảnh sát canh những người vẽ ngoài trời. Người bảo trợ giàu nhất của nhóm là một nhà hiện thực.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, tập 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 phút)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, tập 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 phút)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, tập 3: “Les huit expositions impressionnistes” (YouTube, 26 phút)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, tập 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 phút)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài bốn bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), tài liệu tham khảo chính mà tập 4 nêu", "date": "2000"}], "blocks": [{"type": "principles", "title": "Bốn dấu hiệu của Degas", "items": [{"title": "Hình hoạ trước màu", "rule": "Vẽ đi vẽ lại một tư thế; sửa cả khi tranh gần xong.", "why": "Ở kỳ đầu, catalogue cho thấy Répétition d'un ballet sur la scène là một bức vẽ: tinh, có kiểm soát, không phải một nét phóng.", "img": "degas-rehearsal"}, {"title": "Monotype và phấn màu", "rule": "In một bản duy nhất từ tấm kính vẽ mực, rồi vẽ đè pastel.", "why": "Femmes à la terrasse d'un café le soir: vết mực in là nền, pastel “cũng là que để vẽ”. Cử chỉ người vẽ vẫn thắng.", "img": "degas-cafe"}, {"title": "Chuyển động", "rule": "Nắm lấy cử chỉ, nét mặt, cử động.", "why": "Những bà thợ là: nét sơn mạnh quanh cánh tay như đi theo cử động. Một tâm thế “động học”, đối nghịch Monet, người yêu ấn tượng màu.", "img": "degas-repasseuses"}, {"title": "Nền nhanh, mặt chuẩn", "rule": "Hậu cảnh là những mảng to, khuôn mặt mô hình hoá hoàn hảo.", "why": "Mary Cassatt ở Louvre: có người nói đây là lúc Degas gần “ấn tượng” nhất, nhưng những bức như thế “phải đi tìm và rất hiếm”.", "img": "degas-louvre"}]}, {"type": "story", "title": "Degas, người tổ chức nằm ngoài phong cách", "items": [{"title": "Một miniature ở triển lãm Ấn tượng", "img": "degas-orchestra", "caption": "Degas, L'Orchestre de l'Opéra, khoảng 1870", "paras": ["Ở kỳ đầu Degas trưng một bức 19×19 cm, khổ lý tưởng để làm một “ấn tượng”. Nhưng ông đặt vào đó mười người, mười hai nếu kể cả bóng phản chiếu: “gần như một món sứ”.", "L'Orchestre de l'Opéra có phần trên “kiểu Ấn tượng”, nhưng các khuôn mặt tiền cảnh hiện thực phi thường: một con mắt nhiếp ảnh “sẽ đến vài năm sau”."], "src": [3]}, {"title": "“Một đội hiến binh” cho người vẽ ngoài trời", "img": "degas-manet", "caption": "Degas, Édouard Manet", "paras": ["Degas nói với Vollard: nếu ông là chính phủ, ông sẽ có một đội hiến binh canh những người vẽ phong cảnh theo tự nhiên. “Tôi không muốn ai chết. Tôi chấp nhận bắn đạn chì nhỏ trước.”", "Với ông, tranh trước hết là trí tưởng tượng; hai, ba “điểm nhấn của tự nhiên” là “một thứ thuốc có ích”. Ông mơ một trường vẽ: tầng trệt có tượng và mẫu, tầng một các hoạ sĩ vẽ theo trí nhớ, học trò giỏi nhất ở tầng ba, theo phương pháp của Lecoq de Boisbaudran."], "src": [3]}, {"title": "Caillebotte: “chỉ Ấn tượng ở cái tên”", "img": "caillebotte-raboteurs", "caption": "Caillebotte, Les Raboteurs de parquet, 1875 · Musée d'Orsay", "paras": ["Một nhà phê bình viết Caillebotte “chỉ là Ấn tượng ở cái tên”. Les Raboteurs de parquet bị Salon từ chối vì cái hiện thực bị cho là “thô tục”: đàn ông lao động. Thân thể như dựng từ tượng Hy Lạp, như cùng một thân người nhìn từ ba góc.", "Le Pont de l'Europe có phối cảnh dựng kỹ, có phác thảo chuẩn bị; chỉ có bóng tím nhắc tới Ấn tượng. Nhờ Caillebotte mua tranh và để lại di tặng, nay mới có bộ sưu tập Ấn tượng ở Orsay."], "src": [2]}]}, {"type": "media", "kicker": "Kỳ 5, 1880", "title": "Raffaëlli: tự nhiên chủ nghĩa trong triển lãm Ấn tượng", "img": "raffaelli-absinthe", "caption": "Raffaëlli, Les Buveurs d'absinthe, 1881", "text": "Người làm Gauguin và Degas đấu nhau. Đây là một bức tự nhiên chủ nghĩa; người giảng nói rõ: nét Ấn tượng, màu Ấn tượng, bạn sẽ không tìm thấy ở đây.", "bullets": ["Bảng màu nâu xám, không có bóng màu bổ sung.", "Đề tài xã hội, gần Zola hơn gần Monet."], "src": [2]}, {"type": "callout", "tone": "warn", "title": "Degas có phải hoạ sĩ Ấn tượng?", "items": ["Người giảng nhắc một triển lãm ở Giverny mang tên “Degas, un peintre impressionniste ?” với một dấu hỏi lớn.", "Câu trả lời của bài giảng: tuỳ định nghĩa. Nếu Ấn tượng là “vẽ nhanh ấn tượng thị giác”, Degas hầu như không; nếu là “những người làm nên các kỳ triển lãm”, Degas là trung tâm."], "src": [3]}]}, "compare": {"page": "compare", "title": "Đối chiếu 9 cặp tranh", "group": "Phân tích tranh", "lead": "Đặt cạnh nhau người đi trước và người đi sau, hoặc hai người cùng thời. Có cặp do chính người giảng ghép, có cặp do người tổng hợp chọn để minh hoạ một lập luận của bài giảng; mỗi ghi chú nói rõ.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, tập 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 phút)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, tập 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 phút)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, tập 3: “Les huit expositions impressionnistes” (YouTube, 26 phút)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, tập 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 phút)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài bốn bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), tài liệu tham khảo chính mà tập 4 nêu", "date": "2000"}], "blocks": [{"type": "callout", "tone": "info", "title": "Cách xem", "items": ["Trái là người đi trước (hoặc người được so sánh), phải là người đi sau.", "Đọc ghi chú dưới mỗi cặp: nó nói cặp ấy do người giảng hay người tổng hợp ghép.", "Bấm vào ảnh để phóng to."]}, {"type": "story", "title": "Tự đối chiếu thế nào", "items": [{"title": "Sáu câu hỏi", "bullets": ["Kích thước: tranh nhỏ có thể vẽ trong vài buổi; tranh trên 1 m thì khó.", "Đếm nét: vài chục hay hàng nghìn?", "Bóng đổ: đen pha vào, hay một màu bổ sung?", "Hình người: có khối, có mặt, hay chỉ vài vệt?", "Có chữ ký không, ký lúc nào, bằng cọ gì?", "Có phác thảo chuẩn bị, đường kẻ ô, hay dấu hiệu bố cục lại?"]}, {"title": "Thang ba mức: chép hình, mượn nguyên tắc, đồng hoá", "paras": ["Chép hình: lấy lại tư thế, đồ vật, bố cục (Renoir với Courbet). Mượn nguyên tắc: lấy cách đặt màu, cách dẫn mắt, cách vẽ nhanh (Monet với Delacroix, Boudin, Jongkind). Đồng hoá: nguyên tắc thành giọng riêng, không còn nhận ra nguồn.", "Người giảng coi mức đầu là thứ yếu: Courbet là tiền đề không phải vì Renoir chép hình của ông, mà vì cách ông triển lãm và bán tranh."], "src": [0]}]}, {"type": "diagram", "title": "1. Nét nhỏ không trộn: từ nhật ký Delacroix đến bờ biển của Monet", "img": "pair-01", "note": "Người giảng cho ta xem biển Dieppe của Delacroix và hỏi: nếu không ghi tên, bao nhiêu người đoán đúng tác giả? Những mảng xanh và be hồng đặt cạnh nhau, đúng điều Delacroix viết: các nét “không trộn vật chất”, chúng tự hoà ở khoảng cách. Monet mười mấy năm sau dùng cùng nguyên tắc: nét đen, nét xanh sáng, nét be dài hơn. Cặp ghép do người tổng hợp chọn: minh hoạ lập luận, không phải bằng chứng hoạ sĩ đã xem đúng bức đó."}, {"type": "diagram", "title": "2. Thân thể Courbet, ánh sáng Renoir", "img": "pair-02", "note": "Renoir lấy bố cục gần đối xứng: một thân khoả thân lớn, một người mặc áo nghiêng đầu. Nhưng thân thể ở Renoir mịn và sáng, trong khi ở Courbet đầy da thịt. Người giảng nói các mượn hình này có thật nhưng “chẳng để làm gì” cho việc hiểu Ấn tượng."}, {"type": "diagram", "title": "3. Một con sóng, hai tốc độ", "img": "pair-03", "note": "Xem hồi cố Courbet năm 1882, Renoir ra biển Normandie vẽ sóng. Courbet đắp dày bằng dao, khối nước nặng. Renoir vẽ ướt chồng ướt, cạo sơn để lộ toan, ký khi chưa khô. Theo lời giảng; bức Courbet cụ thể Renoir xem không xác định được (“Courbet có rất nhiều sóng”), cặp này là minh hoạ."}, {"type": "diagram", "title": "4. Từ toàn cảnh bãi biển đến một người ngồi", "img": "pair-04", "note": "Boudin vẽ cả bãi biển, đám đông khách nghỉ hè, và trên hết là bầu trời. Năm 1870 Monet ở Trouville, Boudin đến thăm. Monet đưa máy quay lại gần: một người, một chiếc ô, vài nét cho tấm mạng. Cặp ghép do người tổng hợp chọn để minh hoạ “ánh sáng học từ Boudin”."}, {"type": "diagram", "title": "5. Pha loãng như màu nước", "img": "pair-05", "note": "Jongkind vẽ với hai, ba tông pha loãng. Năm 1871 ở Hà Lan, quê Jongkind, Monet dùng một lối pha loãng hiếm có ở ông, những nét lớn “đúng các tông của Jongkind”. Người giảng chiếu một bức màu nước của Jongkind; ở đây là một tranh khác của ông, dùng để minh hoạ."}, {"type": "diagram", "title": "6. Con đường đi vào tranh", "img": "pair-06", "note": "Ở Corot, cảnh mở ra cho mắt đi sâu vào không gian. Pissarro giữ con đường dẫn mắt, điểm người nhỏ, nhưng thay lớp sơn mịn bằng “staccato của cọ”. Người giảng nói con đường xuất hiện “gần như hệ thống” ở Pissarro; cặp tranh cụ thể là minh hoạ của người tổng hợp."}, {"type": "diagram", "title": "7. Cùng năm, cùng đề tài, một khoảng cách khổng lồ", "img": "pair-07", "note": "Cả hai: một cô gái trước phong cảnh. Bazille: vỏ thông, lá thông, gương mặt Ý, làng bố cục hoàn hảo, có phác thảo kẻ ô. Monet: thân cây là nét cọ, lá không nhận ra loài, cô gái không có mặt, váy là một nét xanh và một nét trắng. Đây là cặp chính người giảng đặt cạnh nhau."}, {"type": "diagram", "title": "8. Hai giá vẽ cách nhau vài mét", "img": "pair-08", "note": "Monet: nét chữ nhật, nặng, không phân cấp người và cảnh, người tắm năm sáu nét. Renoir: đứng gần hơn, nét xoáy, nhiều nét hơn, váy có hình dạng, có cả khói nhà máy phía xa. Không bức nào được triển lãm như tranh hoàn thiện; Monet gọi chúng là pochade."}, {"type": "diagram", "title": "9. Gương mặt Rococo trong bữa trưa trên sông", "img": "pair-09", "note": "Người giảng đặt La Liseuse cạnh cô gái trong Le Déjeuner des canotiers (có lẽ là Aline, vợ tương lai của Renoir) để thấy cùng một đường nghiêng mặt, cùng thứ da thịt mịn. Renoir nhìn về Fragonard, Watteau, Rococo nhiều hơn là về một lý thuyết thị giác."}, {"type": "table", "title": "Tóm tắt 9 cặp", "columns": ["#", "Người đi trước", "Người đi sau", "Mức", "Ai ghép"], "widths": [5, 30, 33, 14, 18], "rows": [["1", "Delacroix, Biển nhìn từ Dieppe, 1852", "Monet, Bãi biển Honfleur, khoảng 1864–1866", "Mượn nguyên tắc", "Người tổng hợp, minh hoạ"], ["2", "Courbet, Les Baigneuses, 1853", "Renoir, Baigneuse au griffon, 1870", "Chép hình", "Người giảng"], ["3", "Courbet, La Vague, 1869", "Renoir, La Vague, 1882", "Đồng hoá", "Người tổng hợp, minh hoạ"], ["4", "Boudin, Bãi biển Trouville", "Monet, Camille ngồi trên bãi Trouville, 1870–1871", "Mượn nguyên tắc", "Người tổng hợp, minh hoạ"], ["5", "Jongkind, Thuyền ở cảng Honfleur", "Monet, Cối xay gió gần Zaandam, 1871", "Mượn nguyên tắc", "Người tổng hợp, minh hoạ"], ["6", "Corot, Kỷ niệm Mortefontaine, 1864", "Pissarro, Đường Louveciennes, 1872", "Mượn nguyên tắc", "Người tổng hợp, minh hoạ"], ["7", "Bazille, Vue de village, 1868", "Monet, Au bord de l'eau, Bennecourt, 1868", "Đối lập", "Người giảng"], ["8", "Monet, La Grenouillère, 1869", "Renoir, La Grenouillère, 1869", "Đối lập", "Người giảng"], ["9", "Fragonard, La Liseuse, khoảng 1769", "Renoir, Le Déjeuner des canotiers, 1881", "Mượn hình", "Người giảng"]]}]}, "glossary": {"page": "glossary", "title": "Thuật ngữ và nhân vật", "group": "Tra cứu", "lead": "Các thuật ngữ tiếng Pháp và những người được nhắc trong bốn bài giảng.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, tập 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 phút)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, tập 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 phút)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, tập 3: “Les huit expositions impressionnistes” (YouTube, 26 phút)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, t ser la couleur", "Định vị màu: đặt đúng màu đúng chỗ ngay từ đầu để khỏi phải chồng lớp"], ["Hyperesthésie", "Tăng cảm giác; người giảng dùng để giải thích độ nhạy ánh sáng của Monet"]], "src": [0, 1, 2, 3]}, {"type": "table", "title": "Nhân vật", "columns": ["Người", "Vai trò trong câu chuyện"], "widths": [26, 74], "rows": [["Eugène Delacroix (1798–1863)", "Tiền đề về màu: bóng bổ sung, nét nhỏ không trộn"], ["Gustave Courbet (1819–1877)", "Tiền đề về triển lãm độc lập và bán tranh nhỏ"], ["Eugène Boudin (1824–1898)", "Thầy đầu tiên của Monet; bầu trời, “ấn tượng nguyên sơ”"], ["Johan Barthold Jongkind (1819–1891)", "Hoạ sĩ Hà Lan; “giáo dục con mắt” của Monet"], ["Camille Corot (1796–1875)", "Hình mẫu của Pissarro; con đường dẫn vào tranh"], ["Claude Monet (1840–1926)", "Người vẽ “ấn tượng” có hệ thống nhất, thập niên 1870"], ["Pierre-Auguste Renoir (1841–1919)", "Hoạ sĩ chân dung, giữ khối; hiếm khi vẽ “ấn tượng”"], ["Frédéric Bazille (1841–1870)", "Bạn giàu, người mua tranh; vẽ hàn lâm; tử trận 1870"], ["Camille Pissarro (1830–1903)", "Người bình quân; đặt quy chế hội; có học trò"], ["Alfred Sisley (1839–1899)", "Thuộc lõi nhóm; vắng mặt nhiều kỳ"], ["Berthe Morisot (1841–1895)", "Đại tư sản Paris; Le Berceau ở kỳ đầu"], ["Paul Cézanne (1839–1906)", "Kỳ 1 và kỳ 3; rời đi vì không chịu nổi phê bình"], ["Edgar Degas (1834–1917)", "Người tổ chức; nhà hình hoạ; ghét vẽ ngoài trời"], ["Gustave Caillebotte (1848–1894)", "Người bảo trợ, tổ chức; hoạ sĩ hiện thực; di tặng cho Orsay"], ["Édouard Manet (1832–1883)", "Chỉ đường nhưng không dạy; không triển lãm cùng nhóm"], ["Henri Fantin-Latour (1836–1904)", "Hoạ sĩ Salon; vẽ các “chân dung nhóm”"], ["Paul Durand-Ruel (1831–1922)", "Nhà buôn; gặp Monet, Pissarro ở London; mua tranh từ 1872"], ["Louis Leroy (1812–1885)", "Nhà báo Le Charivari; đặt ra chữ “Ấn tượng” để chế giễu"], ["Charles Baudelaire (1821–1867)", "Nhà thơ, phê bình; khen nghiên cứu bầu trời của Boudin (1859)"], ["Jean-François Raffaëlli (1850–1924)", "Hoạ sĩ tự nhiên chủ nghĩa do Degas mời; gây xung đột với Gauguin"], ["Georges Seurat (1859–1891)", "Kỳ 8 (1886); khoa học hoá cái “nét nhỏ”"]], "src": [0, 1, 2, 3]}]}, "sources": {"page": "sources", "title": "Nguồn", "group": "Tra cứu", "lead": "Toàn bộ nguồn, xếp theo từng trang.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, tập 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 phút)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, tập 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 phút)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, tập 3: “Les huit expositions impressionnistes” (YouTube, 26 phút)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, tập 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 phút)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Kiến thức lịch sử nghệ thuật bổ sung ngoài bốn bài giảng, do người tổng hợp biên soạn", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), tài liệu tham khảo chính mà tập 4 nêu", "date": "2000"}], "blocks": [{"type": "allsources", "title": "Nguồn theo trang"}]}}}</script>
<script>
(function(){
'use strict';
const DATA = JSON.parse(document.getElementById('site-data').textContent);
const P = DATA.pages || {}, NAV = DATA.nav || [], IMG = DATA.images || {};
const view = document.getElementById('view');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const arr = a => Array.isArray(a) ? a : (a == null || a === '' ? [] : [a]);
const it = x => (typeof x === 'string' || typeof x === 'number') ? {text: String(x)} : (x && typeof x === 'object' ? x : {});
const pad2 = n => String(n).padStart(2, '0');
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let CUR = null, ONPAGE = false;

// ---------- text helpers
function fmt(s){
  let h = esc(s);
  h = h.replace(/^(Nhận định:|Editor’s note:|Editor's note:)/, '<span class="nd">$1</span>');
  return h.replace(/\(1 nguồn\)/g, '<span class="src1">(1 nguồn)</span>');
}
function sup(page, list){
  const srcs = (page && page.sources) || [];
  const ids = [];
  arr(list).forEach(i => { i = Number(i); if(Number.isInteger(i) && srcs[i] && !ids.includes(i)) ids.push(i); });
  if(!ids.length) return '';
  const one = i => { const s = srcs[i] || {}; const t = esc((s.name||'') + (s.date ? ', ' + s.date : '')); return s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${t}">${i+1}</a>` : `<span class="n" title="${t}">${i+1}</span>`; };
  const rest = ids.slice(3);
  return `<sup class="s">${ids.slice(0,3).map(one).join(' ')}${rest.length ? ` <button type="button" class="more" aria-expanded="false" title="Xem thêm ${rest.length} nguồn">+${rest.length}</button><span class="rest" hidden> ${rest.map(one).join(' ')}</span>` : ''}</sup>`;
}
function line(p, x){ x = it(x); return fmt(x.text) + sup(p, x.src); }
function tags(list){ list = arr(list).filter(Boolean); return list.length ? `<div class="tags">${list.map(g => `<span class="tag">${esc(g)}</span>`).join('')}</div>` : ''; }
function splitLead(s){
  s = String(s || '');
  if(/^(Nhận định:|Editor’s note:|Editor's note:)/.test(s)) return null;
  const re = /[.!?]\s+(?=[\p{Lu}\d"“(])/gu; let m;
  while((m = re.exec(s))){ const cut = m.index + 1; if(cut > 130) break; if(cut >= 25 && s.length - cut >= 20) return [s.slice(0, cut), s.slice(cut).trim()]; }
  return null;
}

// ---------- images
function imgSrc(id){ const m = IMG[id] || {}; return m.url || ('img/' + (m.file || (id + '.jpg'))); }
function frame(id, cap, cls){
  const m = IMG[id]; if(!m) return '';
  const c = cap || m.cap || '';
  return `<button type="button" class="frame ${cls||''}" data-img="${esc(id)}" data-cap="${esc(c)}" aria-label="Phóng to ảnh${c ? ': ' + esc(c) : ''}"><img src="${esc(imgSrc(id))}" alt="${esc(c)}" loading="lazy" decoding="async"${m.url ? ' referrerpolicy="no-referrer" onerror="this.parentNode.hidden=true"' : ''}${m.w && m.h ? ` width="${+m.w}" height="${+m.h}"` : ''}></button>`;
}
function credit(m){ if(!m.credit && !m.page) return ''; return `<span class="cr">Ảnh: ${esc(m.credit||'')}${m.page ? `${m.credit ? ', ' : ''}<a href="${esc(m.page)}" target="_blank" rel="noopener">nguồn</a>` : ''}</span>`; }
function fig(id, cap, fcls, style, figcls){
  const m = IMG[id]; if(!m) return '';
  const c = cap || m.cap || '';
  return `<figure class="fig ${figcls||''}"${style ? ` style="${style}"` : ''}>${frame(id, c, fcls)}<figcaption>${c ? `<span class="cap">${esc(c)}</span> ` : ''}${credit(m)}</figcaption></figure>`;
}
// balanced rows of at most c items; each item gets a span on a 12-column grid
function rowsOf(n, c){ if(n <= 0) return []; const rows = Math.ceil(n / c), base = Math.floor(n / rows), extra = n % rows; return Array.from({length: rows}, (_, i) => base + (i < extra ? 1 : 0)); }
function spanList(n, c){ const out = []; rowsOf(n, c).forEach(k => { for(let i = 0; i < k; i++) out.push(12 / k); }); return out; }
function spanAttr(n, i, cd, ct){ const d = spanList(n, cd), t = spanList(n, ct); return ` style="--sd:${d[i]};--st:${t[i]}"`; }
function qgrid(p, list, metaFn){ list = arr(list); const n = list.length, q = spanList(n, 2); return `<div class="qgrid${n > 1 ? ' two' : ''}">${list.map((x, i) => qcard(p, x, metaFn(it(x)), q[i])).join('')}</div>`; }
function gallery(items, layout){
  items = arr(items).map(x => typeof x === 'string' ? {img: x} : it(x)).filter(x => x.img && IMG[x.img]);
  const n = items.length; if(!n) return '';
  if(n === 1) return `<div class="gal one">${fig(items[0].img, items[0].caption, 'r43')}</div>`;
  const tc = n % 2 === 0 ? 2 : 3;
  if(layout === 'feature' && n >= 3){
    if(n - 3 !== 1){
      const sd = spanList(n - 3, 3), st = spanList(n - 1, tc);
      return `<div class="gal feat">${items.map((x, i) => i === 0
        ? fig(x.img, x.caption, 'r43', '--sd:8;--st:12', 'gbig')
        : fig(x.img, x.caption, 'r43', `--sd:${i < 3 ? 4 : sd[i-3]};--st:${st[i-1]}`)).join('')}</div>`;
    }
    const sd = spanList(n - 1, 3), st = spanList(n - 1, tc);
    return `<div class="gal feat">${items.map((x, i) => i === 0
      ? fig(x.img, x.caption, 'r21', '--sd:12;--st:12')
      : fig(x.img, x.caption, 'r43', `--sd:${sd[i-1]};--st:${st[i-1]}`)).join('')}</div>`;
  }
  const sd = spanList(n, 3), st = spanList(n, tc);
  return `<div class="gal">${items.map((x, i) => fig(x.img, x.caption, 'r43', `--sd:${sd[i]};--st:${st[i]}`)).join('')}</div>`;
}

// ---------- block helpers
function blockTitle(b){ if(!b) return ''; if(b.type === 'store') return b.name || b.title || ''; if(b.type === 'checks') return b.title || b.name || ''; return b.title || ''; }
function H(b, fallback){ const t = b.title || fallback || ''; return (b.kicker ? `<div class="kick">${esc(b.kicker)}</div>` : '') + (t ? `<h2>${fmt(t)}</h2>` : ''); }
function vgid(code){ return 'vg-' + String(code || '').replace(/[^A-Za-z0-9_-]/g, ''); }
function sumList(p, items, auto){
  return `<ol class="sum">${arr(items).map((x, i) => {
    x = it(x); let t = x.title || '', body = x.text || '';
    if(!t && auto){ const sp = splitLead(body); if(sp){ t = sp[0]; body = sp[1]; } }
    const s = sup(p, x.src);
    return `<li><span class="sn">${pad2(i+1)}</span><div class="sb">${t ? `<h3 class="st">${fmt(t)}${body ? '' : s}</h3>` : ''}${body ? `<p>${fmt(body)}${s}</p>` : (t ? '' : s)}</div></li>`;
  }).join('')}</ol>`;
}
function textBits(p, x){
  let h = '';
  if(x.text) h += `<p>${fmt(x.text)}${sup(p, x.src)}</p>`;
  h += arr(x.paras).map(y => `<p>${line(p, y)}</p>`).join('');
  if(arr(x.bullets).length) h += `<ul class="bl">${arr(x.bullets).map(y => `<li>${line(p, y)}</li>`).join('')}</ul>`;
  if(arr(x.facts).length) h += `<dl class="facts">${arr(x.facts).map(f => { f = it(f); return `<div><dt>${esc(f.label)}</dt><dd>${fmt(f.value != null ? f.value : f.text)}${sup(p, f.src)}</dd></div>`; }).join('')}</dl>`;
  if(!x.text && x.src && arr(x.src).length && !h) h += `<p>${sup(p, x.src)}</p>`;
  return h;
}
function qcard(p, x, meta, span){
  x = it(x);
  const orig = x.text || '', vi = x.vi || '';

// ---------- page rendering
function renderNav(active){
  document.getElementById('nav').innerHTML = NAV.map(g => `<div class="navg"><h4>${esc(g.group)}</h4>${arr(g.items).map(i => `<a href="#${esc(i.id)}"${i.id === active ? ' aria-current="page"' : ''}>${esc(i.title)}</a>`).join('')}</div>`).join('');
}
function scrollToTarget(t){
  const el = t && document.getElementById(t);
  if(!el) return false;
  el.scrollIntoView({block: 'start', behavior: REDUCED ? 'auto' : 'smooth'});
  return true;
}
function renderPage(id, target){
  const p = P[id] || P.overview || P[Object.keys(P)[0]];
  if(!p){ view.innerHTML = '<p class="muted">Chưa có nội dung.</p>'; return; }
  id = p.page || id; CUR = id; ONPAGE = true;
  renderNav(id);
  const blocks = arr(p.blocks);
  const titled = [];
  const body = blocks.map((b, i) => {
    const fn = b && R[b.type]; if(!fn) return '';
    let h = ''; try { h = fn(b, p); } catch(err){ return ''; }
    if(!h) return '';
    const t = blockTitle(b);
    if(t) titled.push({i, t});
    const hd = t && b.type !== 'callout';
    return `<section class="block t-${esc(b.type)}${hd ? ' hd' : ''}" id="${esc(id)}-b${i}">${h}</section>`;
  }).join('');
  const toc = titled.length >= 4 ? `<nav class="toc" aria-label="Trên trang này"><div class="toc-h">Trên trang này</div><div class="toc-c">${titled.map(x => `<a class="tchip" href="#${esc(id)}" data-target="${esc(id)}-b${x.i}" title="${esc(x.t)}">${esc(x.t)}</a>`).join('')}</div></nav>` : '';
  const srcs = (arr(p.sources).length && id !== 'sources') ? `<details class="srcs"><summary>Nguồn của trang này (${p.sources.length})</summary><ol class="srcl">${p.sources.map(s => `<li>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>` : esc(s.name)}${s.date ? `, ${esc(s.date)}` : ''}</li>`).join('')}</ol></details>` : '';
  view.innerHTML = `<header class="pg-head">${p.group ? `<div class="eyebrow">${esc(p.group)}</div>` : ''}<h1>${esc(p.title)}</h1>${p.lead ? `<p class="lead">${fmt(p.lead)}</p>` : ''}${toc}</header>${body}${srcs}<div class="foot">Cập nhật ${esc(DATA.built)}. ${esc((DATA.site||{}).foot||'')}</div>`;
  document.getElementById('topTitle').textContent = p.title;
  document.title = p.title + ', ' + ((DATA.site||{}).name || '');
  initAnimFlows(); if(id === 'verify') initVerifyUI();
  if(target){ const el = document.getElementById(target); if(el){ el.scrollIntoView({block: 'start'}); return; } }
  window.scrollTo(0, 0);
}


// ---------- animated flowcharts
let AF_TIMERS = [], AF_OBS = null;
function initAnimFlows(){
  AF_TIMERS.forEach(clearInterval); AF_TIMERS = [];
  if(AF_OBS){ AF_OBS.disconnect(); AF_OBS = null; }
  const boxes = [...view.querySelectorAll('.af[data-af]')];
  if(!boxes.length) return;
  const ctrls = boxes.map(box => {
    const cfg = JSON.parse(box.getAttribute('data-af'));
    const n = cfg.steps.length, svg = box.querySelector('svg'), dots = box.querySelector('.af-dots');
    const playBtn = box.querySelector('.af-play'), cnt = box.querySelector('.af-cnt');
    const lis = [...box.querySelectorAll('.af-steps li')];
    let i = -1, timer = null, userPaused = false;
    function show(k){
      i = k;
      const on = new Set(k >= 0 ? cfg.steps[k] : []);
      box.classList.toggle('dim', k >= 0);
      svg.querySelectorAll('.af-n,.af-e').forEach(g => g.classList.toggle('on', on.has(g.dataset.k)));
      svg.querySelectorAll('.af-e').forEach(g => {
        const p = g.querySelector('path'); const r = g.classList.contains('risk');
        p.setAttribute('marker-end', `url(#${cfg.uid}-a${on.has(g.dataset.k) ? (r ? '-risk' : '-on') : ''})`);
      });
      dots.innerHTML = REDUCED ? '' : [...svg.querySelectorAll('.af-e.on')].map(g => `<circle class="af-dot${g.classList.contains('risk') ? ' risk' : ''}" r="6"><animateMotion dur="1.4s" repeatCount="indefinite" path="${g.dataset.d}"/></circle>`).join('');
      lis.forEach((li, j) => li.classList.toggle('on', j === k));
      cnt.textContent = k >= 0 ? `Bước ${k + 1}/${n}` : `${n} bước`;
    }
    function stop(){ if(timer){ clearInterval(timer); AF_TIMERS = AF_TIMERS.filter(t => t !== timer); timer = null; } playBtn.textContent = 'Phát'; playBtn.setAttribute('aria-pressed', 'false'); }
    function play(){ if(timer) return; if(i < 0 || i >= n - 1) show(0); timer = setInterval(() => { if(i >= n - 1){ show(-1); setTimeout(() => { if(timer) show(0); }, 1400); } else show(i + 1); }, 2600); AF_TIMERS.push(timer); playBtn.textContent = 'Tạm dừng'; playBtn.setAttribute('aria-pressed', 'true'); }
    playBtn.addEventListener('click', () => { if(timer){ stop(); userPaused = true; } else { userPaused = false; play(); } });
    box.querySelector('.af-prev').addEventListener('click', () => { stop(); userPaused = true; show(i <= 0 ? n - 1 : i - 1); });
    box.querySelector('.af-next').addEventListener('click', () => { stop(); userPaused = true; show(i >= n - 1 ? 0 : i + 1); });
    box.querySelectorAll('.af-steps button').forEach(bt => bt.addEventListener('click', () => { stop(); userPaused = true; show(+bt.dataset.i); }));
    return {box, play, stop, get userPaused(){ return userPaused; }};
  });
  if(REDUCED || !('IntersectionObserver' in window)) return;
  AF_OBS = new IntersectionObserver(ents => ents.forEach(en => {
    const c = ctrls.find(x => x.box === en.target); if(!c) return;
    if(en.isIntersecting && !c.userPaused) c.play(); else if(!en.isIntersecting) c.stop();
  }), {threshold: .45});
  ctrls.forEach(c => AF_OBS.observe(c.box));
}
// ---------- search (diacritic-insensitive)
let INDEX = null;
const SKIP = ['src','hsrc','img','imgs','type','tone','url','id','code','side','layout','widths','sentiment','gid','_gid','entrance','file'];
function buildIndex(){
  INDEX = [];
  const push = (pid, bi, text) => { if(text && typeof text === 'string') INDEX.push({pid, bi, text, n: norm(text)}); };
  const walk = (pid, bi, o) => {
    if(typeof o === 'string') return push(pid, bi, o);
    if(Array.isArray(o)) return o.forEach(v => walk(pid, bi, v));
    if(o && typeof o === 'object') for(const k in o){ if(SKIP.includes(k)) continue; walk(pid, bi, o[k]); }
  };
  for(const pid in P){ const p = P[pid]; push(pid, -1, p.title + '. ' + (p.lead || '')); arr(p.blocks).forEach((b, i) => walk(pid, i, b)); }
}
function doSearch(q){
  if(!INDEX) buildIndex();
  const nq = norm(q).trim();
  if(nq.length < 2){ renderPage(CUR || 'overview'); return; }
  ONPAGE = false;
  const terms = nq.split(/\s+/);
  const hits = INDEX.filter(e => terms.every(t => e.n.includes(t))).slice(0, 80);
  const hl = s => { let out = esc(s); terms.forEach(t => { if(!t) return; const ns = norm(s); const i = ns.indexOf(t); if(i >= 0){ const orig = s.substr(i, t.length); out = out.replace(esc(orig), `<mark>${esc(orig)}</mark>`); } }); return out; };
  view.innerHTML = `<div class="eyebrow">Tìm kiếm</div><h1>${hits.length} kết quả</h1><p class="lead">Từ khóa: ${esc(q)}</p><div class="res" style="margin-top:28px">${hits.map(h => `<a href="#${esc(h.pid)}" data-target="${h.bi >= 0 ? esc(h.pid) + '-b' + h.bi : ''}"><div class="pg">${esc(P[h.pid].title)}</div><div>${hl(h.text.length > 260 ? h.text.slice(0, 260) + '...' : h.text)}</div></a>`).join('')}</div>`;
  window.scrollTo(0, 0);
}
let qT = null;
document.getElementById('q').addEventListener('input', e => { clearTimeout(qT); const v = e.target.value; qT = setTimeout(() => doSearch(v), 180); });

// ---------- routing and global clicks
// Internal links are handled in script (not default hash navigation) so they work where a host
// frame swallows hashchange; the hash is still updated for deep links. Same-page targets only scroll.
let pendingTarget = null;
function route(){ const h = decodeURIComponent((location.hash || '').replace('#', '')); renderPage(P[h] ? h : 'overview', pendingTarget); pendingTarget = null; closeMenu(); }
function go(id, target){
  if(!P[id]) id = 'overview';
  if(location.hash.slice(1) !== id){ try { history.pushState(null, '', '#' + id); } catch(err){} }
  renderPage(id, target || null); pendingTarget = null; closeMenu();
}
window.addEventListener('popstate', route);
window.addEventListener('hashchange', () => { if((location.hash || '').replace('#', '') !== CUR) route(); });
document.addEventListener('click', e => {
  const mo = e.target.closest('sup.s .more');
  if(mo){ e.preventDefault(); const r = mo.nextElementSibling; if(r) r.hidden = false; mo.setAttribute('aria-expanded', 'true'); mo.hidden = true; return; }
  const a = e.target.closest('a[href^="#"]');
  if(a && e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey){
    e.preventDefault();
    const id = a.getAttribute('href').slice(1), tg = a.getAttribute('data-target');
    if(ONPAGE && id === CUR && tg && scrollToTarget(tg)){ closeMenu(); return; }
    go(id, tg || null);
    document.getElementById('q').value = '';
    return;
  }

function paintSummary(){
  const vals = Object.values(STATE);

  set('vDone', vals.filter(v => v.status).length); set('vOk', vals.filter(v => v.status === 'ok').length); set('vNo', vals.filter(v => v.status === 'no').length); set('vUn', vals.filter(v => v.status === 'unclear').length);

function initVerifyUI(){ document.querySelectorAll('.vitem').forEach(el => paintItem(el.dataset.id)); if(MODE === 'view') lockVerify(); paintSummary(); }
async function setCheck(id, patch){
  if(MODE === 'view') return;
  const prev = STATE[id];
  const next = Object.assign({status: '', note: ''}, STATE[id] || {}, patch, {updatedAt: new Date().toISOString()});
  STATE[id] = next; paintItem(id); paintSummary();
  if(MODE === 'db' && DB){
    const body = {status: next.status || '', note: next.note || '', updatedAt: next.updatedAt, by: UID || ''};
    const ref = DB.collection('checks').doc(id);
    try { await ref.set(body); }
    catch(err){
      const c = err && err.code;
      if(c === 'invalid_argument'){
        // refused write: this viewer cannot write shared data, so undo and go read-only
        MODE = 'view'; if(prev) STATE[id] = prev; else delete STATE[id];
        paintItem(id); lockVerify(); paintSummary();
      } else if(c === 'unavailable'){
        setTimeout(() => { ref.set(body).catch(() => lsSet()); }, 600 + Math.random() * 900);
      } else { lsSet(); }
    }
  } else { lsSet(); }
}
(async function initStore(){
  try { DB = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch(e){ DB = null; }
  try { const u = window.claude && window.claude.use ? await window.claude.use('user') : null; UID = u ? await u.id() : null; CANWRITE = u && u.can ? await u.can('data.write') : null; } catch(e){ UID = null; }
  if(DB){
    MODE = CANWRITE === false ? 'view' : 'db';
    DB.collection('checks').onSnapshot(snap => {
      snap.docs.forEach(d => { const v = d.data(); if(v) STATE[d.id] = v; });
      if(CUR === 'verify') initVerifyUI();
    }, err => { MODE = 'local'; Object.assign(STATE, lsGet()); if(CUR === 'verify') initVerifyUI(); });
  } else {
    MODE = 'local'; Object.assign(STATE, lsGet());
  }
  if(CUR === 'verify') initVerifyUI();
})();

route();
})();
