p to the Café Guerbois, where he had a table on Friday evenings. Monet recalled those talks as “very fruitful”. These were well-dressed men, far from Courbet's bohemia of the early 1850s.", "Once Manet slapped Duranty over a review; the two rolled up their sleeves, fought and were separated. The exhibitions themselves were decided later, at the Nouvelle-Athènes."], "src": [1]}]}, {"type": "media", "kicker": "Group paintings, not group photos", "title": "Fantin-Latour paints Manet as a master", "img": "fantin-batignolles", "caption": "Fantin-Latour, A Studio at Les Batignolles, 1870", "text": "Stylistically there is nothing “impressionist” here: academic chiaroscuro, even a Greek statue. Fantin-Latour places Manet in the middle like a master, surrounded by Scholderer, Renoir, Astruc, Zola, Maître, Bazille and Monet. A caricature of the time even showed Manet as a god with his flock.", "bullets": ["Manet had no pupils; in 1874 he went to Argenteuil and learned from Monet for a while.", "Renoir stands like an altar boy, as if listening to a lesson.", "Bazille, the tallest, stands on the right."], "src": [1]}, {"type": "callout", "tone": "info", "title": "Conclusion", "items": ["They were “school friends”: they shared moments but not a style, because no one wrote a charter saying what to paint or how.", "The lecturer's comparison: the Salon Cubists and the Futurists of the early 20th century were the real avant-gardes with leaders and a line."], "src": [1]}]}, "bazille": {"page": "bazille", "title": "Bazille: academicism at the heart of Impressionism", "group": "The friends", "lead": "The man who might have led the group painted with preparatory drawings, squared transfers and solid modelling like a Salon painter. Bazille is the strongest evidence that there was no common “Impressionist style”.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, episode 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 min)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, episode 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 min)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, episode 3: “Les huit expositions impressionnistes” (YouTube, 26 min)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, episode 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 min)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Additional art-historical knowledge beyond the four lectures, compiled by the editor", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), the main reference cited in episode 4", "date": "2000"}], "blocks": [{"type": "principles", "title": "Four ways Bazille differs from Monet", "items": [{"title": "Preparatory drawings, squared up", "rule": "Draw the figure on paper first, then transfer it to canvas square by square.", "why": "The Louvre's drawings collection holds studies for Vue de village, with the squaring lines for transfer still visible.", "img": "bazille-village"}, {"title": "Academic nude", "rule": "The body built like a Greek statue.", "why": "Pêcheur à l'épervier was rejected by the Salon, according to the lecturer not for poor drawing but for being “too realistic”; the second figure is posed after the Spinario.", "img": "bazille-pecheur"}, {"title": "Give each object its weight and volume", "rule": "Recognisable tree species, individual faces.", "why": "Bazille wrote that he wanted to “restore to each object its force and volume”: the opposite of the dissolution in Renoir, Morisot and Monet in the early 1870s.", "img": "bazille-reunion"}, {"title": "Figures pasted into the scene", "rule": "Landscape painted outdoors, figures in the studio.", "why": "Scène d'été (Salon 1870): feet that don't sit in the ground, one figure out of scale, the bather's skin out of key with the water.", "img": "bazille-ete"}]}, {"type": "story", "title": "The rich friend, the buyer, the soldier", "items": [{"title": "Monet's patron", "img": "monet-femmes", "caption": "Monet, Femmes au jardin, 1866–1867", "paras": ["Femmes au jardin is about 2.5 m tall. Monet dug a trench in the garden and used pulleys to raise and lower the canvas so he could always paint before the motif without changing viewpoint.", "The painting was rejected by the Salon. Bazille bought it for 2,500 francs at 50 francs a month; according to the lecturer this led to a whole “war of letters” because Monet wanted the money at once."], "src": [1]}, {"title": "Two girls before a landscape, two ways of painting", "img": "bazille-village", "caption": "Bazille, Vue de village, 1868", "paras": ["In Vue de village the girl's features are almost Italian; you can recognise the pine bark and needles, and a perfectly composed village behind.", "The same year, in Monet's On the Bank of the Seine, Bennecourt: tree trunks are brushstrokes, the bark unrecognisable; the girl has no face, her dress is one blue stroke and one white. The lecturer calls it “a colossal gap”."], "src": [1]}, {"title": "Killed in the first battles", "img": "bazille-renoir", "caption": "Bazille, Portrait of Renoir, 1867", "paras": ["In 1870 Bazille was in Montpellier. As the Prussians advanced he volunteered for the Zouaves; the tallest man on a battlefield is easily seen, and he was one of the first to be hit.", "This portrait of Renoir was painted quickly, perhaps in two sessions because the colours were placed from the start. But the lecturer stresses that it is an “informal” work, not representative of Bazille's finished paintings."], "src": [1]}]}, {"type": "media", "kicker": "The closest image to “a group”", "title": "The studio on the rue La Condamine", "img": "bazille-atelier", "caption": "Bazille, Bazille's Studio, 1870 · Musée d'Orsay", "text": "According to the lecturer, this is perhaps the truest image of an “Impressionist group”: the studio Bazille shared with Renoir. Bazille (the tall one, painted in by Manet) stands at the easel; Manet with his blond beard comments on the picture, Monet beside him; the pianist is Edmond Maître; the other two are probably Astruc and Renoir.", "bullets": ["Blue walls: later exhibitions would have lilac walls and coloured frames.", "On the wall: a Renoir and a Bazille that had been refused by the Salon.", "Above the divan: probably a Monet, a reminder that Bazille bought his work."], "src": [1]}, {"type": "callout", "tone": "warn", "title": "Conclusion", "items": ["At the heart of the group in the early 1870s there was a very high degree of realism.", "Plein-air painting existed from the early 19th century and was accelerated by the paint tube (invented by an American in 1841, then produced in France by Lefranc). It was not the group's invention."], "src": [1]}]}, "exhibitions": {"page": "exhibitions", "title": "Eight exhibitions 1874–1886", "group": "Exhibitions", "lead": "If “Impressionists” means those who took part in the eight exhibitions, the definition collapses at once: Manet never showed, Monet and Renoir were often absent, and realists invited by Degas were there.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, episode 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 min)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, episode 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 min)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, episode 3: “Les huit expositions impressionnistes” (YouTube, 26 min)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, episode 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 min)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Additional art-historical knowledge beyond the four lectures, compiled by the editor", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), the main reference cited in episode 4", "date": "2000"}, {"name": "Art d'Histoire, episode 3, 4:37", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&t=277s", "date": ""}], "blocks": [{"type": "timeline", "title": "Show by show", "items": [{"when": "1874 · 1st", "title": "The Société anonyme, 35 boulevard des Capucines", "text": "About 30 artists and 250 works, in Nadar's former studio.", "src": [2], "detail": [["Context", "A “société anonyme” with statutes copied from a Pontoise bakers' association, Pissarro's idea, a Proudhonian egalitarian."], ["What happened", "First floor, north-facing, superb light; pictures hung in two rows rather than floor to ceiling as at the Salon."], ["Significance", "A practical, economic association with no ideology. No word “Impressionist” in the catalogue yet."]], "img": "nadar-capucines"}, {"when": "1876 · 2nd", "title": "Durand-Ruel's gallery, rue Le Peletier", "text": "Fewer exhibitors, but still many minor names.", "src": [2], "detail": [["Context", "Two years after the first show, the dealer lent the space."], ["What happened", "Degas and Caillebotte organised it. Albert Wolff in Le Figaro attacked Renoir's Torso."], ["Significance", "The more Degas organised, the more he “pulled the tablecloth his way”: inviting figure painters."]], "img": "renoir-torse"}, {"when": "1877 · 3rd", "title": "The only time they called themselves “Impressionists”", "text": "The group accepted the name on the catalogue.", "src": [2], "detail": [["Context", "Caillebotte, the wealthy one, bought pictures and shouldered the organisation."], ["What happened", "Cézanne showed his portrait of Victor Chocquet; Chocquet himself was there defending the pictures before a jeering public."], ["Significance", "Cézanne's last: he was about to inherit from his father and could not bear the criticism."]], "img": "cezanne-pendu"}, {"when": "1879 · 4th", "title": "The word “Impressionist” disappears again", "text": "Renoir and Sisley were absent.", "src": [2], "detail": [["Context", "Monet was there only because Caillebotte went to his studio to fetch pictures, along with Monets that Caillebotte had bought."], ["What happened", "Jean-Louis Forain, a figure painter, was invited. Caillebotte complained Degas was “unbearable and intractable”."], ["Significance", "The group's core was no longer complete."]], "img": "degas-cafe"}, {"when": "1880 · 5th", "title": "Raffaëlli and Gauguin's anger", "text": "Monet, Renoir and Sisley all absent. Raffaëlli, a naturalist painter, took part.", "src": [2], "detail": [["Context", "Monet sent the Salon a Lavacourt picture."], ["What happened", "Degas brought in painters who worked like him. Gauguin was furious."], ["Significance", "The line between “Impressionist” and “realist” was erased within the group's own exhibition."]], "img": "raffaelli-absinthe"}, {"when": "1881 · 6th", "title": "Down to 13", "text": "Degas still there, still with Forain and Raffaëlli.", "src": [2], "detail": [["Context", "Gauguin tried to get Raffaëlli excluded."], ["What happened", "The following year Gauguin won."], ["Significance", "The rift between the “landscape camp” and the “figure camp” peaked."]], "img": "degas-repasseuses"}, {"when": "1882 · 7th", "title": "Renoir and Sisley return, Degas leaves", "text": "Raffaëlli was pushed out and Degas refused to take part.", "src": [2], "detail": [["Context", "The reshuffle shows the “group” worked as a temporary alliance."], ["What happened", "Monet's last appearance."], ["Significance", "The lecturer: “you can see the disagreements between them”."]], "img": "renoir-canotiers"}, {"when": "1886 · 8th", "title": "Seurat and Signac arrive", "text": "After a four-year gap. Monet, Renoir and Sisley absent; Degas back.", "src": [2], "detail": [["Context", "They were selling more and more outside this circuit."], ["What happened", "Seurat showed A Sunday on La Grande Jatte; Félix Fénéon called it “Neo-Impressionism”."], ["Significance", "The end of the Impressionist exhibitions."]], "img": "seurat-jatte"}]}, {"type": "media", "kicker": "Case study · Episode 3, 4:37", "title": "The first show's list, colour-coded by type of painter", "img": "v3-0277", "caption": "List of exhibitors in 1874: green for Impressionists, red for Salon painters, black for amateurs or minor painters · 4:37", "text": "The lecturer colour-codes the list so we “see the dilution”: only a few Impressionists in this show. Beside Cézanne, Degas, Guillaumin, Monet, Morisot, Pissarro, Renoir and Sisley are Salon painters such as Boudin, Bracquemond, Cals and De Nittis, and a host of names no one remembers.", "bullets": ["Count the green: less than a third of the list.", "Boudin, Monet's teacher, is there but classed as a Salon painter.", "Pissarro too egalitarian, Monet not political: Degas had the stature to take charge."], "src": [6]}, {"type": "table", "title": "The eight shows at a glance", "columns": ["Show", "Year", "Venue", "Name on the catalogue", "Absent or new"], "widths": [8, 9, 27, 24, 32], "rows": [["1", "1874", "35 bd des Capucines (Nadar's former studio)", "Société anonyme of painters, sculptors, engravers…", "Manet did not take part"], ["2", "1876", "Durand-Ruel, rue Le Peletier", "No word “Impressionist”", "Organised by Caillebotte and Degas"], ["3", "1877", "Rue Le Peletier", "Exhibition of the Impressionists", "Cézanne's last"], ["4", "1879", "Avenue de l'Opéra", "No word “Impressionist”", "Renoir, Sisley absent; Forain joins"], ["5", "1880", "Rue des Pyramides", "A group of independent artists", "Monet, Renoir, Sisley absent; Raffaëlli joins"], ["6", "1881", "Boulevard des Capucines", "Independent artists", "Down to 13 exhibitors"], ["7", "1882", "Rue Saint-Honoré", "Independent artists", "Renoir, Sisley return; Degas leaves"], ["8", "1886", "Rue Laffitte", "No word “Impressionist”", "Seurat, Signac join; Monet, Renoir, Sisley absent"]], "note": "Names and venues from the 4th show onwards were added by the editor; the lectures mainly state who was present or absent.", "src": [2, 4]}, {"type": "callout", "tone": "warn", "title": "Questions the lecturer raises", "items": ["Were the realists invited by Degas Impressionists because they showed at the Impressionist exhibitions?", "Did Manet, Cézanne, Monet and Renoir stop being Impressionists by not exhibiting there?", "The label only works if it is “very flexible”."], "src": [2]}]}, "name": {"page": "name", "title": "How the name “Impressionism” was born", "group": "Exhibitions", "lead": "The major papers stayed silent. Ten days after the opening, a humorous paper gave the group the name they would carry forever: “Impressionists”, as a jibe.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, episode 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 min)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, episode 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 min)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, episode 3: “Les huit expositions impressionnistes” (YouTube, 26 min)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, episode 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 min)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Additional art-historical knowledge beyond the four lectures, compiled by the editor", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), the main reference cited in episode 4", "date": "2000"}], "blocks": [{"type": "stats", "title": "Press coverage of the first show (1874)", "items": [{"value": "52", "label": "Surviving articles", "src": [2]}, {"value": "10–15", "label": "Just a short notice", "src": [2]}, {"value": "20", "label": "Favourable", "src": [2]}, {"value": "18", "label": "Mixed", "src": [2]}, {"value": "5", "label": "Openly hostile, without causing a major scandal", "src": [2]}, {"value": "10 days", "label": "The wait until Le Charivari and Journal amusant “exploded”", "src": [2]}]}, {"type": "story", "title": "Louis Leroy's article in Le Charivari", "items": [{"title": "Monsieur Vincent visits the exhibition", "img": "pissarro-gelee", "caption": "Pissarro, Hoarfrost, 1873", "paras": ["Louis Leroy, a former landscape painter who had shown at the Salon in the 1830s–1860s, invented a Monsieur Vincent, a landscape painter and pupil of Bertin, visiting the show.", "Before Pissarro's Hoarfrost he keeps wiping his glasses and still cannot see: furrows or frost? Before a Berthe Morisot he calls it “four strokes of paint”. Before another picture he cries “far too finished”."], "src": [2]}, {"title": "No. 98: Impression, soleil levant", "img": "monet-impression", "caption": "Monet, Impression, soleil levant, 1872", "paras": ["He checks the catalogue: number 98, what is it called? Impression, Sunrise. “Impression, I was sure of it. I was just telling myself that, since I was impressed, there had to be some impression in it.” Then: “Wallpaper in its embryonic state is more finished than this seascape.”", "By the end Monsieur Vincent has a fit, red as a tomato, and does a war dance in front of the pictures. “And that is how people would talk about Impressionist painting.”"], "src": [2]}, {"title": "Morisot: “four strokes of paint”", "img": "morisot-berceau", "caption": "Morisot, The Cradle, 1872", "paras": ["Berthe Morisot belonged to the Parisian haute bourgeoisie, like Degas and Manet; their families knew each other.", "Editor's note: The Cradle looks soft and gentle today; the “four strokes” jibe shows how strict the Salon's standard of “finish” was."], "src": [2]}]}, {"type": "media", "kicker": "2nd show, 1876", "title": "Torse, effet de soleil and “decomposing flesh”", "img": "renoir-torse", "caption": "Renoir, Torso, Effect of Sunlight, 1875–1876 · Musée d'Orsay", "text": "The work was called a “study”, i.e. unfinished. Albert Wolff in Le Figaro mocked the body with its violet shadows as flesh fetched from the morgue. The girl wears a bracelet and ring: not a Greek nymph but a woman of her time.", "bullets": ["Look at the violet shadows on the skin: just as Delacroix said, shadows are complementary colours.", "The landscape background is made of indeterminate blue and green patches.", "Here are indeed the palette and brushwork attributed to Impressionism; yet it is still only a study."], "src": [2]}, {"type": "keypoints", "title": "Three takeaways", "items": ["The group's name was a joke from a humorous paper, not a manifesto. The group only officially used it once (1877).", "The initial press response was not as violent as the myth: mostly silence or sympathy.", "Degas objected to the word “Impressionist” from the outset and wanted to call the first show “La Capucine”."], "src": [2, 3]}]}, "technique": {"page": "technique", "title": "Impression means painting quickly: 8 techniques", "group": "Core language", "lead": "Episode 4 proposes a narrow, usable definition: an “impression” is a picture painted quickly, in a few sessions, to record an image just received, like a typist typing while listening.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, episode 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 min)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, episode 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 min)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, episode 3: “Les huit expositions impressionnistes” (YouTube, 26 min)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, episode 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 min)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Additional art-historical knowledge beyond the four lectures, compiled by the editor", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), the main reference cited in episode 4", "date": "2000"}, {"name": "Art d'Histoire, episode 4, 1:05", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&t=65s", "date": ""}], "blocks": [{"type": "principles", "title": "8 techniques of the quickly painted picture", "items": [{"title": "Small format", "rule": "About 40×60 cm or smaller.", "why": "Courbet at Trouville, Monet at Honfleur: little paint, little time, saleable. Seeing a 42×59 Monet, the lecturer immediately guesses “painted fast, sold fast”.", "img": "monet-boats"}, {"title": "Lay a ground first, let it set", "rule": "A blue layer for sky and sea, left a few days until tacky.", "why": "Conservation analysis shows Monet painted the blue ground and waited until it was tacky (not fully dry) before adding a second and third layer.", "img": "monet-honfleur"}, {"title": "Place colours right from the start", "rule": "Put the right colour in the right place so you don't have to wait for layers to dry.", "why": "By “localising” colour, Bazille painted his portrait of Renoir in two sessions, and Renoir his self-portrait in one or two.", "img": "bazille-renoir"}, {"title": "Two or three sessions of 30 minutes or more", "rule": "Not the 15 minutes of legend.", "why": "Camille on the beach at Trouville: blue ground, beige ground; second session adds white, green and the blue of the parasol; third session, three strokes for the veil.", "img": "monet-trouville"}, {"title": "Countable strokes", "rule": "From 50 to about 100 brushstrokes for the whole picture.", "why": "At La Grenouillère, each of Monet's bathers takes only five or six strokes, “and that's only because he had to change colour halfway”.", "img": "monet-grenouillere"}, {"title": "Shadows in complementary colours", "rule": "Violet and green shadows; keep black when truly needed.", "why": "Delacroix's lesson. Monet was furious when he saw the Salon and the whole of Europe “start painting in violet” as a fashion.", "img": "renoir-torse"}, {"title": "Wet on wet", "rule": "Lay a new layer while the one beneath is still wet.", "why": "Renoir painted The Wave (1882) after seeing Courbet's waves; he signed before it was dry and the “88” sank into the paint. He also scraped paint with the brush handle to expose canvas like droplets.", "img": "renoir-wave"}, {"title": "Unsigned means unfinished", "rule": "Studies were not signed, sold or exhibited.", "why": "Monet's La Grenouillère was signed later with a quite different brush; Renoir's version and his Saint-Cloud park picture were not exhibited in his lifetime.", "img": "renoir-parc"}]}, {"type": "media", "kicker": "Case study · Episode 4, 1:05", "title": "La Grenouillère: two painters, two hands", "img": "v4-0065", "caption": "Top: Renoir, La Grenouillère, 1869 (Winterthur version). Bottom: Monet, La Grenouillère, 1869 (New York version) · 1:05", "text": "The two set up easels a few metres apart; the exact angle of each picture has been reconstructed. Monet makes no hierarchy between figures and landscape: you must look a long time to tell people from water. His strokes are rectangular, heavy, “sure of themselves”. Renoir stands closer because he is after the figure; his strokes swirl with a light wrist, there are more of them, and the people keep their volume.", "bullets": ["Find the “tree-trunk man”: a bather in profile the lecturer first took for a tree trunk.", "The dresses in Renoir's version have shape; specialists joke you could take one to a milliner.", "Renoir even paints the factory smoke in the distance, something Monet usually avoided."], "src": [6]}, {"type": "table", "title": "Lookup: degrees of finish", "columns": ["Term", "Meaning", "Example in the lectures"], "widths": [18, 42, 40], "rows": [["Croquis", "A quick sketch in pencil or charcoal", "Degas drawing the same pose over and over"], ["Pochade", "A small, quickly painted colour sketch, often deemed “bad”", "Monet called his Grenouillère pictures “mauvaises pochades”"], ["Étude", "A study: painted to learn or prepare, not yet a picture", "Renoir's Torse, effet de soleil (2nd show, 1876)"], ["Esquisse", "A preliminary sketch for a work to come", "Cézanne's Une moderne Olympia, labelled “esquisse” at the 1st show"], ["Ébauche", "A lay-in with composition but lacking detail", "The 1.30×1.80 m version of Monet's Le Déjeuner sur l'herbe"], ["Tableau fini", "A finished painting, up to Salon standard and saleable", "Monet's Femmes au jardin, the lace on the dresses rendered thread by thread"]], "src": [3]}, {"type": "story", "title": "Impressionism “born of an accident”", "items": [{"title": "The Déjeuner sur l'herbe cut into three", "img": "monet-dejeuner", "caption": "Monet, Le Déjeuner sur l'herbe, 1865–1866 (two surviving fragments) · Musée d'Orsay", "paras": ["Monet planned a picture about 4×6 m. He nearly finished it, but the dresses and faces lacked detail, it was not ready for the Salon, and he sent another work instead.", "He rolled it up and left it with his landlord as security for a debt. When he retrieved it six or seven years later it had largely rotted; he cut out three pieces, of which two survive. “Look in your garages,” the lecturer jokes, “you never know.”"], "src": [3]}, {"title": "Some pictures are “impressions” only because they are unfinished", "img": "caillebotte-rain", "caption": "Caillebotte, Paris Street; Rainy Day, 1877", "paras": ["Stop at the study, and even Caillebotte, who finished his pictures meticulously, would be called an Impressionist: you can count each stroke of shadow. But the final picture he exhibited is something else entirely.", "The lecturer concludes: perhaps this wonderful Impressionist painting was “born of a mistake”, from being unable to finish certain pictures for lack of money."], "src": [3]}]}, {"type": "dodont", "title": "True impressions and attributed ones", "doTitle": "An “impression” in the narrow sense", "dontTitle": "Called Impressionist but not painted quickly", "do": ["One to three sessions, small format, a few dozen strokes", "Dry ground, then strokes, colours placed in advance", "Unsigned or signed later, called a “study”", "Monet in the 1870s: about a quarter of some 400 pictures"], "dont": ["Le Déjeuner des canotiers: Renoir thought about it for years and painted it over six months", "Le Moulin de la Galette: preparatory sketches, probably finished in the studio", "Caillebotte's Le Pont de l'Europe: carefully built perspective, preparatory drawings", "Monet's Lavacourt (Salon 1880): he called it “a picture for the bourgeois”"], "src": [3]}, {"type": "callout", "tone": "info", "title": "Two meanings of the word “impression”", "items": ["According to the Larousse dictionary: pressing one object onto another (printing), and also receiving an image.", "According to the lecturer, Monet had a sensitivity to light that neurology now calls “hyperaesthesia”: a sunset changes within half an hour, so he had to learn to paint very fast.", "Note: this is the lecturer's interpretation, not a confirmed medical diagnosis."], "src": [3]}]}, "monet": {"page": "monet", "title": "Monet: the true fast painter", "group": "Artists", "lead": "Of the trio Monet, Renoir and Degas, only Monet painted “impressions” systematically, mainly in the 1870s. Even he submitted to the Salon, finished large pictures, and sold “pictures for the bourgeois”.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, episode 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 min)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, episode 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 min)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, episode 3: “Les huit expositions impressionnistes” (YouTube, 26 min)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, episode 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 min)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Additional art-historical knowledge beyond the four lectures, compiled by the editor", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), the main reference cited in episode 4", "date": "2000"}], "blocks": [{"type": "timeline", "title": "Monet across the four lectures", "items": [{"when": "1858", "title": "The caricaturist from Le Havre", "text": "Boudin urged him to study in Paris. His portrait of Dr Leclenché (1864) still shows the caricaturist's line: about 50 strokes, possibly done in one go, signed at once in a strong orange-red.", "src": [0, 3]}, {"when": "1864", "title": "Boats on the beach at Honfleur", "text": "About three sessions: blue sky and sea first, then pinks and yellows (perhaps squeezed from the tube and spread with a knife), then the lighthouse, finally the figures, one stroke per leg.", "src": [3], "img": "monet-boats"}, {"when": "1865–1867", "title": "The Salon and giant canvases", "text": "La Pointe de la Hève at the Salon of 1865. Le Déjeuner sur l'herbe planned at 4×6 m. Femmes au jardin rejected in 1867.", "src": [0, 1, 3], "img": "monet-femmes"}, {"when": "1869", "title": "La Grenouillère", "text": "Three pictures painted beside Renoir. Monet called them “mauvaises pochades”.", "src": [3], "img": "monet-grenouillere"}, {"when": "1870–1871", "title": "Trouville, London, Zaandam", "text": "Married Camille in 1870, honeymoon at Trouville, where Boudin visited. On to London, then Zaandam.", "src": [1, 3], "img": "monet-trouville"}, {"when": "1872–1874", "title": "Impression, soleil levant", "text": "Two or three sessions: blue first, orange after, orange and black perhaps together. There are several versions; it is not certain which was shown in 1874 and which in 1879.", "src": [3], "img": "monet-impression"}, {"when": "1880", "title": "Lavacourt at the Salon", "text": "The Lavacourt series succeeded at the Salon. Monet had internalised quick painting so well he could reproduce it in the studio, and he called them “pictures for the bourgeois”.", "src": [3], "img": "monet-lavacourt"}]}, {"type": "story", "title": "Monet and money", "items": [{"title": "Poor, but with two servants", "paras": ["The lecturer notes a “small detail”: Monet is often described as penniless, yet he usually lived with two servants, even in hard times. There may have been moments when he lacked paint to finish a picture, “but that's another matter”.", "He wrote to Bazille asking for money right after describing his “dream of a large picture” made from the pochades."], "src": [1, 3]}, {"title": "Two kinds of picture, two purposes", "img": "monet-femmes", "caption": "Monet, Femmes au jardin (the lace of the dresses highly finished)", "paras": ["Small quick pictures to sell, because they were profitable. Large finished pictures for the Salon, to “join the big league”.", "Femmes au jardin is genuinely finished: the lace is so precise that the Musée d'Orsay showed it beside real dresses in the exhibition “Impressionism and Fashion”."], "src": [1]}, {"title": "Internalising the technique", "img": "monet-lavacourt", "caption": "Monet, Sunset on the Seine at Lavacourt, 1880", "paras": ["The lecturer points to a picture where a bridge runs parallel to the picture plane while the viewpoint is three-quarters: the painter began from one angle and finished from another. It is a composition, probably worked up in the studio, not an impression painted in two or three days.", "The Lavacourt pictures were not painted entirely in the studio, but Monet had “internalised” his technique enough to recreate it there. The series did so well at the Salon of 1880 that it appeared straight away in the Gazette des Beaux-Arts.", "When he saw the whole Salon taking up violet as a fashion he was furious: for him, violet went down only when he saw it, or when he had internalised that impression deeply enough."], "src": [3]}]}, {"type": "media", "kicker": "A quick painting by episode 4's definition", "title": "Camille seated on the beach at Trouville", "img": "monet-trouville", "caption": "Monet, Camille Seated on the Beach at Trouville, 1870–1871", "text": "One of Monet's “impressions”: blue and beige grounds first; once dry, lighter tones, whites and greens, and the blue of the parasol; perhaps only in a third session the three strokes for the veil. The viewer really has the “impression” that it was painted quickly.", "bullets": ["Count the strokes in the veil: three.", "About 100 strokes for a picture of this kind, according to the specialists the lecturer cites."], "src": [3]}, {"type": "callout", "tone": "good", "title": "Conclusion", "items": ["The 1870s are a “plateau” in Monet's style: about 400 pictures, 40 a year, and roughly a quarter with the quality of “quick painting”.", "Even for Monet, the “impression” was part of his output, not all of it."], "src": [3, 5]}]}, "renoir": {"page": "renoir", "title": "Renoir: the portraitist who kept volume", "group": "Artists", "lead": "Renoir lived from portraits, loved soft light, always kept volume, and after 1880 blamed Impressionism itself for making the body ephemeral. His true “impressions” are very rare.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, episode 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 min)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, episode 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 min)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, episode 3: “Les huit expositions impressionnistes” (YouTube, 26 min)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, episode 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 min)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Additional art-historical knowledge beyond the four lectures, compiled by the editor", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), the main reference cited in episode 4", "date": "2000"}], "blocks": [{"type": "principles", "title": "Four things that make Renoir", "items": [{"title": "Close in on the figure", "rule": "In the same scene, Renoir stands closer than Monet.", "why": "He was a figure painter, so at La Grenouillère he edged closer to capture the people.", "img": "renoir-grenouillere"}, {"title": "Swirling strokes, light wrist", "rule": "Many small curved strokes, sometimes zigzag.", "why": "Not rectangular and heavy like Monet's; specialists call the foliage “Watteau-like”.", "img": "renoir-parc"}, {"title": "Volume always remains", "rule": "Faces, hands and jewellery are all modelled.", "why": "La Loge: quick, light strokes but perfect modelling; you can “almost count the eyebrow hairs”.", "img": "renoir-loge"}, {"title": "Soft light", "rule": "Paint when the sky is grey, late in the day, or in the studio.", "why": "He liked sitters to come when the weather was grey and late in the day. Le Moulin de la Galette uses the same light filtered through foliage.", "img": "renoir-moulin"}]}, {"type": "story", "title": "Three famous pictures, three absent “impressions”", "items": [{"title": "Le Moulin de la Galette (1876)", "img": "renoir-moulin", "caption": "Renoir, Bal du moulin de la Galette, 1876 · Musée d'Orsay", "paras": ["His friend Georges Rivière wrote: “Every day we carried the canvas from the rue Cortot to the Moulin, for the picture was painted entirely on the spot.” The lecturer: “We won't say anyone is lying, but perhaps he is mistaken.”", "At 1.30×1.75 m, with preparatory sketches, harmonies of “broken” blues, perfect black-and-white contrasts, complementary green and orange. Most likely the version carried to the Moulin was the sketch, and the painting was made after many studio studies."], "src": [3]}, {"title": "Le Déjeuner des canotiers (1880–1881)", "img": "renoir-canotiers", "caption": "Renoir, Luncheon of the Boating Party, 1881 · Phillips Collection", "paras": ["One of the last pictures in this manner. Renoir thought about it for years and painted it over six months; it is said he painted outdoors for all six months.", "The lecturer found no preparatory drawings, but does not believe it: Paris does not stay sunny for six months straight with models in short sleeves. The lecturer sets it beside Fragonard's The Reader to show the same profile (see the Comparisons page)."], "src": [3]}, {"title": "The Wave (1882): a full “impression”", "img": "renoir-wave", "caption": "Renoir, The Wave, 1882", "paras": ["After seeing the Courbet retrospective in 1882, Renoir rushed to the Normandy coast and made “a real impression”. He was perfectly capable of it; it simply may “not have been his style”.", "In the right corner he turned the brush around and scraped paint to bare the canvas like droplets; dark boats like ghosts in the distance. Signed while wet, the 88 sank into the paint."], "src": [3]}]}, {"type": "media", "kicker": "A rare Renoir impression", "title": "In the Park at Saint-Cloud", "img": "renoir-parc", "caption": "Renoir, In the Park at Saint-Cloud", "text": "One could say “there it is, a Renoir impression”. But there is no visible signature; perhaps he never exhibited or meant to sell it. It is a sketch for a larger picture, the same logic as La Grenouillère. It even has Manet's “calligraphy”: black sticks for figures, minimal modelling.", "bullets": ["The lecturer found only three, four or five landscape studies by Renoir with the quality of an “impression”.", "If there are “impressions” in Renoir, they are probably in small portraits, like the 39×31 cm self-portrait."], "src": [3]}, {"type": "callout", "tone": "good", "title": "Conclusion", "items": ["If Impressionism is a style, we would have to exclude most of Renoir's paintings.", "Renoir internalised the quick stroke (At the Milliner's, probably painted in the studio and reworked several times), but his instinct was for form and the feel of flesh, close to Fragonard, Watteau and the Rococo."], "src": [2, 3]}]}, "degas": {"page": "degas", "title": "Degas and Caillebotte: realism within the group", "group": "Artists", "lead": "The organiser of almost every exhibition was a draughtsman trained on Ingres, who worked from memory and wanted gendarmes to watch outdoor painters. The group's richest patron was a realist.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, episode 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 min)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, episode 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 min)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, episode 3: “Les huit expositions impressionnistes” (YouTube, 26 min)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, episode 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 min)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Additional art-historical knowledge beyond the four lectures, compiled by the editor", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), the main reference cited in episode 4", "date": "2000"}], "blocks": [{"type": "principles", "title": "Four signs of Degas", "items": [{"title": "Drawing before colour", "rule": "Draw the same pose again and again; keep correcting even when nearly finished.", "why": "At the first show, the catalogue shows that Ballet Rehearsal on Stage was a drawing: fine, controlled, not a quick dash.", "img": "degas-rehearsal"}, {"title": "Monotype and pastel", "rule": "Print a single impression from an inked glass plate, then work over it in pastel.", "why": "Women on a Café Terrace, Evening: the printed ink is the base, and pastel is “also a stick for drawing”. The draughtsman's gesture still wins.", "img": "degas-cafe"}, {"title": "Movement", "rule": "Capture gesture, expression, motion.", "why": "The laundresses: vigorous strokes around the arms as if following the movement. A “kinetic” sensibility, the opposite of Monet, who loved the impression of colour.", "img": "degas-repasseuses"}, {"title": "Quick background, exact face", "rule": "Broad patches behind, perfectly modelled faces.", "why": "Mary Cassatt at the Louvre: some say this is where Degas came closest to an “impression”, but such pictures “have to be hunted down and are rare”.", "img": "degas-louvre"}]}, {"type": "story", "title": "Degas, an organiser outside the style", "items": [{"title": "A miniature at an Impressionist show", "img": "degas-orchestra", "caption": "Degas, The Orchestra at the Opera, around 1870", "paras": ["At the first show Degas exhibited a 19×19 cm picture, an ideal size for an “impression”. But he put ten figures in it, twelve counting reflections: “almost a piece of porcelain”.", "The Orchestra at the Opera has an “Impressionist” top section, but the faces in the foreground are extraordinarily realistic: a photographer's eye “that would arrive a few years later”."], "src": [3]}, {"title": "“A squad of gendarmes” for outdoor painters", "img": "degas-manet", "caption": "Degas, Édouard Manet", "paras": ["Degas told Vollard that if he were the government, he would have a squad of gendarmes keeping watch on people painting landscapes from nature. “I don't want anyone dead. I'd settle for a little birdshot to begin with.”", "For him, painting was first of all imagination; two or three “accents of nature” were “a useful medicine”. He dreamed of a school with statues and models on the ground floor, painters working from memory on the first floor, and the best pupils on the third, after the method of Lecoq de Boisbaudran."], "src": [3]}, {"title": "Caillebotte: “Impressionist in name only”", "img": "caillebotte-raboteurs", "caption": "Caillebotte, The Floor Scrapers, 1875 · Musée d'Orsay", "paras": ["A critic wrote that Caillebotte was “Impressionist in name only”. The Floor Scrapers was refused by the Salon for a realism deemed “vulgar”: men at work. The bodies seem modelled on Greek sculpture, like one body seen from three angles.", "Le Pont de l'Europe has carefully built perspective and preparatory drawings; only the violet shadows recall Impressionism. Thanks to Caillebotte's purchases and bequest, the Musée d'Orsay has its Impressionist collection today."], "src": [2]}]}, {"type": "media", "kicker": "5th show, 1880", "title": "Raffaëlli: naturalism in an Impressionist exhibition", "img": "raffaelli-absinthe", "caption": "Raffaëlli, The Absinthe Drinkers, 1881", "text": "The man who set Gauguin against Degas. This is a naturalist picture; the lecturer is clear: Impressionist brushwork, Impressionist colour, you will not find them here.", "bullets": ["A brown-grey palette, no complementary shadows.", "A social subject, closer to Zola than to Monet."], "src": [2]}, {"type": "callout", "tone": "warn", "title": "Was Degas an Impressionist?", "items": ["The lecturer mentions an exhibition at Giverny titled “Degas, un peintre impressionniste ?” with a big question mark.", "The lecture's answer: it depends on the definition. If Impressionism means “quickly painting visual impressions”, Degas hardly qualifies; if it means “the people who made the exhibitions”, Degas is at the centre."], "src": [3]}]}, "compare": {"page": "compare", "title": "9 paired comparisons", "group": "Painting analysis", "lead": "Forerunner beside follower, or two contemporaries side by side. Some pairs were set up by the lecturer, others chosen by the editor to illustrate an argument from the lectures; each note says which.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, episode 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 min)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, episode 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 min)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, episode 3: “Les huit expositions impressionnistes” (YouTube, 26 min)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, episode 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 min)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Additional art-historical knowledge beyond the four lectures, compiled by the editor", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), the main reference cited in episode 4", "date": "2000"}], "blocks": [{"type": "callout", "tone": "info", "title": "How to look", "items": ["Left is the forerunner (or the point of comparison), right the follower.", "Read the note under each pair: it says whether the lecturer or the editor made the pairing.", "Click an image to enlarge."]}, {"type": "story", "title": "How to compare for yourself", "items": [{"title": "Six questions", "bullets": ["Size: a small picture can be painted in a few sessions; one over 1 m is hard.", "Count the strokes: a few dozen or thousands?", "Shadows: black mixed in, or a complementary colour?", "Figures: modelled with faces, or just a few marks?", "Is it signed, when, and with what brush?", "Are there preparatory drawings, squaring lines, or signs of recomposition?"]}, {"title": "A three-step scale: copying, borrowing principles, assimilation", "paras": ["Copying: reusing poses, objects, composition (Renoir with Courbet). Borrowing principles: taking a way of placing colour, leading the eye, painting fast (Monet with Delacroix, Boudin, Jongkind). Assimilation: the principle becomes one's own voice, the source no longer recognisable.", "The lecturer treats the first level as secondary: Courbet was a forerunner not because Renoir copied his figures, but because of how he exhibited and sold."], "src": [0]}]}, {"type": "diagram", "title": "1. Small unblended strokes: from Delacroix's journal to Monet's shore", "img": "pair-01", "note": "The lecturer shows Delacroix's Dieppe seascape and asks: without the label, how many would guess the painter? Patches of blue and pinkish beige set side by side, exactly as Delacroix wrote: strokes “not materially blended”, merging at a distance. A dozen or so years later Monet used the same principle: black strokes, bright blue strokes, longer beige ones. Pairing chosen by the editor: it illustrates the argument and is not proof that the painter saw that exact picture."}, {"type": "diagram", "title": "2. Courbet's body, Renoir's light", "img": "pair-02", "note": "Renoir takes a near-symmetrical composition: a large nude, a clothed woman tilting her head. But Renoir's body is smooth and luminous where Courbet's is fleshy. The lecturer says these borrowings are real but “of no use at all” for understanding Impressionism."}, {"type": "diagram", "title": "3. One wave, two speeds", "img": "pair-03", "note": "After the 1882 Courbet retrospective, Renoir went to the Normandy coast to paint waves. Courbet builds thick paint with a knife, a heavy mass of water. Renoir paints wet on wet, scrapes to bare the canvas, signs while wet. Per the lecture; which Courbet Renoir saw cannot be identified (“Courbet painted a great many waves”), so this pair is illustrative."}, {"type": "diagram", "title": "4. From the whole beach to one seated figure", "img": "pair-04", "note": "Boudin paints the whole beach, the crowd of holidaymakers, and above all the sky. In 1870 Monet was at Trouville and Boudin visited. Monet brings the camera close: one figure, one parasol, a few strokes for the veil. Pairing chosen by the editor to illustrate “light learned from Boudin”."}, {"type": "diagram", "title": "5. Thinned like watercolour", "img": "pair-05", "note": "Jongkind painted with two or three thinned tones. In 1871 in Holland, Jongkind's homeland, Monet used a thinned manner rare for him, broad strokes “in exactly Jongkind's tones”. The lecturer showed a Jongkind watercolour; here another of his works is used as an illustration."}, {"type": "diagram", "title": "6. The road into the picture", "img": "pair-06", "note": "In Corot, the scene opens for the eye to travel into depth. Pissarro keeps the road that leads the eye and the small figures, but replaces smooth paint with the brush's “staccato”. The lecturer says the road appears “almost systematically” in Pissarro; this specific pair is the editor's illustration."}, {"type": "diagram", "title": "7. Same year, same subject, a colossal gap", "img": "pair-07", "note": "Both: a girl before a landscape. Bazille: pine bark and needles, an Italian face, a perfectly composed village, squared preparatory drawing. Monet: trunks are brushstrokes, leaves unidentifiable, a faceless girl, a dress of one blue stroke and one white. This is the pair the lecturer sets side by side."}, {"type": "diagram", "title": "8. Two easels a few metres apart", "img": "pair-08", "note": "Monet: rectangular, heavy strokes, no hierarchy between figures and setting, bathers in five or six strokes. Renoir: closer in, swirling strokes, more of them, dresses with shape, even factory smoke in the distance. Neither was exhibited as a finished picture; Monet called them pochades."}, {"type": "diagram", "title": "9. A Rococo face at a riverside lunch", "img": "pair-09", "note": "The lecturer sets The Reader beside the young woman in Luncheon of the Boating Party (probably Aline, Renoir's future wife) to show the same profile, the same smooth flesh. Renoir looked to Fragonard, Watteau and the Rococo more than to any optical theory."}, {"type": "table", "title": "The 9 pairs at a glance", "columns": ["#", "Forerunner", "Follower", "Level", "Paired by"], "widths": [5, 30, 33, 14, 18], "rows": [["1", "Delacroix, The Sea at Dieppe, 1852", "Monet, The Beach at Honfleur, around 1864–1866", "Borrowed principle", "Editor, illustrative"], ["2", "Courbet, Les Baigneuses, 1853", "Renoir, Baigneuse au griffon, 1870", "Copied figures", "Lecturer"], ["3", "Courbet, The Wave, 1869", "Renoir, The Wave, 1882", "Assimilation", "Editor, illustrative"], ["4", "Boudin, The Beach at Trouville", "Monet, Camille Seated on the Beach at Trouville, 1870–1871", "Borrowed principle", "Editor, illustrative"], ["5", "Jongkind, Boats in the Harbour at Honfleur", "Monet, Windmills near Zaandam, 1871", "Borrowed principle", "Editor, illustrative"], ["6", "Corot, Souvenir of Mortefontaine, 1864", "Pissarro, The Road to Louveciennes, 1872", "Borrowed principle", "Editor, illustrative"], ["7", "Bazille, Vue de village, 1868", "Monet, On the Bank of the Seine, Bennecourt, 1868", "Contrast", "Lecturer"], ["8", "Monet, La Grenouillère, 1869", "Renoir, La Grenouillère, 1869", "Contrast", "Lecturer"], ["9", "Fragonard, The Reader, around 1769", "Renoir, Luncheon of the Boating Party, 1881", "Borrowed figure", "Lecturer"]]}]}, "glossary": {"page": "glossary", "title": "Terms and people", "group": "Reference", "lead": "French terms and the people mentioned in the four lectures.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, episode 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 min)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, episode 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 min)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, episode 3: “Les huit expositions impressionnistes” (YouTube, 26 min)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, episode 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 min)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Additional art-historical knowledge beyond the four lectures, compiled by the editor", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), the main reference cited in episode 4", "date": "2000"}], "blocks": [{"type": "table", "title": "Term", "columns": ["Term", "Meaning"], "widths": [26, 74], "rows": [["Salon", "The official annual (or biennial) exhibition in Paris, with a jury; the main route to recognition and sales"], ["Salon des Refusés", "Exhibition of works rejected by the Salon (1863); in 1867 the young group demanded another and were refused"], ["Société anonyme", "“Anonymous society”: the group's legal form in 1874, with statutes modelled on a Pontoise bakers' association"], ["Plein air (plénérisme)", "Painting outdoors before the motif; practised from the early 19th century, accelerated by the paint tube (1841)"], ["Pochade", "A small, quickly painted colour sketch; Monet called his Grenouillère pictures “mauvaises pochades”"], ["Étude", "A study, not yet a finished picture"], ["Esquisse / ébauche", "Preliminary sketch / unfinished lay-in for a picture to come"], ["Tableau fini", "A finished picture, up to Salon standard"], ["Couleur complémentaire", "Complementary colour; shadows painted in the opposite hue (violet for yellow, green for red)"], ["Mélange rétinien", "Retinal mixing: two adjacent dots of colour merge at a distance, brighter than mixing on the palette; made rigorous by Seurat's dotting"], ["Divisionnisme / Néo-impressionnisme", "The scientific colour division of Seurat and Signac; Fénéon called it “Neo-Impressionism” (1886)"], ["Empâtement", "Thick impasto, often applied with a knife (Courbet)"], ["Wet on wet", "Laying a new layer before the one beneath has dried (Renoir, The Wave)"], ["Monotype", "A single print pulled from an inked glass or metal plate; Degas worked over it in pastel"], ["Localiser la couleur", "Placing colour: putting the right colour in the right place from the start to avoid layering"], ["Hyperesthésie", "Heightened sensitivity; used by the lecturer to explain Monet's sensitivity to light"]], "src": [0, 1, 2, 3]}, {"type": "table", "title": "People", "columns": ["Person", "Role in the story"], "widths": [26, 74], "rows": [["Eugène Delacroix (1798–1863)", "Forerunner in colour: complementary shadows, small unblended strokes"], ["Gustave Courbet (1819–1877)", "Forerunner in independent exhibiting and selling small pictures"], ["Eugène Boudin (1824–1898)", "Monet's first teacher; the sky, the “primitive impression”"], ["Johan Barthold Jongkind (1819–1891)", "Dutch painter; “educated the eye” of Monet"], ["Camille Corot (1796–1875)", "Pissarro's model; the road into the picture"], ["Claude Monet (1840–1926)", "The most systematic painter of “impressions”, in the 1870s"], ["Pierre-Auguste Renoir (1841–1919)", "Portraitist who kept volume; rarely painted “impressions”"], ["Frédéric Bazille (1841–1870)", "Wealthy friend and buyer; painted academically; killed in 1870"], ["Camille Pissarro (1830–1903)", "The egalitarian; drafted the society's statutes; had pupils"], ["Alfred Sisley (1839–1899)", "Part of the core; absent from many shows"], ["Berthe Morisot (1841–1895)", "Parisian haute bourgeoisie; The Cradle at the first show"], ["Paul Cézanne (1839–1906)", "1st and 3rd shows; left because he could not bear criticism"], ["Edgar Degas (1834–1917)", "Organiser; draughtsman; hated painting outdoors"], ["Gustave Caillebotte (1848–1894)", "Patron and organiser; realist painter; bequest to the Musée d'Orsay"], ["Édouard Manet (1832–1883)", "Showed the way but did not teach; never exhibited with the group"], ["Henri Fantin-Latour (1836–1904)", "Salon painter; painted the “group portraits”"], ["Paul Durand-Ruel (1831–1922)", "Dealer; met Monet and Pissarro in London; buying from 1872"], ["Louis Leroy (1812–1885)", "Journalist at Le Charivari; coined “Impressionist” as a jibe"], ["Charles Baudelaire (1821–1867)", "Poet and critic; praised Boudin's sky studies (1859)"], ["Jean-François Raffaëlli (1850–1924)", "Naturalist painter invited by Degas; clashed with Gauguin"], ["Georges Seurat (1859–1891)", "8th show (1886); made a science of the “small stroke”"]], "src": [0, 1, 2, 3]}]}, "sources": {"page": "sources", "title": "Sources", "group": "Reference", "lead": "All sources, grouped by page.", "sources": [{"name": "Art d'Histoire, La Saga des Impressionnistes, episode 1: “Quatre précurseurs de l'impressionnisme : Delacroix, Courbet, Boudin et Jongkind” (YouTube, 25 min)", "url": "https://www.youtube.com/watch?v=5GEqgDN0LeU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn", "date": ""}, {"name": "Art d'Histoire, episode 2: “Les jeunes impressionnistes : amitiés et singularités, Monet, Renoir, Bazille” (YouTube, 23 min)", "url": "https://www.youtube.com/watch?v=7D5mQlr_puU&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=2", "date": ""}, {"name": "Art d'Histoire, episode 3: “Les huit expositions impressionnistes” (YouTube, 26 min)", "url": "https://www.youtube.com/watch?v=9gpoH8gurGA&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=3", "date": ""}, {"name": "Art d'Histoire, episode 4: “Le style impressionniste chez Monet, Renoir et Degas” (YouTube, 29 min)", "url": "https://www.youtube.com/watch?v=mDf3M4dwqY0&list=PLI9v7o9esYUjVmJ_83DCKTGXqLv3DjqEn&index=4", "date": ""}, {"name": "Additional art-historical knowledge beyond the four lectures, compiled by the editor", "date": ""}, {"name": "Richard R. Brettell, Impression: Painting Quickly in France, 1860–1890 (Yale University Press, 2000), the main reference cited in episode 4", "date": "2000"}], "blocks": [{"type": "allsources", "title": "Sources by page"}]}}}</script>
<script>
(function(){
'use strict';
const DATA = JSON.parse(document.getElementById('site-data').textContent);
const P = DATA.pages || {}, NAV = DATA.nav || [], IMG = DATA.images || {};
const view = document.getElementById('view');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const arr = a => Array.isArray(a) ? a : (a == null || a === '' ? [] : [a]);
const it = x => (typeof x === 'string' || typeof x === 'number') ? {text: String(x)} : (x && typeof x === 'object' ? x : {});
const pad2 = n => String(n).padStart(2, '0');
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let CUR = null, ONPAGE = false;

// ---------- text helpers
function fmt(s){
  let h = esc(s);
  h = h.replace(/^(Nhận định:|Editor’s note:|Editor's note:)/, '<span class="nd">$1</span>');
  return h.replace(/\(1 source\)/g, '<span class="src1">(1 source)</span>');
}
function sup(page, list){
  const srcs = (page && page.sources) || [];
  const ids = [];
  arr(list).forEach(i => { i = Number(i); if(Number.isInteger(i) && srcs[i] && !ids.includes(i)) ids.push(i); });
  if(!ids.length) return '';
  const one = i => { const s = srcs[i] || {}; const t = esc((s.name||'') + (s.date ? ', ' + s.date : '')); return s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${t}">${i+1}</a>` : `<span class="n" title="${t}">${i+1}</span>`; };
  const rest = ids.slice(3);
  return `<sup class="s">${ids.slice(0,3).map(one).join(' ')}${rest.length ? ` <button type="button" class="more" aria-expanded="false" title="Show more ${rest.length} sources">+${rest.length}</button><span class="rest" hidden> ${rest.map(one).join(' ')}</span>` : ''}</sup>`;
}
function line(p, x){ x = it(x); return fmt(x.text) + sup(p, x.src); }
function tags(list){ list = arr(list).filter(Boolean); return list.length ? `<div class="tags">${list.map(g => `<span class="tag">${esc(g)}</span>`).join('')}</div>` : ''; }
function splitLead(s){
  s = String(s || '');
  if(/^(Nhận định:|Editor’s note:|Editor's note:)/.test(s)) return null;
  const re = /[.!?]\s+(?=[\p{Lu}\d"“(])/gu; let m;
  while((m = re.exec(s))){ const cut = m.index + 1; if(cut > 130) break; if(cut >= 25 && s.length - cut >= 20) return [s.slice(0, cut), s.slice(cut).trim()]; }
  return null;
}

// ---------- images
function imgSrc(id){ const m = IMG[id] || {}; return m.url || ('img/' + (m.file || (id + '.jpg'))); }
function frame(id, cap, cls){
  const m = IMG[id]; if(!m) return '';
  const c = cap || m.cap || '';
  return `<button type="button" class="frame ${cls||''}" data-img="${esc(id)}" data-cap="${esc(c)}" aria-label="Enlarge image${c ? ': ' + esc(c) : ''}"><img src="${esc(imgSrc(id))}" alt="${esc(c)}" loading="lazy" decoding="async"${m.url ? ' referrerpolicy="no-referrer" onerror="this.parentNode.hidden=true"' : ''}${m.w && m.h ? ` width="${+m.w}" height="${+m.h}"` : ''}></button>`;
}
function credit(m){ if(!m.credit && !m.page) return ''; return `<span class="cr">Image: ${esc(m.credit||'')}${m.page ? `${m.credit ? ', ' : ''}<a href="${esc(m.page)}" target="_blank" rel="noopener">sources</a>` : ''}</span>`; }
function fig(id, cap, fcls, style, figcls){
  const m = IMG[id]; if(!m) return '';
  const c = cap || m.cap || '';
  return `<figure class="fig ${figcls||''}"${style ? ` style="${style}"` : ''}>${frame(id, c, fcls)}<figcaption>${c ? `<span class="cap">${esc(c)}</span> ` : ''}${credit(m)}</figcaption></figure>`;
}
// balanced rows of at most c items; each item gets a span on a 12-column grid
function rowsOf(n, c){ if(n <= 0) return []; const rows = Math.ceil(n / c), base = Math.floor(n / rows), extra = n % rows; return Array.from({length: rows}, (_, i) => base + (i < extra ? 1 : 0)); }
function spanList(n, c){ const out = []; rowsOf(n, c).forEach(k => { for(let i = 0; i < k; i++) out.push(12 / k); }); return out; }
function spanAttr(n, i, cd, ct){ const d = spanList(n, cd), t = spanList(n, ct); return ` style="--sd:${d[i]};--st:${t[i]}"`; }
function qgrid(p, list, metaFn){ list = arr(list); const n = list.length, q = spanList(n, 2); return `<div class="qgrid${n > 1 ? ' two' : ''}">${list.map((x, i) => qcard(p, x, metaFn(it(x)), q[i])).join('')}</div>`; }
function gallery(items, layout){
  items = arr(items).map(x => typeof x === 'string' ? {img: x} : it(x)).filter(x => x.img && IMG[x.img]);
  const n = items.length; if(!n) return '';
  if(n === 1) return `<div class="gal one">${fig(items[0].img, items[0].caption, 'r43')}</div>`;
  const tc = n % 2 === 0 ? 2 : 3;
  if(layout === 'feature' && n >= 3){
    if(n - 3 !== 1){
      const sd = spanList(n - 3, 3), st = spanList(n - 1, tc);
      return `<div class="gal feat">${items.map((x, i) => i === 0
        ? fig(x.img, x.caption, 'r43', '--sd:8;--st:12', 'gbig')
        : fig(x.img, x.caption, 'r43', `--sd:${i < 3 ? 4 : sd[i-3]};--st:${st[i-1]}`)).join('')}</div>`;
    }
    const sd = spanList(n - 1, 3), st = spanList(n - 1, tc);
    return `<div class="gal feat">${items.map((x, i) => i === 0
      ? fig(x.img, x.caption, 'r21', '--sd:12;--st:12')
      : fig(x.img, x.caption, 'r43', `--sd:${sd[i-1]};--st:${st[i-1]}`)).join('')}</div>`;
  }
  const sd = spanList(n, 3), st = spanList(n, tc);
  return `<div class="gal">${items.map((x, i) => fig(x.img, x.caption, 'r43', `--sd:${sd[i]};--st:${st[i]}`)).join('')}</div>`;
}

// ---------- block helpers
function blockTitle(b){ if(!b) return ''; if(b.type === 'store') return b.name || b.title || ''; if(b.type === 'checks') return b.title || b.name || ''; return b.title || ''; }
function H(b, fallback){ const t = b.title || fallback || ''; return (b.kicker ? `<div class="kick">${esc(b.kicker)}</div>` : '') + (t ? `<h2>${fmt(t)}</h2>` : ''); }
function vgid(code){ return 'vg-' + String(code || '').replace(/[^A-Za-z0-9_-]/g, ''); }
function sumList(p, items, auto){
  return `<ol class="sum">${arr(items).map((x, i) => {
    x = it(x); let t = x.title || '', body = x.text || '';
    if(!t && auto){ const sp = splitLead(body); if(sp){ t = sp[0]; body = sp[1]; } }
    const s = sup(p, x.src);
    return `<li><span class="sn">${pad2(i+1)}</span><div class="sb">${t ? `<h3 class="st">${fmt(t)}${body ? '' : s}</h3>` : ''}${body ? `<p>${fmt(body)}${s}</p>` : (t ? '' : s)}</div></li>`;
  }).join('')}</ol>`;
}
function textBits(p, x){
  let h = '';
  if(x.text) h += `<p>${fmt(x.text)}${sup(p, x.src)}</p>`;
  h += arr(x.paras).map(y => `<p>${line(p, y)}</p>`).join('');
  if(arr(x.bullets).length) h += `<ul class="bl">${arr(x.bullets).map(y => `<li>${line(p, y)}</li>`).join('')}</ul>`;
  if(arr(x.facts).length) h += `<dl class="facts">${arr(x.facts).map(f => { f = it(f); return `<div><dt>${esc(f.label)}</dt><dd>${fmt(f.value != null ? f.value : f.text)}${sup(p, f.src)}</dd></div>`; }).join('')}</dl>`;
  if(!x.text && x.src && arr(x.src).length && !h) h += `<p>${sup(p, x.src)}</p>`;
  return h;
}
function qcard(p, x, meta, span){
  x = it(x);
  const orig = x.text || '', vi = x.vi || '';
  const two = vi && orig && vi !== orig;
  const sent = x.sentiment ? `<span class="sent ${esc(x.sentiment)}">${({positive:'Khen', negative:'Criticism', mixed:'Mixed'})[x.sentiment] || 'Opinion'}</span>` : '';
  return `<figure class="q"${span ? ` style="--sq:${span}"` : ''}><blockquote><p class="qp">${fmt(two ? vi : (vi || orig))}</p>${two ? `<p class="qo">${esc(orig)}</p>` : ''}</blockquote><figcaption class="qby">${sent}${esc(meta.filter(Boolean).join(', '))}${sup(p, x.src)}</figcaption></figure>`;
}
const ARROW_H = `<svg class="ah-h" viewBox="0 0 44 14" aria-hidden="true"><path class="fw-a" d="M3,7 L33,7"/><path class="fw-ah" d="M32,1.5 L42,7 L32,12.5 z"/></svg>`;
const ARROW_V = `<svg class="ah-v" width="14" height="30" viewBox="0 0 14 30" aria-hidden="true"><path class="fw-a" d="M7,2 L7,20"/><path class="fw-ah" d="M1.5,19 L7,29 L12.5,19 z"/></svg>`;

const R = {
 summary(b, p){ return H(b) + sumList(p, b.items, false); },
 keypoints(b, p){ return H(b) + sumList(p, b.items, true); },
 text(b, p){ return H(b) + `<div class="prose">${arr(b.paras).map(x => `<p>${line(p, x)}</p>`).join('')}</div>`; },
 media(b, p){
   const im = b.img && IMG[b.img] ? fig(b.img, b.caption, 'r43') : '';
   const tx = textBits(p, b);
   return H(b) + (im ? `<div class="media${b.side === 'right' ? ' imgr' : ''}">${im}<div class="mtx">${tx}</div></div>` : `<div class="mtx">${tx}</div>`);
 },
 story(b, p){
   return H(b) + `<div class="story">${arr(b.items).map((x, i) => {
     x = it(x);
     const im = x.img && IMG[x.img] ? fig(x.img, x.caption, 'r43') : '';

     return im ? `<article class="media${i % 2 ? ' imgr' : ''}">${im}<div class="mtx">${tx}</div></article>` : `<article><div class="mtx">${tx}</div></article>`;
   }).join('')}</div>`;
 },
 timeline(b, p){
   return H(b) + `<ol class="tl">${arr(b.items).map(x => {
     x = it(x);

 years(b, p){
   return H(b) + `<div class="yrs">${arr(b.items).map(x => {
     x = it(x);

   const list = a => `<ul class="bl">${arr(a).map(d => `<li>${line(p, d)}</li>`).join('')}</ul>`;
   return H(b, 'Phases') + `<div class="phs">${arr(b.items).map((x, i) => {

       ${g || bd ? `<div class="gb">${g ? `<div class="yg"><span class="lab">Done well</span>${list(x.good)}</div>` : ''}${bd ? `<div class="yx"><span class="lab">Weak</span>${list(x.bad)}</div>` : ''}</div>` : ''}
       ${x.numbers ? `<div class="ph-num"><span class="lab">Numbers</span><p>${fmt(x.numbers)}</p></div>` : ''}

     </div></article>`;
   }).join('')}</div>`;
 },
 flow(b, p){
   const steps = arr(b.steps).map(it); const n = steps.length;
   if(!n) return H(b);
   const avg = steps.reduce((a, s) => a + String(s.text || '').length + arr(s.bullets).map(y => it(y).text || '').join(' ').length, 0) / n;
   const cols = n <= 3 ? n : n === 4 ? (avg > 260 ? 2 : 4) : n <= 6 ? 3 : 4;
   const tpl = Array(cols).fill('minmax(0,1fr)').join(' 44px ');
   let k = 0, out = '';
   for(let r = 0; r * cols < n; r++){
     const chunk = steps.slice(r * cols, r * cols + cols);
     const cells = chunk.map((s, j) => {
       k++;
       const im = s.img && IMG[s.img] ? frame(s.img, s.caption || IMG[s.img].cap, 'r43') : '';
       const bl = arr(s.bullets).length ? `<ul class="bl sm">${arr(s.bullets).map(y => `<li>${line(p, y)}</li>`).join('')}</ul>` : '';
       return (j ? `<span class="farr" aria-hidden="true">${ARROW_H}${ARROW_V}</span>` : '') + `<div class="fstep"><div class="fb"><span class="fn">${k}</span>${s.title ? `<h3>${fmt(s.title)}</h3>` : ''}${s.text ? `<p>${fmt(s.text)}${sup(p, s.src)}</p>` : sup(p, s.src)}${bl}</div>${im}</div>`;
     }).join('');
     out += `<div class="frow" style="--tpl:${tpl}">${cells}</div>`;
     if((r + 1) * cols < n) out += `<div class="fturn" aria-hidden="true"><i></i>${ARROW_V}</div>`;
   }
   return H(b) + `<div class="flow" style="--cols:${cols}">${out}</div>${b.note ? `<p class="note">${fmt(b.note)}</p>` : ''}`;
 },
 mindmap(b, p){
   const br = arr(b.branches).map(it); const nl = Math.ceil(br.length / 2);
   const box = x => {
     const items = arr(x.items).map(y => it(y).text).filter(Boolean);
     return `<div class="mm-b"><h3>${fmt(x.title)}${items.length ? '' : sup(p, x.src)}</h3>${items.length ? `<ul>${items.map((y, j) => `<li>${fmt(y)}${j === items.length - 1 ? sup(p, x.src) : ''}</li>`).join('')}</ul>` : ''}</div>`;
   };
   const left = br.slice(0, nl), right = br.slice(nl);
   return H(b) + `<div class="mm${right.length ? '' : ' one'}"><div class="mm-side mm-l">${left.map(box).join('')}</div><div class="mm-c"><div class="mm-core"><b>${fmt(b.center)}</b>${b.sub ? `<span>${fmt(b.sub)}</span>` : ''}</div></div>${right.length ? `<div class="mm-side mm-r">${right.map(box).join('')}</div>` : ''}</div>`;
 },
 anatomy(b, p){
   const TONES = {art: 'Art, installations', sale: 'Sales', service: 'Services', back: 'Storage, logistics'};
   const zones = arr(b.zones).map(it);
   const tone = z => TONES[z.tone] ? z.tone : 'sale';
   const num = (v, d) => { v = Number(v); return Number.isFinite(v) ? v : d; };
   const r1 = v => Math.round(v * 100) / 100;
   const wrapW = (s, max) => { const lines = []; let cur = ''; String(s || '').split(/\s+/).filter(Boolean).forEach(w => { if(!cur) cur = w; else if((cur + ' ' + w).length <= max) cur += ' ' + w; else { lines.push(cur); cur = w; } }); if(cur) lines.push(cur); return lines; };
   const g = zones.map(z => {
     const x = Math.max(0, Math.min(96, num(z.x, 0))), y = Math.max(0, Math.min(56, num(z.y, 0)));
     const w = Math.max(4, Math.min(100 - x, num(z.w, 20))), h = Math.max(4, Math.min(60 - y, num(z.h, 15)));
     const lh = 2.3, maxc = Math.max(3, Math.floor((w - 3.2) / 1.02));
     let lines = wrapW(z.name, maxc);
     const room = Math.max(0, Math.floor((h - 7.4 - (z.share ? 2 : 0)) / lh) + 1);
     if(lines.length > room){ lines = lines.slice(0, room); if(lines.length) lines[lines.length - 1] += '...'; }
     return `<g class="az az-${tone(z)}"><rect x="${r1(x + .35)}" y="${r1(y + .35)}" width="${r1(w - .7)}" height="${r1(h - .7)}" rx="1.2"/><text class="az-id" x="${r1(x + 1.8)}" y="${r1(y + 1.7)}" dominant-baseline="hanging">${esc(z.id || '')}</text>${lines.map((l, k) => `<text class="az-nm" x="${r1(x + 1.8)}" y="${r1(y + 6.6 + k * lh)}" dominant-baseline="hanging">${esc(l)}</text>`).join('')}${z.share && h >= 9 && w >= 12 ? `<text class="az-sh" x="${r1(x + w - 1.7)}" y="${r1(y + h - 1.7)}" text-anchor="end">${esc(z.share)}</text>` : ''}</g>`;
   }).join('');
   let door = '', doorLab = '';
   const e = b.entrance && typeof b.entrance === 'object' ? b.entrance : null;
   if(e){
     const ex = Math.max(0, Math.min(100, num(e.x, 50))), ey = Math.max(0, Math.min(60, num(e.y, 60)));
     const edge = ey >= 59 ? 'b' : ey <= 1 ? 't' : ex <= 1 ? 'l' : ex >= 99 ? 'r' : 'b';
     if(edge === 'b' || edge === 't'){
       const yy = edge === 'b' ? 60 : 0, d = edge === 'b' ? -1 : 1;
       door = `<line class="ad" x1="${r1(ex - 5)}" y1="${yy}" x2="${r1(ex + 5)}" y2="${yy}"/><path class="adh" d="M${r1(ex - 1.7)},${r1(yy + d * 1.1)} L${r1(ex + 1.7)},${r1(yy + d * 1.1)} L${r1(ex)},${r1(yy + d * 3.9)} z"/>`;
       const lx = Math.max(8, Math.min(92, ex));
       doorLab = `<div class="an-door" style="left:${lx}%;${edge === 't' ? 'top:auto;bottom:calc(100% + 8px)' : ''}">Entrance</div>`;
     } else {
       const xx = edge === 'l' ? 0 : 100, d = edge === 'l' ? 1 : -1;
       door = `<line class="ad" x1="${xx}" y1="${r1(ey - 5)}" x2="${xx}" y2="${r1(ey + 5)}"/><path class="adh" d="M${r1(xx + d * 1.1)},${r1(ey - 1.7)} L${r1(xx + d * 1.1)},${r1(ey + 1.7)} L${r1(xx + d * 3.9)},${r1(ey)} z"/>`;
       doorLab = `<div class="an-door" style="left:50%">Entrance on the ${edge === 'l' ? 'left' : 'right'}</div>`;
     }
   }
   const used = Object.keys(TONES).filter(t => zones.some(z => tone(z) === t));
   const note = b.note && /sơ đồ minh họa/i.test(b.note) ? b.note : ('Illustrative diagram' + (b.note ? '. ' + b.note : ', to be checked in store'));
   return H(b) + `<p class="an-note">${fmt(note)}</p><div class="an-plan"><svg viewBox="0 0 100 60" role="img" aria-label="${esc((b.title || 'Zone map') + ', illustrative diagram')}"><rect class="an-out" x=".2" y=".2" width="99.6" height="59.6" rx="1.4"/>${g}${door}</svg>${doorLab}</div><div class="an-keys">${used.map(t => `<span class="ak"><i class="az-${t}"></i>${TONES[t]}</span>`).join('')}</div><ol class="an-leg">${zones.map(z => `<li><span class="al-id az-${tone(z)}">${esc(z.id || '')}</span><div><b>${fmt(z.name)}</b>${z.share ? `<span class="al-sh">${esc(z.share)}</span>` : ''}${z.text ? `<p>${fmt(z.text)}${sup(p, z.src)}</p>` : sup(p, z.src)}</div></li>`).join('')}</ol>`;
 },
 principles(b, p){
   const N = arr(b.items).length;
   return H(b) + `<div class="grid3">${arr(b.items).map((x, i) => {
     x = it(x);
     const im = x.img && IMG[x.img] ? frame(x.img, x.caption || IMG[x.img].cap, 'r32') : '';
     const rule = x.rule || x.text || '';
     return `<article class="card pc"${spanAttr(N, i, 3, 2)}>${im}<div class="cb"><span class="pn">${pad2(i+1)}</span>${x.title ? `<h3>${fmt(x.title)}</h3>` : ''}${rule ? `<p class="rule">${fmt(rule)}${x.why ? '' : sup(p, x.src)}</p>` : ''}${x.why ? `<p class="why"><b>Why:</b> ${fmt(x.why)}${sup(p, x.src)}</p>` : (rule ? '' : sup(p, x.src))}</div></article>`;
   }).join('')}</div>`;
 },
 cards(b, p){
